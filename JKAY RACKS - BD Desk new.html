document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>BD Desk — JKAY RACKS CRM<\u002Ftitle>\n<style>/* ==========================================================================\n   JKAY RACKS CRM — \"Paper & Clay\" design system\n   Warm, quiet, uncluttered SaaS surface. Light warm-neutral base, one\n   restrained clay accent, thin borders, soft radii, fast 130ms transitions.\n\n   Note: the original --steel-* / --signal-* variable names are preserved and\n   remapped to the new light palette, so existing inline styles in the four\n   pages keep resolving to sensible values with no markup churn.\n   ========================================================================== */\n\n/* vietnamese */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"16684442-ae97-4b40-b571-a0d41b29342c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"473972ef-f326-4eb4-88be-32e059056503\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"83370090-29bf-4318-87ac-1c01d532b1f9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"16684442-ae97-4b40-b571-a0d41b29342c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"473972ef-f326-4eb4-88be-32e059056503\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"83370090-29bf-4318-87ac-1c01d532b1f9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---- Warm neutral ramp (light → dark; names kept from the old system) ---- */\n  --steel-950: #faf9f7;  /* page ground        */\n  --steel-900: #ffffff;  /* panel surface      */\n  --steel-850: #f6f4f0;  /* subtle fill, input */\n  --steel-800: #f1eee8;  /* track, chip fill   */\n  --steel-750: #ebe7df;\n  --steel-700: #e8e4dc;  /* hairline border    */\n  --steel-600: #ded8ce;  /* stronger border    */\n  --steel-500: #8d887f;  /* muted text         */\n  --steel-400: #7c776e;\n  --steel-300: #5f5b54;  /* secondary text     */\n  --steel-200: #46423c;\n  --steel-100: #2a2825;  /* body text          */\n  --steel-50:  #1f1e1c;  /* headings           */\n\n  /* Semantic aliases (preferred in new code) */\n  --paper: var(--steel-950);\n  --surface: var(--steel-900);\n  --surface-sunk: var(--steel-850);\n  --text: var(--steel-100);\n  --text-strong: var(--steel-50);\n  --text-muted: var(--steel-500);\n  --text-secondary: var(--steel-300);\n  --line: var(--steel-700);\n  --line-soft: #f0ece5;\n\n  /* ---- Accent + status (single restrained clay accent) ---- */\n  --signal-amber: #9c6644;              /* the accent */\n  --signal-amber-dim: #d8c3ac;\n  --signal-amber-glow: #f7f0e8;\n  --accent-hover: #85552f;\n  --accent-tint: #f4ece4;\n\n  --signal-red: #b0453c;\n  --signal-red-dim: #f0dedb;\n  --signal-green: #3f7d52;\n  --signal-green-dim: #dbe7de;\n  --signal-blue: #40628f;\n  --signal-violet: #6f5b93;\n\n  /* ---- Surfaces used by the page-level CSS ---- */\n  --sidebar-bg: #f5f2ee;\n  --sidebar-line: #eae6de;\n  --nav-hover: #efece5;\n  --hover-soft: #fbfaf7;\n  --raise-soft: #fdfcfa;\n  --row-line: #f4f0e9;\n  --row-line-strong: #ece8e0;\n  --sel-soft: #fbf7f2;\n  --cursor-soft: #f9f6f1;\n  --band-bg: #2b2620;\n  --band-text: #f2ede5;\n  --band-strong: #fbf8f3;\n  --band-muted: #b3a998;\n  --hatch-a: #ece5db;\n  --hatch-b: #e3dbd0;\n  --avatar-line: #e6dbcf;\n  --scroll-thumb: #e2ddd3;\n  --scrim: rgba(31, 30, 28, 0.28);\n\n  /* ---- Type ---- */\n  --font-display: 'Public Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-mono: 'Public Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;\n\n  /* ---- Structure ---- */\n  --radius-sm: 8px;\n  --radius-md: 10px;\n  --radius-lg: 14px;\n  --border-hairline: 1px solid var(--steel-700);\n  --shadow-panel: 0 1px 2px rgba(31, 30, 28, 0.05);\n  --shadow-raised: 0 4px 14px rgba(31, 30, 28, 0.07);\n  --shadow-modal: 0 20px 50px rgba(31, 30, 28, 0.16);\n  --t: 130ms ease;\n}\n\n/* ==========================================================================\n   Dark theme — same structure, warm dark ramp. Set data-theme=\"dark\" on <html>.\n   ========================================================================== */\n[data-theme=\"dark\"] {\n  --steel-950: #1a1917;\n  --steel-900: #211f1d;\n  --steel-850: #272522;\n  --steel-800: #2e2b28;\n  --steel-750: #35322e;\n  --steel-700: #34312d;\n  --steel-600: #433f39;\n  --steel-500: #9a938a;\n  --steel-400: #a8a199;\n  --steel-300: #bdb6ac;\n  --steel-200: #d6cfc5;\n  --steel-100: #e9e3da;\n  --steel-50:  #f6f1ea;\n\n  --line-soft: #2b2825;\n\n  --signal-amber: #c4855a;\n  --signal-amber-dim: #6d4d34;\n  --signal-amber-glow: #2b231b;\n  --accent-hover: #dda179;\n  --accent-tint: #33291f;\n\n  --signal-red: #d9827a;\n  --signal-red-dim: #4a2b27;\n  --signal-green: #74b189;\n  --signal-green-dim: #24382b;\n  --signal-blue: #86a5d2;\n  --signal-violet: #a99acb;\n\n  --sidebar-bg: #1d1c1a;\n  --sidebar-line: #2c2926;\n  --nav-hover: #2a2724;\n  --hover-soft: #24221f;\n  --raise-soft: #201e1c;\n  --row-line: #262421;\n  --row-line-strong: #2c2926;\n  --sel-soft: #2c2521;\n  --cursor-soft: #252320;\n  --band-bg: #100f0e;\n  --band-text: #ece6dd;\n  --band-strong: #f8f3ec;\n  --band-muted: #a49b8f;\n  --hatch-a: #302d29;\n  --hatch-b: #3a3631;\n  --avatar-line: #4a3e33;\n  --scroll-thumb: #3a3630;\n  --scrim: rgba(8, 8, 7, 0.62);\n\n  --shadow-panel: 0 1px 2px rgba(0, 0, 0, 0.28);\n  --shadow-raised: 0 4px 14px rgba(0, 0, 0, 0.4);\n  --shadow-modal: 0 20px 50px rgba(0, 0, 0, 0.55);\n  color-scheme: dark;\n}\n\n/* Raw-hex rules in this sheet, re-pointed for the dark ground */\n[data-theme=\"dark\"] .sidebar,\n[data-theme=\"dark\"] .sidebar__foot { border-color: var(--sidebar-line); }\n[data-theme=\"dark\"] .nav-item:hover { background: var(--nav-hover); }\n[data-theme=\"dark\"] .avatar { border-color: var(--avatar-line); }\n[data-theme=\"dark\"] .data-table td { border-bottom-color: var(--row-line); }\n[data-theme=\"dark\"] .data-table tbody tr:hover { background: var(--hover-soft); }\n[data-theme=\"dark\"] .modal__foot { background: var(--hover-soft); }\n[data-theme=\"dark\"] .stage-col { border-color: var(--sidebar-line); }\n[data-theme=\"dark\"] .btn-danger:hover { background: #33211f; }\n[data-theme=\"dark\"] .sla-banner { border-color: #45372a; }\n[data-theme=\"dark\"] .sla-banner.critical { background: #33211f; border-color: #4a2b27; }\n[data-theme=\"dark\"] .tag-followup     { background: #222b37; border-color: #2f3a49; }\n[data-theme=\"dark\"] .tag-longfollowup,\n[data-theme=\"dark\"] .tag-transferred  { background: #2a2536; border-color: #382f46; }\n[data-theme=\"dark\"] .tag-cna3         { background: #33211f; border-color: #4a2b27; }\n[data-theme=\"dark\"] .tag-sitevisit,\n[data-theme=\"dark\"] .tag-won          { background: #1e2c23; border-color: #2a3d30; }\n[data-theme=\"dark\"] .tag-highvalue    { background: var(--accent-tint); border-color: #45372a; }\n[data-theme=\"dark\"] ::-webkit-scrollbar-thumb:hover { background: #4a453e; }\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  background: var(--paper);\n  color: var(--text);\n  font-family: var(--font-display);\n  font-size: 15.5px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  min-height: 100vh;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  letter-spacing: -0.012em;\n  margin: 0;\n  color: var(--text-strong);\n}\n\np { text-wrap: pretty; }\n\na { color: var(--signal-amber); text-decoration: none; transition: color var(--t); }\na:hover { color: var(--accent-hover); }\n\nbutton { font-family: inherit; cursor: pointer; }\n::selection { background: var(--accent-tint); color: var(--text-strong); }\n\n:focus-visible {\n  outline: 2px solid var(--signal-amber);\n  outline-offset: 2px;\n  border-radius: 4px;\n}\n\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb {\n  background: var(--scroll-thumb);\n  border-radius: 8px;\n  border: 3px solid var(--paper);\n}\n::-webkit-scrollbar-thumb:hover { background: #d2ccc0; }\n\n/* Legacy decorative hooks — intentionally inert in this system */\n.hazard-strip { display: none; }\n.riveted::before, .riveted::after { content: none; }\n\n/* ---- App shell ---- */\n.app-shell {\n  display: grid;\n  grid-template-columns: 236px 1fr;\n  min-height: 100vh;\n}\n\n.sidebar {\n  background: var(--sidebar-bg);\n  border-right: 1px solid var(--sidebar-line);\n  display: flex;\n  flex-direction: column;\n  position: sticky;\n  top: 0;\n  height: 100vh;\n}\n\n.sidebar__brand {\n  padding: 18px 16px 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n}\n\n.sidebar__brand .plate {\n  font-size: 15.5px;\n  font-weight: 600;\n  letter-spacing: -0.012em;\n  color: var(--text-strong);\n  line-height: 1.25;\n}\n\n.sidebar__brand .plate span { color: var(--signal-amber); }\n\n.sidebar__brand .sub {\n  font-size: 12.5px;\n  color: var(--text-muted);\n  letter-spacing: 0;\n  text-transform: none;\n}\n\n.sidebar__nav {\n  flex: 1;\n  padding: 4px 10px;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n}\n\n.nav-item {\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 8px 10px;\n  border-radius: var(--radius-sm);\n  color: var(--text-secondary);\n  font-size: 14.5px;\n  transition: background var(--t), color var(--t);\n}\n\n.nav-item:hover { background: var(--nav-hover); color: var(--text-strong); }\n\n.nav-item.active {\n  background: var(--surface);\n  color: var(--text-strong);\n  font-weight: 600;\n  box-shadow: var(--shadow-panel);\n}\n\n.nav-item .dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  background: currentColor;\n  opacity: 0.45;\n  flex-shrink: 0;\n}\n.nav-item.active .dot { background: var(--signal-amber); opacity: 1; }\n\n.sidebar__foot {\n  padding: 12px 16px 16px;\n  border-top: 1px solid var(--sidebar-line);\n  font-size: 12.5px;\n  color: var(--text-muted);\n  letter-spacing: 0;\n  display: flex;\n  align-items: center;\n  gap: 7px;\n}\n\n.sidebar__foot .lamp {\n  display: inline-block;\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: var(--signal-green);\n  flex-shrink: 0;\n}\n\n/* ---- Main column ---- */\n.main { min-width: 0; display: flex; flex-direction: column; }\n\n.topbar {\n  height: 62px;\n  border-bottom: 1px solid var(--line-soft);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0 26px;\n  background: var(--paper);\n  position: sticky;\n  top: 0;\n  z-index: 20;\n}\n\n.topbar__title h1 { font-size: 21px; }\n.topbar__title .crumb {\n  font-size: 13px;\n  color: var(--text-muted);\n  letter-spacing: 0;\n  text-transform: none;\n  margin-top: 1px;\n}\n\n.topbar__right { display: flex; align-items: center; gap: 12px; }\n\n.search-box {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  background: var(--surface);\n  border: var(--border-hairline);\n  border-radius: var(--radius-sm);\n  padding: 7px 11px;\n  min-width: 290px;\n  transition: border-color var(--t);\n}\n.search-box:focus-within { border-color: var(--signal-amber-dim); }\n.search-box input {\n  background: transparent;\n  border: none;\n  outline: none;\n  color: var(--text);\n  font-family: inherit;\n  font-size: 14.5px;\n  width: 100%;\n}\n.search-box input::placeholder { color: var(--text-muted); }\n.search-box .kbd {\n  font-size: 12px;\n  color: var(--text-muted);\n  font-variant-numeric: tabular-nums;\n  border: none;\n  padding: 0;\n}\n\n.avatar {\n  width: 32px; height: 32px;\n  border-radius: 50%;\n  background: var(--accent-tint);\n  border: 1px solid var(--avatar-line);\n  display: flex; align-items: center; justify-content: center;\n  font-size: 12.5px;\n  font-weight: 600;\n  color: var(--accent-hover);\n}\n\n.content { padding: 24px 26px 44px; flex: 1; }\n\n/* ---- Panels / cards ---- */\n.panel {\n  background: var(--surface);\n  border: var(--border-hairline);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-panel);\n  position: relative;\n}\n\n.panel__head {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 14px 18px;\n  border-bottom: 1px solid var(--line-soft);\n}\n\n.panel__head h3 { font-size: 15px; letter-spacing: -0.01em; }\n.panel__head .count { color: var(--text-muted); font-size: 12.5px; }\n\n.panel__body { padding: 16px 18px 18px; }\n\n/* ---- Buttons ---- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 8px 13px;\n  border-radius: var(--radius-sm);\n  border: 1px solid var(--steel-600);\n  background: var(--surface);\n  color: var(--text-secondary);\n  font-size: 14px;\n  letter-spacing: 0;\n  text-transform: none;\n  transition: background var(--t), border-color var(--t), color var(--t);\n}\n.btn:hover { background: var(--steel-850); color: var(--text-strong); }\n.btn:active { background: var(--steel-800); }\n\n.btn-signal {\n  background: var(--signal-amber);\n  border-color: var(--signal-amber);\n  color: #fff;\n  font-weight: 600;\n}\n.btn-signal:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }\n\n.btn-outline { background: var(--surface); }\n\n.btn-danger {\n  border-color: var(--signal-red-dim);\n  color: var(--signal-red);\n  background: var(--surface);\n}\n.btn-danger:hover { background: var(--signal-red-dim); color: var(--signal-red); }\n\n.btn-sm { padding: 6px 11px; font-size: 13px; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n\n/* ---- Tags / badges — soft pills, muted tints ---- */\n.tag {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  padding: 3px 9px;\n  font-size: 12px;\n  letter-spacing: 0;\n  text-transform: none;\n  border-radius: 20px;\n  border: 1px solid transparent;\n  font-family: inherit;\n  font-weight: 600;\n  white-space: nowrap;\n}\n.tag::before {\n  content: '';\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  background: currentColor;\n  flex-shrink: 0;\n}\n\n.tag-followup      { color: var(--signal-blue);   background: #eff3f8; border-color: #e0e7f0; }\n.tag-longfollowup  { color: var(--signal-violet); background: #f3effa; border-color: #e6def2; }\n.tag-cna1          { color: var(--text-muted);    background: var(--steel-850); border-color: var(--steel-700); }\n.tag-cna2          { color: var(--accent-hover);  background: var(--signal-amber-glow); border-color: #f0e3d3; }\n.tag-cna3          { color: var(--signal-red);    background: #fbf0ef; border-color: #f2dedb; }\n.tag-transferred   { color: var(--signal-violet); background: #f3effa; border-color: #e6def2; }\n.tag-highvalue     { color: var(--accent-hover);  background: var(--accent-tint); border-color: #e9dbcb; }\n.tag-sitevisit     { color: var(--signal-green);  background: #eef4f0; border-color: #ddeae1; }\n.tag-won           { color: var(--signal-green);  background: #eef4f0; border-color: #ddeae1; }\n.tag-lost          { color: var(--text-muted);    background: var(--steel-850); border-color: var(--steel-700); text-decoration: none; }\n\n/* ---- Notice banner (was: SLA hazard banner) ---- */\n.sla-banner {\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 11px 14px;\n  background: var(--signal-amber-glow);\n  border: 1px solid #f0e3d3;\n  border-radius: var(--radius-md);\n  font-size: 14px;\n  color: var(--accent-hover);\n  margin-bottom: 20px;\n}\n.sla-banner strong { font-weight: 600; }\n.sla-banner.critical {\n  background: #fbf0ef;\n  border-color: #f2dedb;\n  color: var(--signal-red);\n}\n.sla-banner .pulse {\n  width: 7px; height: 7px;\n  border-radius: 50%;\n  background: currentColor;\n  flex-shrink: 0;\n  opacity: 0.9;\n}\n\n/* ---- Lead card ---- */\n.lead-card {\n  border: var(--border-hairline);\n  background: var(--surface);\n  border-radius: var(--radius-lg);\n  padding: 16px 17px;\n  margin-bottom: 12px;\n  box-shadow: var(--shadow-panel);\n  transition: border-color var(--t), box-shadow var(--t);\n}\n.lead-card:hover { border-color: var(--steel-600); box-shadow: var(--shadow-raised); }\n.lead-card.high-value { border-left: 2px solid var(--signal-amber-dim); }\n\n.lead-card__top {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-start;\n  gap: 12px;\n  margin-bottom: 2px;\n}\n.lead-card__name {\n  font-size: 16.5px;\n  font-weight: 600;\n  color: var(--text-strong);\n  letter-spacing: -0.012em;\n  line-height: 1.3;\n}\n.lead-card__meta {\n  font-size: 13px;\n  color: var(--text-muted);\n  margin-top: 2px;\n  font-variant-numeric: tabular-nums;\n}\n.lead-card__tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 11px 0 0; }\n.lead-card__actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }\n\n/* ---- Table ---- */\ntable.data-table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.data-table th {\n  text-align: left;\n  padding: 10px 18px;\n  color: var(--text-muted);\n  font-size: 12px;\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  border-bottom: 1px solid var(--line-soft);\n  font-weight: 600;\n}\n.data-table td {\n  padding: 12px 18px;\n  border-bottom: 1px solid var(--row-line);\n  color: var(--text-secondary);\n}\n.data-table tbody tr { transition: background var(--t); }\n.data-table tbody tr:hover { background: var(--hover-soft); }\n.data-table tbody tr:last-child td { border-bottom: none; }\n\n/* ---- Pipeline stage rail ---- */\n.stage-rail {\n  display: grid;\n  grid-auto-flow: column;\n  gap: 12px;\n  overflow-x: auto;\n  padding-bottom: 6px;\n}\n.stage-col {\n  min-width: 248px;\n  background: var(--steel-850);\n  border: 1px solid var(--sidebar-line);\n  border-radius: var(--radius-lg);\n}\n.stage-col__head {\n  padding: 12px 14px 10px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 8px;\n}\n.stage-col__head h4 { font-size: 14px; letter-spacing: -0.005em; color: var(--text-secondary); }\n.stage-col__count {\n  font-size: 12px;\n  color: var(--text-muted);\n  background: var(--surface);\n  border: 1px solid var(--line-soft);\n  padding: 1px 8px;\n  border-radius: 20px;\n  font-variant-numeric: tabular-nums;\n}\n.stage-col__body { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px;           <div class=\"panel\">\n                  <div class=\"panel__head\"><h3>Deal tags<\u002Fh3><span class=\"count\">Issued by Admin · read-only<\u002Fspan><\u002Fdiv>\n                  <div class=\"panel__body\">\n                    <div id=\"set-taglist\"><\u002Fdiv>\n                    <div class=\"hint\" style=\"margin-top:10px\">These are the only tags you can put on a deal. Admin creates and removes them in the Admin console — ask them if you need a new one.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"set-pane\" id=\"pane-notes\">\n                <div class=\"panel\">\n                  <div class=\"panel__head\"><h3>All my notes<\u002Fh3><span class=\"count\">Private to you<\u002Fspan><\u002Fdiv>\n                  <div class=\"panel__body\"><div id=\"set-notelist\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"panel\">\n                  <div class=\"panel__head\"><h3>Note behaviour<\u002Fh3><span class=\"count\">Applies to every deal<\u002Fspan><\u002Fdiv>\n                  <div class=\"panel__body\">\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">Keep my notes private<\u002Fdiv><div class=\"d\">Off would show them to the CRE who handed the deal over.<\u002Fdiv><\u002Fdiv><div class=\"toggle on\" onclick=\"this.classList.toggle('on')\"><\u002Fdiv><\u002Fdiv>\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">Pinned notes stay on top<\u002Fdiv><div class=\"d\">Pinned notes lead the stack on the deal sheet.<\u002Fdiv><\u002Fdiv><div class=\"toggle on\" onclick=\"this.classList.toggle('on')\"><\u002Fdiv><\u002Fdiv>\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">Carry notes when Admin reassigns a deal<\u002Fdiv><div class=\"d\">Off keeps them with you when the deal moves to another BDE.<\u002Fdiv><\u002Fdiv><div class=\"toggle\" onclick=\"this.classList.toggle('on')\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"set-pane\" id=\"pane-notifications\">\n                <div class=\"panel\">\n                  <div class=\"panel__head\"><h3>What reaches you<\u002Fh3><span class=\"count\">Notification gateway<\u002Fspan><\u002Fdiv>\n                  <div class=\"panel__body\">\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">A CRE hands you a deal<\u002Fdiv><div class=\"d\">Fires the moment ownership moves. Required by policy.<\u002Fdiv><\u002Fdiv><span class=\"readonly-badge\">always on<\u002Fspan><\u002Fdiv>\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">Final-balance alert on won deals<\u002Fdiv><div class=\"d\">Five days before the production run.<\u002Fdiv><\u002Fdiv><span class=\"readonly-badge\">always on<\u002Fspan><\u002Fdiv>\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">Site visit reminder the morning of<\u002Fdiv><div class=\"d\">Sent to you and the engineer on site.<\u002Fdiv><\u002Fdiv><div class=\"toggle on\" onclick=\"this.classList.toggle('on')\"><\u002Fdiv><\u002Fdiv>\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">Quotation unanswered after 7 days<\u002Fdiv><div class=\"d\">Nudges you to chase the client.<\u002Fdiv><\u002Fdiv><div class=\"toggle on\" onclick=\"this.classList.toggle('on')\"><\u002Fdiv><\u002Fdiv>\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">Discount approval decisions from Admin<\u002Fdiv><div class=\"d\">Approved or rejected, with the note.<\u002Fdiv><\u002Fdiv><div class=\"toggle on\" onclick=\"this.classList.toggle('on')\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"panel\">\n                  <div class=\"panel__head\"><h3>Channels<\u002Fh3><span class=\"count\">Where alerts reach you<\u002Fspan><\u002Fdiv>\n                  <div class=\"panel__body\">\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">In-app<\u002Fdiv><div class=\"d\">Always on for balance alerts.<\u002Fdiv><\u002Fdiv><div class=\"toggle on\" onclick=\"this.classList.toggle('on')\"><\u002Fdiv><\u002Fdiv>\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">Email<\u002Fdiv><div class=\"d\">sana.k@jkayracks.in<\u002Fdiv><\u002Fdiv><div class=\"toggle on\" onclick=\"this.classList.toggle('on')\"><\u002Fdiv><\u002Fdiv>\n                    <div class=\"set-row\"><div class=\"set-row__text\"><div class=\"t\">SMS on site-visit days<\u002Fdiv><div class=\"d\">Sent at 8:00 AM when a measurement is booked.<\u002Fdiv><\u002Fdiv><div class=\"toggle on\" onclick=\"this.classList.toggle('on')\"><\u002Fdiv><\u002Fdiv>\n                    <div class=\"set-row\">\n                      <div class=\"set-row__text\"><div class=\"t\">Quiet hours<\u002Fdiv><div class=\"d\">Non-urgent alerts are held until morning.<\u002Fdiv><\u002Fdiv>\n                      <div class=\"flex gap-8\"><input class=\"set-ctl\" type=\"time\" value=\"21:00\"><input class=\"set-ctl\" type=\"time\" value=\"08:00\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"sheet-scrim\" id=\"sheet-scrim\" onclick=\"closeDeal()\"><\u002Fdiv>\n<div class=\"pane-detail\" id=\"pane-detail\"><\u002Fdiv>\n\n<!-- quotation modal -->\n<div class=\"modal-overlay\" id=\"m-quote\">\n  <div class=\"modal\">\n    <div class=\"modal__head\"><h3 id=\"q-title\">New quotation<\u002Fh3><span class=\"modal__close\" onclick=\"closeModal('m-quote')\">✕<\u002Fspan><\u002Fdiv>\n    <div class=\"modal__body\">\n      <div class=\"seg\" id=\"q-mode\" style=\"align-self:flex-start\">\n        <button class=\"on\" onclick=\"setQuoteMode('template')\">Build from template<\u002Fbutton>\n        <button onclick=\"setQuoteMode('file')\">Attach a file<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div id=\"q-template\">\n        <div class=\"d-sec__head\"><h4>Line items<\u002Fh4><span class=\"aux\">JKAY standard rack template<\u002Fspan><\u002Fdiv>\n        <div class=\"quote-lines\" id=\"q-lines\"><\u002Fdiv>\n        <button class=\"btn btn-outline btn-sm\" style=\"margin-top:9px\" onclick=\"addLine()\">+ Add line<\u002Fbutton>\n        <div class=\"qtotal\"><span>Quotation total<\u002Fspan><b id=\"q-total\">₹0<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"q-file\" style=\"display:none\">\n        <div class=\"drop-zone\" id=\"q-drop\" onclick=\"document.getElementById('q-fileinput').click()\">\n          <b style=\"display:block;font-size:14.5px;color:var(--text-secondary);font-weight:600\">Drop the quotation PDF here<\u002Fb>\n          <span>or click to pick a file — it attaches to this deal and to the audit trail<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"file\" id=\"q-fileinput\" style=\"display:none\" onchange=\"pickQuoteFile(this)\">\n        <div class=\"hint\" id=\"q-filename\" style=\"margin-top:8px\"><\u002Fdiv>\n        <div class=\"field\" style=\"margin-top:11px\"><label>Quotation value (₹)<\u002Flabel><input type=\"text\" id=\"q-filevalue\" placeholder=\"e.g. 320000\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"field\"><label>Note on the revision<\u002Flabel><input type=\"text\" id=\"q-note\" placeholder=\"What changed from the last version…\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal__foot\">\n      <button class=\"btn btn-outline\" onclick=\"closeModal('m-quote')\">Cancel<\u002Fbutton>\n      <button class=\"btn btn-signal\" onclick=\"saveQuote()\">Send quotation<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- site visit modal -->\n<div class=\"modal-overlay\" id=\"m-visit\">\n  <div class=\"modal\">\n    <div class=\"modal__head\"><h3>Schedule site measurement<\u002Fh3><span class=\"modal__close\" onclick=\"closeModal('m-visit')\">✕<\u002Fspan><\u002Fdiv>\n    <div class=\"modal__body\">\n      <div class=\"grid-2\">\n        <div class=\"field\"><label>Date<\u002Flabel><input type=\"date\" id=\"v-date\" value=\"2026-08-25\"><\u002Fdiv>\n        <div class=\"field\"><label>Time<\u002Flabel><input type=\"time\" id=\"v-time\" value=\"11:00\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\"><label>Engineer on site<\u002Flabel>\n        <select id=\"v-eng\"><option>Sana Kapoor · BDE<\u002Foption><option>Ravi Bhosale · Measurement<\u002Foption><option>Faisal Sheikh · Measurement<\u002Foption><\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"field\"><label>Note for the engineer<\u002Flabel><textarea id=\"v-note\" placeholder=\"Access, floor height, existing racking to be removed…\"><\u002Ftextarea><\u002Fdiv>\n      <div class=\"hint\">Scheduling a visit moves the deal to <b>Site measurement<\u002Fb> and notifies the CRE who handed it over.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal__foot\">\n      <button class=\"btn btn-outline\" onclick=\"closeModal('m-visit')\">Cancel<\u002Fbutton>\n      <button class=\"btn btn-signal\" onclick=\"saveVisit()\">Book visit<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- CAD revision modal -->\n<div class=\"modal-overlay\" id=\"m-cad\">\n  <div class=\"modal\">\n    <div class=\"modal__head\"><h3>Upload CAD revision<\u002Fh3><span class=\"modal__close\" onclick=\"closeModal('m-cad')\">✕<\u002Fspan><\u002Fdiv>\n    <div class=\"modal__body\">\n      <div class=\"drop-zone\" id=\"c-drop\" onclick=\"document.getElementById('c-fileinput').click()\">\n        <b style=\"display:block;font-size:14.5px;color:var(--text-secondary);font-weight:600\">Drop the drawing here<\u002Fb>\n        <span>DWG, DXF or PDF — the revision number is assigned automatically<\u002Fspan>\n      <\u002Fdiv>\n      <input type=\"file\" id=\"c-fileinput\" style=\"display:none\" onchange=\"pickCadFile(this)\">\n      <div class=\"hint\" id=\"c-filename\"><\u002Fdiv>\n      <div class=\"field\"><label>What changed<\u002Flabel><input type=\"text\" id=\"c-note\" placeholder=\"e.g. bay pitch reduced to 2400mm on the client's request\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal__foot\">\n      <button class=\"btn btn-outline\" onclick=\"closeModal('m-cad')\">Cancel<\u002Fbutton>\n      <button class=\"btn btn-signal\" onclick=\"saveCad()\">Add revision<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- payment modal -->\n<div class=\"modal-overlay\" id=\"m-pay\">\n  <div class=\"modal\">\n    <div class=\"modal__head\"><h3>Record a payment<\u002Fh3><span class=\"modal__close\" onclick=\"closeModal('m-pay')\">✕<\u002Fspan><\u002Fdiv>\n    <div class=\"modal__body\">\n      <div class=\"grid-2\">\n        <div class=\"field\"><label>Kind<\u002Flabel><select id=\"p-kind\"><option>Advance<\u002Foption><option>Installment<\u002Foption><option>Final balance<\u002Foption><\u002Fselect><\u002Fdiv>\n        <div class=\"field\"><label>Amount (₹)<\u002Flabel><input type=\"text\" id=\"p-amount\" placeholder=\"150000\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grid-2\">\n        <div class=\"field\"><label>Received on<\u002Flabel><input type=\"date\" id=\"p-date\" value=\"2026-08-23\"><\u002Fdiv>\n        <div class=\"field\"><label>Mode<\u002Flabel><select id=\"p-mode\"><option>NEFT<\u002Foption><option>RTGS<\u002Foption><option>UPI<\u002Foption><option>Cheque<\u002Foption><option>Cash<\u002Foption><\u002Fselect><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\">The balance bar, the ledger and the final-balance alert all recompute from this entry.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal__foot\">\n      <button class=\"btn btn-outline\" onclick=\"closeModal('m-pay')\">Cancel<\u002Fbutton>\n      <button class=\"btn btn-signal\" onclick=\"savePayment()\">Record payment<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- lost modal -->\n<div class=\"modal-overlay\" id=\"m-lost\">\n  <div class=\"modal\">\n    <div class=\"modal__head\"><h3>Mark this deal lost<\u002Fh3><span class=\"modal__close\" onclick=\"closeModal('m-lost')\">✕<\u002Fspan><\u002Fdiv>\n    <div class=\"modal__body\">\n      <div class=\"field\"><label>Reason <span class=\"req\">*<\u002Fspan><\u002Flabel><select id=\"l-reason\"><\u002Fselect><\u002Fdiv>\n      <div class=\"field\"><label>What happened<\u002Flabel><textarea id=\"l-note\" placeholder=\"Competitor name, price gap, timeline mismatch…\"><\u002Ftextarea><\u002Fdiv>\n      <div class=\"hint\">A reason is mandatory. The deal leaves the working pipeline and the CRE who handed it over is notified.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal__foot\">\n      <button class=\"btn btn-outline\" onclick=\"closeModal('m-lost')\">Cancel<\u002Fbutton>\n      <button class=\"btn btn-danger\" onclick=\"saveLost()\">Mark lost<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"modal-overlay\" id=\"m-call\">\n  <div class=\"modal\">\n    <div class=\"modal__head\"><h3 id=\"call-h\">Call<\u002Fh3><span class=\"modal__close\" onclick=\"closeModal('m-call')\">✕<\u002Fspan><\u002Fdiv>\n    <div class=\"modal__body\">\n      <div class=\"edit-note\" style=\"margin:0 0 4px\"><span>◆<\u002Fspan><span id=\"call-to\"><\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><label>What came out of the call <span class=\"req\">*<\u002Fspan><\u002Flabel>\n        <textarea id=\"call-note\" placeholder=\"Decision maker, objection, what you promised to send next…\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <div class=\"hint\">The summary lands in this deal's activity log against your name.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal__foot\">\n      <button class=\"btn btn-outline\" onclick=\"closeModal('m-call')\">Cancel<\u002Fbutton>\n      <button class=\"btn btn-signal\" onclick=\"saveCall()\">Log call<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"modal-overlay\" id=\"m-msg\">\n  <div class=\"modal\">\n    <div class=\"modal__head\"><h3 id=\"msg-h\">Message<\u002Fh3><span class=\"modal__close\" onclick=\"closeModal('m-msg')\">✕<\u002Fspan><\u002Fdiv>\n    <div class=\"modal__body\">\n      <div class=\"edit-note\" style=\"margin:0 0 4px\"><span>◆<\u002Fspan><span id=\"msg-to\"><\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><label>Template<\u002Flabel>\n        <div class=\"tag-pick\" id=\"msg-templates\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\"><label>Message<\u002Flabel><textarea id=\"msg-body\" rows=\"4\"><\u002Ftextarea><\u002Fdiv>\n      <div class=\"hint\" id=\"msg-hint\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal__foot\">\n      <button class=\"btn btn-outline\" onclick=\"closeModal('m-msg')\">Cancel<\u002Fbutton>\n      <button class=\"btn btn-signal\" onclick=\"sendMsg()\">Send<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<script src=\"a4001abc-f3d3-404e-b818-c29f481b3e79\"><\u002Fscript>\n<script>\n/* ============================ reference lists ============================ */\nconst ME = 'Sana Kapoor';\nconst STAGES = [\n  { k: 'site',        label: 'Site measurement',         crumb: 'Handed over · measurement to be booked', rule: 'Value stays hidden until a quote goes out' },\n  { k: 'layout',      label: 'Plan layout needed',       crumb: 'Measured · CAD drawing in progress',      rule: 'A CAD revision is expected before quoting' },\n  { k: 'quote',       label: 'Quotation sent',           crumb: 'Priced · waiting on the client',          rule: 'Value becomes visible from here on' },\n  { k: 'negotiation', label: 'Negotiation',              crumb: 'Client is pushing on price or scope',     rule: 'Discounts past 8% need Admin approval' },\n  { k: 'awaiting',    label: 'All okay / awaiting advance', crumb: 'Agreed · advance not yet received',    rule: 'Advance receipt converts the deal to Won' },\n  { k: 'won',         label: 'Won',                      crumb: 'Contract live · payments tracked',        rule: 'Payment module owns the balance' },\n  { k: 'lost',        label: 'Lost',                     crumb: 'Closed lost · every record has a reason', rule: 'Reason is mandatory' },\n];\nconst SK = STAGES.reduce((a, s) => (a[s.k] = s, a), {});\nconst ICON = {\n  phone: '<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"><path d=\"M3 2.6h2.2l1 2.5-1.4 1a7.4 7.4 0 0 0 3.7 3.7l1-1.4 2.5 1V11a2 2 0 0 1-2.2 2A9.6 9.6 0 0 1 2 4.8 2 2 0 0 1 3 2.6Z\"/><\u002Fsvg>',\n  wa: '<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2.5 13.5l.9-2.8A5.6 5.6 0 1 1 5.6 12.8l-3.1.7Z\"/><path d=\"M6 6.2c.3 1.6 2 3.3 3.6 3.6l.7-.9 1.2.5-.2 1a3.9 3.9 0 0 1-4-1.4A4 4 0 0 1 5.6 5l1-.2.5 1.2-.9.2Z\"/><\u002Fsvg>',\n  msg: '<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2.6 3.4h10.8v7.2H6.4L3.4 13v-2.4H2.6Z\"/><\u002Fsvg>',\n};\nconst CRE_PHONE = { 'Arjun Mehta': '+91 98200 41118', 'Priya R.': '+91 98200 41126', 'Sana Kapoor': '+91 98200 41102' };\nconst MSG_TEMPLATES = {\n  client: [\n    ['Visit confirmation', 'Hello {contact}, confirming our site measurement visit. Our engineer will carry the measuring kit — please keep the floor area accessible.'],\n    ['Layout shared', 'Hello {contact}, sharing the CAD layout for {client}. Do review the aisle widths and let me know if anything needs to change.'],\n    ['Quotation follow-up', 'Hello {contact}, following up on the quotation we sent for
