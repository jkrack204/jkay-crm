es(); }\n  window.scrollTo(0, 0);\n}\n\n/* ============================ pipeline ============================ */\nfunction setMode(m) {\n  mode = m;\n  document.querySelectorAll('#seg-mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));\n  renderPipe();\n}\nfunction setTag(t) { tagFilter = tagFilter === t ? null : t; renderPipe(); }\n\nfunction renderStagebar() {\n  const s = scope === 'all' ? null : SK[scope];\n  document.getElementById('stagebar').innerHTML = `\n    <span class=\"sn\">${s ? 'Stage ' + (STAGES.findIndex(x => x.k === scope) + 1) + ' of 7' : 'All stages'}<\u002Fspan>\n    <span class=\"sd\"><b>${s ? esc(s.label) : 'My deals'}<\u002Fb> · ${esc(s ? s.crumb : 'Site measurement → won. Lost deals sit in their own list.')}<\u002Fspan>\n    <span class=\"rule\"><span class=\"lk\"><\u002Fspan>${esc(s ? s.rule : 'Value shows from Quotation sent onwards')}<\u002Fspan>`;\n}\nfunction renderTagFilter() {\n  document.getElementById('tagfilter').innerHTML = MY_TAGS.map(t =>\n    `<button class=\"${tagFilter === t ? 'on' : ''}\" onclick=\"setTag('${t.replace(/'/g, \"\\\\'\")}')\">${esc(t)}<\u002Fbutton>`).join('');\n}\nfunction renderPipe() {\n  renderStagebar(); renderTagFilter(); renderCounts();\n  const rows = filtered();\n  document.getElementById('row-count').textContent = rows.length + (rows.length === 1 ? ' deal' : ' deals');\n  document.getElementById('rows').style.display = mode === 'list' ? '' : 'none';\n  document.getElementById('board').style.display = mode === 'board' ? 'grid' : 'none';\n  if (mode === 'list') renderRows(rows); else renderBoard(rows);\n}\nfunction valueCell(d) {\n  if (d.stage === 'lost') return `<div class=\"row__val q\">${d.quotes.length ? money(dealValue(d)) + ' quoted' : 'Never quoted'}<\u002Fdiv>`;\n  if (!isQuoted(d)) return `<div class=\"row__val q\">Not quoted yet<\u002Fdiv>`;\n  return `<div class=\"row__val\">${money(dealValue(d))}<\u002Fdiv>`;\n}\nfunction subLine(d) {\n  if (d.stage === 'won') { const b = balance(d); return b ? `Balance ${money(b)} of ${money(d.contract)}` : 'Fully paid'; }\n  if (d.stage === 'lost') return 'Reason: ' + (d.lostReason || '—');\n  if (d.stage === 'site') return d.visit ? `Visit ${d.visit.date}, ${d.visit.time}` : 'Measurement not booked';\n  if (d.stage === 'layout') return d.cad.length ? `CAD rev ${d.cad[d.cad.length - 1].rev} · ${d.cad[d.cad.length - 1].date}` : 'No drawing yet';\n  if (d.stage === 'quote') return `Quote v${d.quotes.length} sent ${d.quotes[d.quotes.length - 1]?.date || ''}`;\n  if (d.stage === 'negotiation') return 'In negotiation on quote v' + d.quotes.length;\n  if (d.stage === 'awaiting') return 'Agreed · advance not received';\n  return '';\n}\nfunction renderRows(rows) {\n  const el = document.getElementById('rows');\n  if (!rows.length) { el.innerHTML = `<div class=\"empty\">No deals in this list.<\u002Fdiv>`; return; }\n  el.innerHTML = rows.map(d => `\n    <div class=\"row ${sel === d.id ? 'sel' : ''}\" onclick=\"openDeal(${d.id})\">\n      <div class=\"row__main\">\n        <div class=\"row__l1\">\n          <span class=\"row__name\">${esc(d.client)}<\u002Fspan>\n          <span class=\"stage-chip\" data-s=\"${d.stage}\">${esc(SK[d.stage].label)}<\u002Fspan>\n          ${d.tags.slice(0, 2).map(t => tagHtml(t)).join('')}\n        <\u002Fdiv>\n        <div class=\"row__l2\">\n          <span class=\"plat\" data-p=\"${esc(d.platform)}\"><i><\u002Fi>${esc(d.platform)}<\u002Fspan>\n          <span>${esc(d.place)}<\u002Fspan><span class=\"dot\"><\u002Fspan>\n          <span>from ${esc(d.cre)}<\u002Fspan><span class=\"dot\"><\u002Fspan>\n          <span>${esc(d.req.length > 52 ? d.req.slice(0, 52) + '…' : d.req)}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row__right\">\n        ${valueCell(d)}\n        <div class=\"row__due ${d.stage === 'won' && balance(d) > 0 ? 'hot' : ''}\">${esc(subLine(d))}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\nfunction renderBoard(rows) {\n  document.getElementById('board').innerHTML = STAGES.map(st => {\n    const list = rows.filter(d => d.stage === st.k);\n    const sum = list.filter(isQuoted).reduce((a, d) => a + dealValue(d), 0);\n    return `<div class=\"bcol\" data-stage=\"${st.k}\"\n        ondragover=\"event.preventDefault();this.classList.add('drop')\"\n        ondragleave=\"this.classList.remove('drop')\"\n        ondrop=\"dropOn(event,'${st.k}')\">\n      <div class=\"bcol__head\"><h4>${esc(st.label)}<\u002Fh4><span class=\"c\">${list.length}<\u002Fspan><\u002Fdiv>\n      <div class=\"bcol__sum\">${QUOTED_FROM.includes(st.k) && sum ? short(sum) + ' quoted' : '—'}<\u002Fdiv>\n      <div class=\"bcol__body\">\n        ${list.map(d => `\n          <div class=\"bcard\" draggable=\"true\" ondragstart=\"dragStart(event,${d.id})\" ondragend=\"this.classList.remove('dragging')\" onclick=\"openDeal(${d.id})\">\n            <div class=\"bcard__c\">${esc(d.client)}<\u002Fdiv>\n            <div class=\"bcard__v ${isQuoted(d) ? '' : 'q'}\">${isQuoted(d) ? money(dealValue(d)) : 'Not quoted yet'}<\u002Fdiv>\n            <div class=\"bcard__m\">${esc(subLine(d))}<\u002Fdiv>\n            <div class=\"bcard__f\"><span class=\"plat\" data-p=\"${esc(d.platform)}\"><i><\u002Fi>${esc(d.platform)}<\u002Fspan>${d.tags.slice(0, 1).map(t => tagHtml(t)).join('')}<\u002Fdiv>\n          <\u002Fdiv>`).join('') || '<div class=\"bempty\">Nothing here<\u002Fdiv>'}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\nfunction dragStart(e, id) { dragId = id; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }\nfunction dropOn(e, stage) {\n  e.preventDefault();\n  document.querySelectorAll('.bcol').forEach(c => c.classList.remove('drop'));\n  const d = DEALS.find(x => x.id === dragId); dragId = null;\n  if (!d || d.stage === stage) return;\n  if (stage === 'lost') { sel = d.id; openLost(); return; }\n  moveStage(d, stage);\n}\nfunction moveStage(d, stage) {\n  const from = SK[d.stage].label;\n  if (stage === 'quote' && !d.quotes.length) { showToast('Send a quotation before moving it to Quotation sent'); return; }\n  if (stage === 'won' && !d.quotes.length) { showToast('A won deal needs a signed quotation'); return; }\n  d.stage = stage;\n  if (stage === 'won' && !d.contract) d.contract = dealValue(d);\n  if (stage !== 'lost') d.lostReason = '';\n  d.log.unshift({ who: ME, t: 'Stage moved to ' + SK[stage].label, m: 'Was ' + from + '.', at: stamp() });\n  pushNotif('handoff', d.client, 'Stage moved to ' + SK[stage].label, 'The CRE who handed this over now sees the new stage, read-only.');\n  showToast(d.client + ' → ' + SK[stage].label);\n  renderPipe(); if (sel === d.id) openDeal(d.id, true);\n}\n\n/* ============================ deal sheet ============================ */\nfunction openDeal(id, keepScroll) {\n  const d = DEALS.find(x => x.id === id); if (!d) return;\n  sel = id;\n  const q = d.quotes[d.quotes.length - 1];\n  const showMoney = isQuoted(d) || d.stage === 'won';\n  document.getElementById('pane-detail').innerHTML = `\n    <div class=\"d-scroll\">\n      <div class=\"d-band\">\n        <span class=\"sheet-close\" onclick=\"closeDeal()\">✕<\u002Fspan>\n        <div class=\"d-band__top\">\n          <div>\n            <h2>${esc(d.client)}<\u002Fh2>\n            <div class=\"who\">${esc(d.contact)} · ${esc(d.phone)} · ${esc(d.place)}<\u002Fdiv>\n            <div class=\"d-contact\">\n              <span class=\"cbtn__who\">Client<\u002Fspan>\n              <button class=\"cbtn\" onclick=\"openCall('client')\">${ICON.phone}Call<\u002Fbutton>\n              <button class=\"cbtn wa\" onclick=\"openMsg('client','wa')\">${ICON.wa}WhatsApp<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"val\">${showMoney ? money(dealValue(d)) : '—'}<small>${showMoney ? (d.stage === 'won' ? 'contract value' : 'quotation v' + d.quotes.length) : 'no quotation issued'}<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"d-band__foot\">\n          <span class=\"stage-chip\" data-s=\"${d.stage}\">${esc(SK[d.stage].label)}<\u002Fspan>\n          <span class=\"plat\" data-p=\"${esc(d.platform)}\"><i><\u002Fi>${esc(d.platform)}<\u002Fspan>\n          ${d.stage === 'lost' ? `<span class=\"tag\">${esc(d.lostReason)}<\u002Fspan>` : ''}\n          <span style=\"flex:1\"><\u002Fspan>\n          ${d.stage === 'lost' ? `<button class=\"btn\" onclick=\"moveStage(DEALS.find(x=>x.id===${d.id}),'negotiation')\">Reopen<\u002Fbutton>` : `\n            <div class=\"stagedd\" id=\"stagedd\">\n              <button class=\"stagedd__btn\" onclick=\"toggleStageDD(event)\">${esc(SK[d.stage].label)}<i>▾<\u002Fi><\u002Fbutton>\n              <div class=\"stagedd__menu\">\n                ${STAGES.filter(s => s.k !== 'lost').map((s, i) => `<div class=\"stagedd__item ${s.k === d.stage ? 'on' : ''}\" onclick=\"pickStage('${s.k}')\"><span class=\"n\">${i + 1}<\u002Fspan>${esc(s.label)}<\u002Fdiv>`).join('')}\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn\" onclick=\"openVisit()\">Schedule visit<\u002Fbutton>\n            <button class=\"btn\" onclick=\"openCad()\">CAD revision<\u002Fbutton>\n            <button class=\"btn btn-signal\" onclick=\"openQuote()\">New quotation<\u002Fbutton>\n            ${d.stage === 'won' ? `<button class=\"btn\" onclick=\"openPay()\">Record payment<\u002Fbutton>` : ''}\n            <button class=\"btn\" onclick=\"openLost()\">Mark lost<\u002Fbutton>`}\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"d-body\">\n        <div class=\"d-sec\">\n          <div class=\"d-sec__head\"><h4>Handed over by the CRE desk<\u002Fh4><span class=\"aux\">${esc(d.handedAt)}<\u002Fspan><\u002Fdiv>\n          <div class=\"edit-note\"><span>◆<\u002Fspan>Everything in this block was written by ${esc(d.cre)} before hand-off. Platform and source carry over untouched.<\u002Fdiv>\n          <div class=\"kv\">\n            <div><dt>Requirement<\u002Fdt><dd>${esc(d.req)}<\u002Fdd><\u002Fdiv>\n            <div><dt>Category<\u002Fdt><dd>${esc(d.category)}<\u002Fdd><\u002Fdiv>\n            <div><dt>Handed over by<\u002Fdt><dd class=\"locked\"><span class=\"cre-line\">${esc(d.cre)}\n              <button class=\"mini\" onclick=\"openCall('cre')\">${ICON.phone}Call<\u002Fbutton>\n              <button class=\"mini\" onclick=\"openMsg('cre','wa')\">${ICON.wa}WhatsApp<\u002Fbutton>\n            <\u002Fspan><\u002Fdd><\u002Fdiv>\n            <div><dt>Platform<\u002Fdt><dd class=\"locked\">${esc(d.platform)}<\u002Fdd><\u002Fdiv>\n            <div><dt>Lead source<\u002Fdt><dd class=\"locked\">${esc(d.source)}<\u002Fdd><\u002Fdiv>\n            <div><dt>Estimate at hand-off<\u002Fdt><dd class=\"locked\">${money(d.est)}<\u002Fdd><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"d-sec__head\" style=\"margin:14px 0 9px\"><h4>Site photos from the CRE<\u002Fh4><span class=\"aux\">${d.photos} attached<\u002Fspan><\u002Fdiv>\n          <div class=\"photos\">${Array.from({ length: Math.min(d.photos, 6) }).map((_, i) => `<div class=\"photo\">IMG_${100 + i}<\u002Fdiv>`).join('')}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"d-sec\">\n          <div class=\"d-sec__head\"><h4>Site measurement<\u002Fh4><span class=\"aux\">${d.visit ? esc(d.visit.status === 'done' ? 'measured' : 'booked') : 'not booked'}<\u002Fspan><\u002Fdiv>\n          ${d.visit ? `\n            <div class=\"frow\">\n              <span class=\"rev ${d.visit.status === 'done' ? '' : 'live'}\">⌖<\u002Fspan>\n              <div><div class=\"t\">${esc(d.visit.date)} · ${esc(d.visit.time)}<\u002Fdiv><div class=\"m\">${esc(d.visit.eng)}${d.visit.note ? ' — ' + esc(d.visit.note) : ''}<\u002Fdiv><\u002Fdiv>\n              <div class=\"a\">${d.visit.status === 'done'\n                ? '<span class=\"readonly-badge\">measured<\u002Fspan>'\n                : `<button class=\"btn btn-outline btn-sm\" onclick=\"markMeasured()\">Mark measured<\u002Fbutton><button class=\"btn btn-outline btn-sm\" onclick=\"openVisit()\">Reschedule<\u002Fbutton>`}<\u002Fdiv>\n            <\u002Fdiv>` : `<div class=\"dash-empty\">No measurement booked. The layout can't be drawn until the site is measured.<\u002Fdiv>\n            <button class=\"btn btn-outline btn-sm\" style=\"margin-top:8px\" onclick=\"openVisit()\">Schedule site measurement<\u002Fbutton>`}\n        <\u002Fdiv>\n\n        <div class=\"d-sec\">\n          <div class=\"d-sec__head\"><h4>CAD &amp; drawings<\u002Fh4><span class=\"aux\">${d.cad.length} revision${d.cad.length === 1 ? '' : 's'}<\u002Fspan><\u002Fdiv>\n          ${d.cad.length ? d.cad.slice().reverse().map((c, i) => `\n            <div class=\"frow\">\n              <span class=\"rev ${i === 0 ? 'live' : ''}\">R${c.rev}<\u002Fspan>\n              <div><div class=\"t\">${esc(c.file)}<\u002Fdiv><div class=\"m\">${esc(c.note)} · ${esc(c.date)} · ${esc(c.by)}<\u002Fdiv><\u002Fdiv>\n              <div class=\"a\">${i === 0 ? '<span class=\"readonly-badge\">current<\u002Fspan>' : ''}<button class=\"btn btn-outline btn-sm\" onclick=\"showToast('Opening ${esc(c.file)}')\">Open<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>`).join('') : '<div class=\"dash-empty\">No drawing uploaded yet.<\u002Fdiv>'}\n          <button class=\"btn btn-outline btn-sm\" style=\"margin-top:10px\" onclick=\"openCad()\">Upload revision<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"d-sec\">\n          <div class=\"d-sec__head\"><h4>Quotations<\u002Fh4><span class=\"aux\">${d.quotes.length ? 'latest v' + d.quotes.length : 'none sent'}<\u002Fspan><\u002Fdiv>\n          ${d.quotes.length ? d.quotes.slice().reverse().map((qq, i) => `\n            <div class=\"frow\">\n              <span class=\"rev ${i === 0 ? 'live' : ''}\">v${qq.v}<\u002Fspan>\n              <div><div class=\"t\">${qq.mode === 'file' ? esc(qq.file) : 'Built from the JKAY template'}<\u002Fdiv><div class=\"m\">${esc(qq.note || '')} · sent ${esc(qq.date)} · ${esc(qq.by)}<\u002Fdiv><\u002Fdiv>\n              <div class=\"a\"><span class=\"amt\">${money(qq.amount)}<\u002Fspan><button class=\"btn btn-outline btn-sm\" onclick=\"showToast('Quotation v${qq.v} opened')\">Open<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>`).join('') : '<div class=\"dash-empty\">Nothing quoted yet — value stays hidden until the first quotation goes out.<\u002Fdiv>'}\n          <button class=\"btn btn-outline btn-sm\" style=\"margin-top:10px\" onclick=\"openQuote()\">New quotation<\u002Fbutton>\n        <\u002Fdiv>\n\n        ${d.stage === 'won' ? `\n        <div class=\"d-sec\">\n          <div class=\"d-sec__head\"><h4>Payments<\u002Fh4><span class=\"aux\">${balance(d) ? money(balance(d)) + ' outstanding' : 'fully paid'}<\u002Fspan><\u002Fdiv>\n          <div class=\"pay-row\"><span>Contract value<\u002Fspan><strong>${money(d.contract)}<\u002Fstrong><\u002Fdiv>\n          ${d.payments.map(p => `<div class=\"pay-row\"><span>${esc(p.kind)} · ${esc(p.date)} · ${esc(p.mode)}<\u002Fspan><strong style=\"color:var(--signal-green)\">${money(p.amount)}<\u002Fstrong><\u002Fdiv>`).join('')}\n          <div class=\"pay-row\"><span>Remaining balance<\u002Fspan><strong style=\"color:${balance(d) ? 'var(--accent-hover)' : 'var(--signal-green)'}\">${money(balance(d))}<\u002Fstrong><\u002Fdiv>\n          <div class=\"bal-bar\"><div style=\"width:${Math.round(paid(d) / (d.contract || 1) * 100)}%\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"flex gap-8 mt-16\">\n            <button class=\"btn btn-signal btn-sm\" onclick=\"openPay()\">Record payment<\u002Fbutton>\n            <button class=\"btn btn-outline btn-sm\" onclick=\"showToast('Balance reminder sent to ${esc(d.contact)}')\">Send balance reminder<\u002Fbutton>\n            <button class=\"btn btn-outline btn-sm\" onclick=\"showToast('Audit trail opened — measurement, CAD, quotes, payments')\">Complete trail<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>` : ''}\n\n        <div class=\"d-sec\">\n          <div class=\"d-sec__head\"><h4>Your tags<\u002Fh4><span class=\"aux\">yours only · admin stages are separate<\u002Fspan><\u002Fdiv>\n          <div class=\"tagbox\">${d.tags.length ? d.tags.map(t => tagHtml(t, true)).join('') : '<span class=\"dash-empty\">No tags on this deal.<\u002Fspan>'}<\u002Fdiv>\n          <div class=\"tag-lock\">Admin decides which tags exist. Pick one below — you can’t create your own.<\u002Fdiv>\n          <div class=\"tag-pick\">${MY_TAGS.filter(t => !d.tags.includes(t)).map(t => `<button onclick=\"addTag('${t.replace(/'/g, \"\\\\'\")}')\">${esc(t)}<\u002Fbutton>`).join('')}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"d-sec\">\n          <div class=\"d-sec__head\"><h4>My notes<\u002Fh4><span class=\"aux\">private to you · ${d.notes.length} note${d.notes.length === 1 ? '' : 's'}<\u002Fspan><\u002Fdiv>\n          <div class=\"note-new\">\n            <textarea id=\"note-input\" placeholder=\"What you'd want to remember before the next call — who really decides, what the objection is, what not to repeat…\"><\u002Ftextarea>\n            <div class=\"r\">\n              <div class=\"swatches\">${NOTE_COLORS.map((c, i) => `<span class=\"swatch ${c === noteColor ? 'on' : ''}\" data-i=\"${i}\" style=\"background:${c}\" onclick=\"pickNoteColor(${i})\"><\u002Fspan>`).join('')}<\u002Fdiv>\n              <button class=\"btn btn-signal btn-sm\" style=\"margin-left:auto\" onclick=\"addNote()\">Add note<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"notes-stack\">${sortedNotes(d).map(n => `\n            <div class=\"note ${n.pin ? 'pin' : ''}\" style=\"background:${n.color}\">\n              <p>${esc(n.text)}<\u002Fp>\n              <div class=\"note__foot\"><span>${esc(n.at)}<\u002Fspan>\n                <span class=\"note__act\">\n                  <span onclick=\"pinNote(${n.id})\">${n.pin ? 'Unpin' : 'Pin'}<\u002Fspan>\n                  <span onclick=\"delNote(${n.id})\">Delete<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>`).join('') || '<div class=\"dash-empty\">No notes on this deal yet.<\u002Fdiv>'}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"d-sec\">\n          <div class=\"d-sec__head\"><h4>Activity<\u002Fh4><span class=\"aux\">${d.log.length} entries<\u002Fspan><\u002Fdiv>\n          <div class=\"tl\">${d.log.map(e => {\n            const r = REPS[e.who] || REPS.System;\n            return `<div class=\"tl-item\">\n              <span class=\"tl-av\" style=\"background:${r.bg};color:${r.fg}\">${r.init}<\u002Fspan>\n              <div class=\"tl-body\"><div class=\"t\">${esc(e.t)}<\u002Fdiv><div class=\"m\">${esc(e.m)}<\u002Fdiv><div class=\"m\" style=\"font-variant-numeric:tabular-nums\">${esc(e.who)} · ${esc(e.at)}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>`;\n          }).join('')}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  document.getElementById('pane-detail').classList.add('on');\n  document.getElementById('sheet-scrim').classList.add('on');\n  if (!keepScroll) document.querySelector('#pane-detail .d-scroll').scrollTop = 0;\n  if (mode === 'list') renderRows(filtered());\n}\n/* ============================ stage picker ============================ */\nfunction toggleStageDD(e) {\n  e.stopPropagation();\n  document.getElementById('stagedd')?.classList.toggle('open');\n}\nfunction pickStage(k) {\n  document.getElementById('stagedd')?.classList.remove('open');\n  const d = current(); if (!d || d.stage === k) return;\n  moveStage(d, k);\n}\ndocument.addEventListener('click', e => {\n  const dd = document.getElementById('stagedd');\n  if (dd && !dd.contains(e.target)) dd.classList.remove('open');\n});\n\n/* ============================ call & message ============================ */\nlet contactWho = 'client', msgChan = 'wa';\nconst partyName = (d, who) => who === 'cre' ? d.cre : d.contact;\nconst partyPhone = (d, who) => who === 'cre' ? (CRE_PHONE[d.cre] || '+91 98200 41100') : d.phone;\n\nfunction openCall(who) {\n  const d = current(); if (!d) return;\n  contactWho = who;\n  document.getElementById('call-h').textContent = who === 'cre' ? 'Call the CRE' : 'Call the client';\n  document.getElementById('call-to').textContent =\n    'Dialling ' + partyName(d, who) + ' · ' + partyPhone(d, who) + (who === 'cre' ? ' · CRE desk, handed this deal over' : ' · ' + d.place);\n  document.getElementById('call-note').value = '';\n  openModal('m-call');\n}\nfunction saveCall() {\n  const d = current(); if (!d) return;\n  const note = document.getElementById('call-note').value.trim();\n  if (!note) return showToast('Write what came out of the call');\n  d.log.unshift({\n    who: ME,\n    t: 'Call · ' + partyName(d, contactWho) + (contactWho === 'cre' ? ' (CRE)' : ''),\n    m: note, at: stamp(),\n  });\n  closeModal('m-call'); showToast('Call logged'); openDeal(d.id, true);\n}\n\nfunction fillMsg(txt) {\n  const d = current(); if (!d) return txt;\n  return txt.replace(/\\{contact\\}/g, d.contact).replace(/\\{client\\}/g, d.client).replace(/\\{cre\\}/g, d.cre);\n}\nfunction openMsg(who, chan) {\n  const d = current(); if (!d) return;\n  contactWho = who; msgChan = 'wa';\n  document.getElementById('msg-h').textContent = 'WhatsApp · ' + (who === 'cre' ? 'the CRE' : 'the client');\n  document.getElementById('msg-to').textContent = partyName(d, who) + ' · ' + partyPhone(d, who);\n  document.getElementById('msg-templates').innerHTML = MSG_TEMPLATES[who]\n    .map((t, i) => `<button onclick=\"useTemplate(${i})\">${esc(t[0])}<\u002Fbutton>`).join('');\n  document.getElementById('msg-body').value = fillMsg(MSG_TEMPLATES[who][0][1]);\n  document.getElementById('msg-hint').textContent = 'Sent from the JKAY business number. Delivery and read status come back into the activity log.';\n  openModal('m-msg');\n}\nfunction useTemplate(i) {\n  document.getElementById('msg-body').value = fillMsg(MSG_TEMPLATES[contactWho][i][1]);\n}\nfunction sendMsg() {\n  const d = current(); if (!d) return;\n  const body = document.getElementById('msg-body').value.trim();\n  if (!body) return showToast('Nothing to send');\n  const label = 'WhatsApp';\n  d.log.unshift({\n    who: ME,\n    t: label + ' → ' + partyName(d, contactWho) + (contactWho === 'cre' ? ' (CRE)' : ''),\n    m: body, at: stamp(),\n  });\n  closeModal('m-msg'); showToast(label + ' sent to ' + partyName(d, contactWho)); openDeal(d.id, true);\n}\n\nfunction closeDeal() {\n  document.getElementById('pane-detail').classList.remove('on');\n  document.getElementById('sheet-scrim').classList.remove('on');\n  sel = null;\n  if (view === 'pipe' && mode === 'list') renderRows(filtered());\n}\nconst current = () => DEALS.find(x => x.id === sel);\n\nfunction addTag(t) {\n  t = (t || '').trim(); const d = current(); if (!t || !d) return;\n  if (!MY_TAGS.includes(t)) { showToast('“' + t + '” is not one of the tags Admin issued'); return; }\n  if (!d.tags.includes(t)) d.tags.push(t);\n  d.log.unshift({ who: ME, t: 'Tag added — ' + t, m: 'Your own label. It changes no stage.', at: stamp() });\n  openDeal(d.id, true); renderPipe();\n}\nfunction dropTag(t) {\n  const d = current(); if (!d) return;\n  d.tags = d.tags.filter(x => x !== t);\n  openDeal(d.id, true); renderPipe();\n}\nfunction markMeasured() {\n  const d = current(); if (!d || !d.visit) return;\n  d.visit.status = 'done';\n  d.log.unshift({ who: ME, t: 'Site measured', m: d.visit.eng + ' completed the measurement.', at: stamp() });\n  if (d.stage === 'site') { d.stage = 'layout'; showToast(d.client + ' → Plan layout needed'); }\n  openDeal(d.id, true); renderPipe();\n}\n\n/* ============================ quotation ============================ */\nfunction openQuote() {\n  const d = current(); if (!d) return;\n  document.getElementById('q-title').textContent = 'Quotation v' + (d.quotes.length + 1) + ' — ' + d.client;\n  qLines = [{ desc: 'Selective pallet rack bay — 2700 × 1050 × 4500', qty: 10, rate: 21500 }, { desc: 'Beam set, 2 pairs per bay', qty: 20, rate: 2400 }];\n  qFile = null;\n  document.getElementById('q-note').value = '';\n  document.getElementById('q-filename').textContent = '';\n  document.getElementById('q-filevalue').value = '';\n  setQuoteMode('template');\n  renderLines();\n  openModal('m-quote');\n}\nfunction setQuoteMode(m) {\n  quoteMode = m;\n  document.querySelectorAll('#q-mode button').forEach((b, i) => b.classList.toggle('on', (i === 0) === (m === 'template')));\n  document.getElementById('q-template').style.display = m === 'template' ? '' : 'none';\n  document.getElementById('q-file').style.display = m === 'file' ? '' : 'none';\n}\nfunction renderLines() {\n  document.getElementById('q-lines').innerHTML = qLines.map((l, i) => `\n    <div class=\"ql\">\n      <input value=\"${esc(l.desc)}\" oninput=\"qLines[${i}].desc=this.value\">\n      <input value=\"${l.qty}\" inputmode=\"numeric\" oninput=\"qLines[${i}].qty=+this.value||0;renderTotal()\">\n      <input value=\"${l.rate}\" inputmode=\"numeric\" oninput=\"qLines[${i}].rate=+this.value||0;renderTotal()\">\n      <span class=\"x\" onclick=\"qLines.splice(${i},1);renderLines()\">✕<\u002Fspan>\n    <\u002Fdiv>`).join('');\n  renderTotal();\n}\nconst lineTotal = () => qLines.reduce((a, l) => a + l.qty * l.rate, 0);\nfunction renderTotal() { document.getElementById('q-total').textContent = money(lineTotal()); }\nfunction addLine() { qLines.push({ desc: '', qty: 1, rate: 0 }); renderLines(); }\nfunction pickQuoteFile(inp) {\n  qFile = inp.files && inp.files[0] ? inp.files[0].name : null;\n  document.getElementById('q-filename').textContent = qFile ? 'Attached: ' + qFile : '';\n}\nfunction saveQuote() {\n  const d = current(); if (!d) return;\n  let amount, file = null;\n  if (quoteMode === 'template') {\n    amount = lineTotal();\n    if (!amount) { showToast('Add at least one priced line'); return; }\n  } else {\n    amount = +String(document.getElementById('q-filevalue').value).replace(/[^\\d]/g, ' owToast('Visit booked · ' + nice + ', ' + tm);\n  openDeal(d.id, true); renderPipe();\n}\nfunction openCad() { cFile = null; document.getElementById('c-filename').textContent = ''; document.getElementById('c-note').value = ''; openModal('m-cad'); }\nfunction pickCadFile(inp) {\n  cFile = inp.files && inp.files[0] ? inp.files[0].name : null;\n  document.getElementById('c-filename').textContent = cFile ? 'Attached: ' + cFile : '';\n}\nfunction saveCad() {\n  const d = current(); if (!d) return;\n  const rev = d.cad.length + 1;\n  const note = document.getElementById('c-note').value.trim();\n  d.cad.push({ rev, date: today, note: note || 'Revision ' + rev, file: cFile || d.client.toLowerCase().split(' ')[0] + '-rev' + rev + '.dwg', by: ME });\n  if (d.stage === 'site') d.stage = 'layout';\n  d.log.unshift({ who: ME, t: 'CAD rev ' + rev + ' uploaded', m: note || 'No note given.', at: stamp() });\n  closeModal('m-cad'); showToast('CAD revision ' + rev + ' added');\n  openDeal(d.id, true); renderPipe();\n}\nfunction openPay() { const d = current(); if (!d) return; document.getElementById('p-amount').value = ''; openModal('m-pay'); }\nfunction savePayment() {\n  const d = current(); if (!d) return;\n  const amt = +String(document.getElementById('p-amount').value).replace(/[^\\d]/g, '');\n  if (!amt) { showToast('Enter the amount received'); return; }\n  const dt = document.getElementById('p-date').value;\n  const nice = dt ? new Date(dt + 'T00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : today;\n  const kind = document.getElementById('p-kind').value, m = document.getElementById('p-mode').value;\n  if (d.stage === 'awaiting') { d.stage = 'won'; d.contract = d.contract || dealValue(d); showToast('Advance received · ' + d.client + ' → Won'); }\n  d.payments.push({ kind, amount: amt, date: nice, mode: m });\n  d.log.unshift({ who: ME, t: kind + ' received — ' + money(amt), m: m + ' on ' + nice + '. Balance now ' + money(balance(d)) + '.', at: stamp() });\n  if (!balance(d)) pushNotif('balance', d.client, 'Fully paid', 'Balance cleared — installation can be closed out.');\n  closeModal('m-pay'); openDeal(d.id, true); renderPipe();\n}\nfunction openLost() {\n  document.getElementById('l-reason').innerHTML = LOST_REASONS.map(r => `<option>${esc(r)}<\u002Foption>`).join('');\n  document.getElementById('l-note').value = '';\n  openModal('m-lost');\n}\nfunction saveLost() {\n  const d = current(); if (!d) return;\n  const r = document.getElementById('l-reason').value, note = document.getElementById('l-note').value.trim();\n  d.stage = 'lost'; d.lostReason = r;\n  d.log.unshift({ who: ME, t: 'Marked lost', m: r + (note ? ' — ' + note : ''), at: stamp() });\n  pushNotif('alert', d.client, 'Deal marked lost', r + '. ' + d.cre + ' has been notified.');\n  closeModal('m-lost'); showToast(d.client + ' marked lost');\n  openDeal(d.id, true); renderPipe();\n}\n\n/* ============================ dashboard ============================ */\n/* ============================ notes ============================ */\nfunction pickNoteColor(i) {\n  noteColor = NOTE_COLORS[i];\n  document.querySelectorAll('#pane-detail .swatch').forEach(s => s.classList.toggle('on', +s.dataset.i === i));\n}\nfunction addNote() {\n  const d = current(); if (!d) return;\n  const text = (document.getElementById('note-input').value || '').trim();\n  if (!text) { showToast('Write something first'); return; }\n  d.notes.unshift({ id: ++noteSeq, text, color: noteColor, pin: false, at: stamp() });\n  saveNotes(); openDeal(d.id, true);\n}\nfunction pinNote(id) {\n  const d = current(); if (!d) return;\n  const n = d.notes.find(x => x.id === id); if (!n) return;\n  n.pin = !n.pin; saveNotes(); openDeal(d.id, true);\n}\nfunction delNote(id) {\n  const d = current(); if (!d) return;\n  d.notes = d.notes.filter(x => x.id !== id);\n  saveNotes(); openDeal(d.id, true);\n}\n\n/* ============================ settings ============================ */\nfunction showSet(p) {\n  document.querySelectorAll('.set-pane').forEach(x => x.classList.toggle('on', x.id === 'pane-' + p));\n  document.querySelectorAll('.set-rail a').forEach(a => a.classList.toggle('on', a.dataset.pane === p));\n  if (p === 'tags') renderSetTags();\n  if (p === 'notes') renderSetNotes();\n}\nfunction saveName() {\n  const v = (document.getElementById('set-name').value || '').trim();\n  if (!v) { showToast('A display name is required'); return; }\n  document.getElementById('foot-name').textContent = v;\n  showToast('Profile saved');\n}\nfunction loadPic(inp) {\n  const f = inp.files && inp.files[0]; if (!f) return;\n  const url = URL.createObjectURL(f);\n  ['avatar-lg', 'topbar-avatar'].forEach(id => {\n    const el = document.getElementById(id);\n    el.style.backgroundImage = `url(${url})`; el.textContent = '';\n  });\n  showToast('Profile picture updated');\n}\nfunction removePic() {\n  ['avatar-lg', 'topbar-avatar'].forEach(id => {\n    const el = document.getElementById(id);\n    el.style.backgroundImage = ''; el.textContent = 'SK';\n  });\n  showToast('Profile picture removed');\n}\nfunction gaugePw() {\n  const v = document.getElementById('pw-new').value;\n  let s = 0;\n  if (v.length >= 10) s++;\n  if (/\\d/.test(v)) s++;\n  if (/[^A-Za-z0-9]/.test(v)) s++;\n  if (/[A-Z]/.test(v)) s++;\n  const pct = [0, 30, 55, 80, 100][s];\n  const col = s < 2 ? 'var(--signal-red)' : s < 4 ? 'var(--signal-amber)' : 'var(--signal-green)';\n  const f = document.getElementById('pw-fill');\n  f.style.width = pct + '%'; f.style.background = col;\n  document.getElementById('pw-hint').textContent =\n    ['Use 10+ characters with a number and a symbol.', 'Too weak.', 'Getting there.', 'Strong.', 'Very strong.'][s];\n}\nfunction resetPassword() {\n  const a = document.getElementById('pw-new').value, b = document.getElementById('pw-confirm').value;\n  if (a.length < 10) { showToast('Password must be at least 10 characters'); return; }\n  if (a !== b) { showToast('The two passwords do not match'); return; }\n  showToast('Password updated · other sessions signed out');\n}\nfunction createTag() { showToast('Only Admin can create a tag'); }\nfunction deleteTag() { showToast('Only Admin can remove a tag'); }\nfunction renderSetTags() {\n  const el = document.getElementById('set-taglist');\n  const c = document.getElementById('np-tags'); if (c) c.textContent = MY_TAGS.length;\n  if (!el) return;\n  el.innerHTML = MY_TAGS.length ? MY_TAGS.map(t => {\n    const n = DEALS.filter(d => d.tags.includes(t)).length;\n    return `<div class=\"tagrow\">${tagHtml(t)}<span class=\"u\">on ${n} deal${n === 1 ? '' : 's'}<\u002Fspan><span class=\"u\" style=\"opacity:.7\">Admin-issued<\u002Fspan><\u002Fdiv>`;\n  }).join('') : '<div class=\"dash-empty\">No tags yet.<\u002Fdiv>';\n}\nfunction renderSetNotes() {\n  const el = document.getElementById('set-notelist'); if (!el) return;\n  const all = DEALS.flatMap(d => d.notes.map(n => ({ n, d })));\n  if (!all.length) { el.innerHTML = '<div class=\"dash-empty\">You haven’t written any notes yet.<\u002Fdiv>'; return; }\n  all.sort((a, b) => (b.n.pin ? 1 : 0) - (a.n.pin ? 1 : 0));\n  el.innerHTML = `<div class=\"notes-stack\">${all.map(({ n, d }) => `\n    <div class=\"note ${n.pin ? 'pin' : ''}\" style=\"background:${n.color}\">\n      <p>${esc(n.text)}<\u002Fp>\n      <div class=\"note__foot\"><span>${esc(d.client)} · ${esc(n.at)}<\u002Fspan>\n        <span class=\"note__act\"><span onclick=\"go('pipe','${d.stage}');openDeal(${d.id})\">Open deal<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('')}<\u002Fdiv>`;\n}\n\nconst MONTH = { won: [1, 0, 2, 1, 0, 1, 2], quotes: [2, 3, 1, 4, 2, 3, 3], visits: [1, 2, 1, 2, 3, 1, 2], lost: [0, 1, 0, 1, 0, 1, 0] };\nfunction spark(points, color) {\n  const w = 62, h = 20, max = Math.max(...points), min = Math.min(...points), span = max - min || 1;\n  const pts = points.map((p, i) => `${(i / (points.length - 1) * w).toFixed(1)},${(h - ((p - min) / span) * (h - 4) - 2).toFixed(1)}`).join(' ');\n  return `<svg width=\"${w}\" height=\"${h}\" viewBox=\"0 0 ${w} ${h}\" aria-hidden=\"true\"><polyline points=\"${pts}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"1.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><\u002Fsvg>`;\n}\nfunction bars(points, color) {\n  const w = 62, h = 20, n = points.length, bw = (w - (n - 1) * 2) / n, max = Math.max(...points) || 1;\n  return `<svg width=\"${w}\" height=\"${h}\" viewBox=\"0 0 ${w} ${h}\" aria-hidden=\"true\">${points.map((p, i) => {\n    const bh = Math.max(1.5, p / max * (h - 3));\n    return `<rect x=\"${(i * (bw + 2)).toFixed(1)}\" y=\"${(h - bh).toFixed(1)}\" width=\"${bw.toFixed(1)}\" height=\"${bh.toFixed(1)}\" rx=\"1\" fill=\"${color}\"/>`;\n  }).join('')}<\u002Fsvg>`;\n}\nfunction breakdown(pairs, color) {\n  const total = pairs.reduce((a, [, n]) => a + n, 0) || 1;\n  if (!pairs.some(([, n]) => n)) return '<div class=\"dash-empty\">Nothing recorded yet.<\u002Fdiv>';\n  return `<div class=\"brk\">${pairs.filter(([, n]) => n).map(([lab, n]) => `\n    <div class=\"brk-row\"><span>${esc(lab)}<\u002Fspan><span class=\"n\">${n}<\u002Fspan>\n      <span class=\"bar\"><div style=\"width:${(n / total * 100).toFixed(1)}%;background:${color}\"><\u002Fdiv><\u002Fspan>\n    <\u002Fdiv>`).join('')}<\u002Fdiv>`;\n}\nconst ink = () => {\n  const dark = document.documentElement.getAttribute('data-theme') === 'dark';\n  return dark ? { a: '#c4855a', g: '#74b189', r: '#d9827a', b: '#86a5d2', v: '#a99acb', t: '#3a3630' }\n              : { a: '#9c6644', g: '#3f7d52', r: '#b0453c', b: '#40628f', v: '#6f5b93', t: '#e8e4dc' };\n};\nfunction renderDash() {\n  const c = ink();\n  const won = DEALS.filter(d => d.stage === 'won'), lost = DEALS.filter(d => d.stage === 'lost');\n  const quotedValue = DEALS.filter(d => ['quote', 'negotiation', 'awaiting'].includes(d.stage) && d.quotes.length).reduce((a, d) => a + dealValue(d), 0);\n  const outstanding = won.reduce((a, d) => a + balance(d), 0);\n  const winRate = won.length + lost.length ? Math.round(won.length / (won.length + lost.length) * 100) : 0;\n  const visitsWeek = DEALS.filter(d => d.visit && d.visit.status === 'booked').length;\n\n  const kpi = (lab, val, delta, cls, chart) => `\n    <div class=\"kpi\"><div class=\"lab\">${lab}<\u002Fdiv>\n      <div class=\"row2\"><span class=\"val\">${val}<\u002Fspan>${chart || ''}<\u002Fdiv>\n      <div class=\"delta ${cls || ''}\">${delta}<\u002Fdiv><\u002Fdiv>`;\n\n  const funnelMax = Math.max(...STAGES.map(s => DEALS.filter(d => d.stage === s.k).length), 1);\n\n  document.getElementById('dash').innerHTML = `\n    <section>\n      <h2>This month<\u002Fh2>\n      <div class=\"kpis\">\n        ${kpi('Open deals', open().length, 'across six working stages', '', bars(MONTH.quotes, c.a))}\n        ${kpi('Quoted value', short(quotedValue), 'quotation sent → awaiting advance', '', spark(MONTH.quotes.map(x => x * 3), c.a))}\n        ${kpi('Won this month', won.length, short(won.reduce((a, d) => a + d.contract, 0)) + ' contracted', 'up', bars(MONTH.won, c.g))}\n        ${kpi('Win rate', winRate + '%', won.length + ' won · ' + lost.length + ' lost', winRate >= 50 ? 'up' : 'warn', spark(MONTH.won.map((w, i) => w + MONTH.lost[i]), c.g))}\n        ${kpi('Balance outstanding', short(outstanding), outstanding ? 'across ' + won.filter(d => balance(d)).length + ' won deal(s)' : 'all cleared', outstanding ? 'warn' : 'up', bars(MONTH.visits, c.r))}\n        ${kpi('Visits booked', visitsWeek, 'measurements not yet done', '', bars(MONTH.visits, c.b))}\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"dgrid\">\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Pipeline<\u002Fh3><span class=\"aux\">${DEALS.length} deals total<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">\n          <div class=\"funnel\">${STAGES.map(s => {\n            const list = DEALS.filter(d => d.stage === s.k);\n            const v = list.filter(isQuoted).reduce((a, d) => a + dealValue(d), 0);\n            const col = s.k === 'won' ? c.g : s.k === 'lost' ? c.r : c.a;\n            return `<div class=\"fstep\" onclick=\"go('pipe','${s.k}')\">\n              <span class=\"t\">${esc(s.label)}<\u002Fspan>\n              <span class=\"track\"><span class=\"fill\" style=\"width:${(list.length / funnelMax * 100).toFixed(1)}%;background:${col}\"><\u002Fspan><\u002Fspan>\n              <span class=\"n\">${list.length}<small>${v ? short(v) : '—'}<\u002Fsmall><\u002Fspan>\n            <\u002Fdiv>`;\n          }).join('')}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Next site visits<\u002Fh3><span class=\"aux\">booked<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">\n          ${(() => {\n            const v = DEALS.filter(d => d.visit && d.visit.status === 'booked');\n            if (!v.length) return '<div class=\"dash-empty\">No measurements booked.<\u002Fdiv>';\n            return v.map(d => `<div class=\"due-item\" onclick=\"go('pipe','all');openDeal(${d.id})\">\n              <div><div class=\"dn\">${esc(d.client)}<\u002Fdiv><div class=\"dm\">${esc(d.visit.eng)} · ${esc(d.place)}<\u002Fdiv><\u002Fdiv>\n              <div class=\"dt\">${esc(d.visit.date)}<br>${esc(d.visit.time)}<\u002Fdiv><\u002Fdiv>`).join('');\n          })()}\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"dgrid\">\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Balance ledger<\u002Fh3><span class=\"aux\">${short(outstanding)} outstanding<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">\n          ${won.length ? won.map(d => `<div class=\"due-item\" onclick=\"go('pay')\">\n            <div><div class=\"dn\">${esc(d.client)}<\u002Fdiv><div class=\"dm\">${money(paid(d))} received of ${money(d.contract)}<\u002Fdiv><\u002Fdiv>\n            <div class=\"dt ${balance(d) ? 'hot' : ''}\">${balance(d) ? money(balance(d)) : 'paid'}<\u002Fdiv><\u002Fdiv>`).join('')\n            : '<div class=\"dash-empty\">No won deals yet.<\u002Fdiv>'}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Why deals were lost<\u002Fh3><span class=\"aux\">${lost.length} lost<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">${breakdown(LOST_REASONS.map(r => [r, lost.filter(d => d.lostReason === r).length]), c.r)}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"dgrid\">\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Where the leads came from<\u002Fh3><span class=\"aux\">platform, carried from the CRE desk<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">${breakdown(PLATFORMS.map(p => [p, DEALS.filter(d => d.platform === p).length]), c.b)}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Handed over by<\u002Fh3><span class=\"aux\">CRE desk<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">${breakdown([...new Set(DEALS.map(d => d.cre))].map(r => [r, DEALS.filter(d => d.cre === r).length]), c.v)}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>`;\n}\nwindow.onThemeChange = () => {\n  if (view === 'dash') renderDash();\n};\n\n/* ============================ visits view ============================ */\nconst WEEK_DAYS = [\n  { lab: 'Mon', d: '24 Aug 2026' }, { lab: 'Tue', d: '25 Aug 2026' }, { lab: 'Wed', d: '26 Aug 2026' },\n  { lab: 'Thu', d: '27 Aug 2026' }, { lab: 'Fri', d: '28 Aug 2026' }, { lab: 'Sat', d: '29 Aug 2026' }, { lab: 'Sun', d: '30 Aug 2026' },\n];\nfunction renderVisits() {\n  const all = DEALS.filter(d => d.visit);\n  document.getElementById('cal-wrap').innerHTML = `\n    <div class=\"card\">\n      <div class=\"card__head\"><h3>Week of 24 August<\u002Fh3><span class=\"aux\">${all.filter(d => d.visit.status === 'booked').length} booked<\u002Fspan><\u002Fdiv>\n      <div class=\"card__body\" style=\"padding:0\">\n        <div class=\"cal\">${WEEK_DAYS.map(day => {\n          const list = all.filter(d => d.visit.date === day.d);\n          return `<div class=\"cal-day ${day.d === '25 Aug 2026' ? 'today' : ''}\">\n            <div class=\"dh\"><span>${day.lab}<\u002Fspan><b>${day.d.split(' ')[0]}<\u002Fb><\u002Fdiv>\n            ${list.map(d => `<div class=\"vchip ${d.visit.status === 'done' ? 'done' : ''}\" onclick=\"go('pipe','all');openDeal(${d.id})\">\n              <b>${esc(d.client)}<\u002Fb><span class=\"tm\">${esc(d.visit.time)} · ${esc(d.visit.eng.split(' · ')[0])}<\u002Fspan><\u002Fdiv>`).join('')}\n          <\u002Fdiv>`;\n        }).join('')}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"card__head\"><h3>Awaiting measurement<\u002Fh3><span class=\"aux\">${DEALS.filter(d => d.stage === 'site' && !d.visit).length} unbooked<\u002Fspan><\u002Fdiv>\n      <div class=\"card__body\">\n        ${DEALS.filter(d => d.stage === 'site' && !d.visit).map(d => `\n          <div class=\"due-item\" onclick=\"go('pipe','site');openDeal(${d.id})\">\n            <div><div class=\"dn\">${esc(d.client)}<\u002Fdiv><div class=\"dm\">${esc(d.place)} · handed over ${esc(d.handedAt.split(',')[0])}<\u002Fdiv><\u002Fdiv>\n            <div class=\"dt hot\">book it<\u002Fdiv><\u002Fdiv>`).join('') || '<div class=\"dash-empty\">Every handed-over deal has a measurement booked.<\u002Fdiv>'}\n        <div class=\"d-sec__head\" style=\"margin:16px 0 9px\"><h4>Measured, drawing pending<\u002Fh4><\u002Fdiv>\n        ${DEALS.filter(d => d.stage === 'layout').map(d => `\n          <div class=\"due-item\" onclick=\"go('pipe','layout');openDeal(${d.id})\">\n            <div><div class=\"dn\">${esc(d.client)}<\u002Fdiv><div class=\"dm\">${d.cad.length ? 'CAD rev ' + d.cad.length : 'no drawing yet'}<\u002Fdiv><\u002Fdiv>\n            <div class=\"dt\">${esc(d.visit ? d.visit.date : '—')}<\u002Fdiv><\u002Fdiv>`).join('') || '<div class=\"dash-empty\">Nothing waiting on a drawing.<\u002Fdiv>'}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n/* ============================ payments view ============================ */\nfunction renderPay() {\n  const won = DEALS.filter(d => d.stage === 'won');\n  const outstanding = won.reduce((a, d) => a + balance(d), 0);\n  document.getElementById('pay-wrap').innerHTML = `\n    ${outstanding ? `<div class=\"sla-banner\"><span class=\"pulse\"><\u002Fspan>\n      <span><strong>${money(outstanding)} outstanding<\u002Fstrong> across ${won.filter(d => balance(d)).length} won deal${won.filter(d => balance(d)).length === 1 ? '' : 's'} — the final-balance alert fires five days before each production run.<\u002Fspan><\u002Fdiv>` : ''}\n    ${won.map(d => `\n      <div class=\"panel\">\n        <div class=\"panel__head\"><h3>${esc(d.client)}<\u002Fh3><span class=\"count\">${esc(d.place)} · contract ${money(d.contract)}<\u002Fspan><\u002Fdiv>\n        <div class=\"panel__body\">\n          <div class=\"pay-row\"><span>Contract value<\u002Fspan><strong>${money(d.contract)}<\u002Fstrong><\u002Fdiv>\n          ${d.payments.map(p => `<div class=\"pay-row\"><span>${esc(p.kind)} · ${esc(p.date)} · ${esc(p.mode)}<\u002Fspan><strong style=\"color:var(--signal-green)\">${money(p.amount)}<\u002Fstrong><\u002Fdiv>`).join('')}\n          <div class=\"pay-row\"><span>Remaining balance<\u002Fspan><strong style=\"color:${balance(d) ? 'var(--accent-hover)' : 'var(--signal-green)'}\">${money(balance(d))}<\u002Fstrong><\u002Fdiv>\n          <div class=\"bal-bar\"><div style=\"width:${Math.round(paid(d) / (d.contract || 1) * 100)}%\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"small muted\" style=\"margin-top:11px\">${balance(d)\n            ? Math.round(paid(d) / d.contract * 100) + '% received · balance alert scheduled five days before the production run'\n            : 'Fully paid — installation can be closed out.'}<\u002Fdiv>\n          <div class=\"flex gap-8 mt-16\">\n            <button class=\"btn btn-signal btn-sm\" onclick=\"sel=${d.id};openPay()\">Record payment<\u002Fbutton>\n            ${balance(d) ? `<button class=\"btn btn-outline btn-sm\" onclick=\"showToast('Balance reminder sent to ${esc(d.contact)}')\">Send reminder<\u002Fbutton>` : ''}\n            <button class=\"btn btn-outline btn-sm\" onclick=\"go('pipe','won');openDeal(${d.id})\">Open deal<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('') || '<div class=\"dash-empty\">No won deals to track.<\u002Fdiv>'}`;\n}\n\n/* ============================ counts + boot ============================ */\nfunction renderCounts() {\n  document.getElementById('np-all').textContent = countFor('all');\n  document.getElementById('np-open').textContent = open().length;\n  document.getElementById('np-lost').textContent = countFor('lost');\n  document.getElementById('np-site').textContent = countFor('site');\n  document.getElementById('np-await').textContent = countFor('awaiting');\n  document.getElementById('np-pay').textContent = DEALS.filter(d => d.stage === 'won').length;\n  document.getElementById('np-visits').textContent = DEALS.filter(d => d.visit && d.visit.status === 'booked').length;\n  document.getElementById('stage-nav').innerHTML = STAGES.filter(s => s.k !== 'lost').map(s =>\n    `<div class=\"nav-pop__item\" data-key=\"${s.k}\" onclick=\"go('pipe','${s.k}')\"><span class=\"lab\">${esc(s.label)}<\u002Fspan><span class=\"meta\">${countFor(s.k)}<\u002Fspan><\u002Fdiv>`).join('');\n  document.querySelectorAll('.nav-pop__item').forEach(x => x.classList.toggle('on', x.dataset.key === scope && view === 'pipe'));\n}\n\n['q-drop', 'c-drop'].forEach(id => {\n  const z = document.getElementById(id);\n  z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('on'); });\n  z.addEventListener('dragleave', () => z.classList.remove('on'));\n  z.addEventListener('drop', e => {\n    e.preventDefault(); z.classList.remove('on');\n    const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;\n    if (id === 'q-drop') { qFile = f.name; document.getElementById('q-filename').textContent = 'Attached: ' + f.name; }\n    else { cFile = f.name; document.getElementById('c-filename').textContent = 'Attached: ' + f.name; }\n  });\n});\n\ndocument.addEventListener('keydown', e => {\n  if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('bd-search').focus(); }\n  if (e.key === 'Escape') { closeDeal(); closeNotif(); document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open')); }\n});\n\nrenderNotifs();\nloadNotes();\nrenderSetTags();\ngo('pipe', 'all');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
