  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

        e.target.tagName, String(e.target.src || e.target.href || ''));

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

            window.location.protocol === 'file:')) ||

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.

    setStatus('Unpacking ' + uuids.length + ' assets...');

    const resourceMap = {};
    for (const entry of extResources) {

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      ';</' + 'script>';

    // DOMParser/replaceWith are inert per spec — re-create each with

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Admin — JKAY RACKS CRM<\u002Ftitle>\n<style>/* ==========================================================================\n   JKAY RACKS CRM — \"Paper & Clay\" design system\n   Warm, quiet, uncluttered SaaS surface. Light warm-neutral base, one\n   restrained clay accent, thin borders, soft radii, fast 130ms transitions.\n\n   Note: the original --steel-* / --signal-* variable names are preserved and\n   remapped to the new light palette, so existing inline styles in the four\n   pages keep resolving to sensible values with no markup churn.\n   ========================================================================== */\n\n/* vietnamese */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ceab34b7-e953-4740-b397-2bfab1e61624\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9def7c74-608e-4632-bcfd-0a56e5568626\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8916adcc-04b0-4631-b7fc-d47b8dc9d78f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ceab34b7-e953-4740-b397-2bfab1e61624\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"9def7c74-608e-4632-bcfd-0a56e5568626\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8916adcc-04b0-4631-b7fc-d47b8dc9d78f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---- Warm neutral ramp (light → dark; names kept from the old system) ---- */\n  --steel-950: #faf9f7;  /* page ground        */\n  --steel-900: #ffffff;  /* panel surface      */\n  --steel-850: #f6f4f0;  /* subtle fill, input */\n  --steel-800: #f1eee8;  /* track, chip fill   */\n  --steel-750: #ebe7df;\n  --steel-700: #e8e4dc;  /* hairline border    */\n  --steel-600: #ded8ce;  /* stronger border    */\n  --steel-500: #8d887f;  /* muted text         */\n  --steel-400: #7c776e;\n  --steel-300: #5f5b54;  /* secondary text     */\n  --steel-200: #46423c;\n  --steel-100: #2a2825;  /* body text          */\n  --steel-50:  #1f1e1c;  /* headings           */\n\n  /* Semantic aliases (preferred in new code) */\n  --paper: var(--steel-950);\n  --surface: var(--steel-900);\n  --surface-sunk: var(--steel-850);\n  --text: var(--steel-100);\n  --text-strong: var(--steel-50);\n  --text-muted: var(--steel-500);\n  --text-secondary: var(--steel-300);\n  --line: var(--steel-700);\n  --line-soft: #f0ece5;\n\n  /* ---- Accent + status (single restrained clay accent) ---- */\n  --signal-amber: #9c6644;              /* the accent */\n  --signal-amber-dim: #d8c3ac;\n  --signal-amber-glow: #f7f0e8;\n  --accent-hover: #85552f;\n  --accent-tint: #f4ece4;\n\n  --signal-red: #b0453c;\n  --signal-red-dim: #f0dedb;\n  --signal-green: #3f7d52;\n  --signal-green-dim: #dbe7de;\n  --signal-blue: #40628f;\n  --signal-violet: #6f5b93;\n\n  /* ---- Surfaces used by the page-level CSS ---- */\n  --sidebar-bg: #f5f2ee;\n  --sidebar-line: #eae6de;\n  --nav-hover: #efece5;\n  --hover-soft: #fbfaf7;\n  --raise-soft: #fdfcfa;\n  --row-line: #f4f0e9;\n  --row-line-strong: #ece8e0;\n  --sel-soft: #fbf7f2;\n  --cursor-soft: #f9f6f1;\n  --band-bg: #2b2620;\n  --band-text: #f2ede5;\n  --band-strong: #fbf8f3;\n  --band-muted: #b3a998;\n  --hatch-a: #ece5db;\n  --hatch-b: #e3dbd0;\n  --avatar-line: #e6dbcf;\n  --scroll-thumb: #e2ddd3;\n  --scrim: rgba(31, 30, 28, 0.28);\n\n  /* ---- Type ---- */\n  --font-display: 'Public Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-mono: 'Public Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;\n\n  /* ---- Structure ---- */\n  --radius-sm: 8px;\n  --radius-md: 10px;\n  --radius-lg: 14px;\n  --border-hairline: 1px solid var(--steel-700);\n  --shadow-panel: 0 1px 2px rgba(31, 30, 28, 0.05);\n  --shadow-raised: 0 4px 14px rgba(31, 30, 28, 0.07);\n  --shadow-modal: 0 20px 50px rgba(31, 30, 28, 0.16);\n  --t: 130ms ease;\n}\n\n/* ==========================================================================\n   Dark theme — same structure, warm dark ramp. Set data-theme=\"dark\" on <html>.\n   ========================================================================== */\n[data-theme=\"dark\"] {\n  --steel-950: #1a1917;\n  --steel-900: #211f1d;\n  --steel-850: #272522;\n  --steel-800: #2e2b28;\n  --steel-750: #35322e;\n  --steel-700: #34312d;\n  --steel-600: #433f39;\n  --steel-500: #9a938a;\n  --steel-400: #a8a199;\n  --steel-300: #bdb6ac;\n  --steel-200: #d6cfc5;\n  --steel-100: #e9e3da;\n  --steel-50:  #f6f1ea;\n\n  --line-soft: #2b2825;\n\n  --signal-amber: #c4855a;\n  --signal-amber-dim: #6d4d34;\n  --signal-amber-glow: #2b231b;\n  --accent-hover: #dda179;\n  --accent-tint: #33291f;\n\n  --signal-red: #d9827a;\n  --signal-red-dim: #4a2b27;\n  --signal-green: #74b189;\n  --signal-green-dim: #24382b;\n  --signal-blue: #86a5d2;\n  --signal-violet: #a99acb;\n\n  --sidebar-bg: #1d1c1a;\n  --sidebar-line: #2c2926;\n  --nav-hover: #2a2724;\n  --hover-soft: #24221f;\n  --raise-soft: #201e1c;\n  --row-line: #262421;\n  --row-line-strong: #2c2926;\n  --sel-soft: #2c2521;\n  --cursor-soft: #252320;\n  --band-bg: #100f0e;\n  --band-text: #ece6dd;\n  --band-strong: #f8f3ec;\n  --band-muted: #a49b8f;\n  --hatch-a: #302d29;\n  --hatch-b: #3a3631;\n  --avatar-line: #4a3e33;\n  --scroll-thumb: #3a3630;\n  --scrim: rgba(8, 8, 7, 0.62);\n\n  --shadow-panel: 0 1px 2px rgba(0, 0, 0, 0.28);\n  --shadow-raised: 0 4px 14px rgba(0, 0, 0, 0.4);\n  --shadow-modal: 0 20px 50px rgba(0, 0, 0, 0.55);\n  color-scheme: dark;\n}\n\n/* Raw-hex rules in this sheet, re-pointed for the dark ground */\n[data-theme=\"dark\"] .sidebar,\n[data-theme=\"dark\"] .sidebar__foot { border-color: var(--sidebar-line); }\n[data-theme=\"dark\"] .nav-item:hover { background: var(--nav-hover); }\n[data-theme=\"dark\"] .avatar { border-color: var(--avatar-line); }\n[data-theme=\"dark\"] .data-table td { border-bottom-color: var(--row-line); }\n[data-theme=\"dark\"] .data-table tbody tr:hover { background: var(--hover-soft); }\n[data-theme=\"dark\"] .modal__foot { background: var(--hover-soft); }\n[data-theme=\"dark\"] .stage-col { border-color: var(--sidebar-line); }\n[data-theme=\"dark\"] .btn-danger:hover { background: #33211f; }\n[data-theme=\"dark\"] .sla-banner { border-color: #45372a; }\n[data-theme=\"dark\"] .sla-banner.critical { background: #33211f; border-color: #4a2b27; }\n[data-theme=\"dark\"] .tag-followup     { background: #222b37; border-color: #2f3a49; }\n[data-theme=\"dark\"] .tag-longfollowup,\n[data-theme=\"dark\"] .tag-transferred  { background: #2a2536; border-color: #382f46; }\n[data-theme=\"dark\"] .tag-cna3         { background: #33211f; border-color: #4a2b27; }\n[data-theme=\"dark\"] .tag-sitevisit,\n[data-theme=\"dark\"] .tag-won          { background: #1e2c23; border-color: #2a3d30; }\n[data-theme=\"dark\"] .tag-highvalue    { background: var(--accent-tint); border-color: #45372a; }\n[data-theme=\"dark\"] ::-webkit-scrollbar-thumb:hover { background: #4a453e; }\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  background: var(--paper);\n  color: var(--text);\n  font-family: var(--font-display);\n  font-size: 15.5px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  min-height: 100vh;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  letter-spacing: -0.012em;\n  margin: 0;\n  color: var(--text-strong);\n}\n\np { text-wrap: pretty; }\n\na { color: var(--signal-amber); text-decoration: none; transition: color var(--t); }\na:hover { color: var(--accent-hover); }\n\nbutton { font-family: inherit; cursor: pointer; }\n::selection { background: var(--accent-tint); color: var(--text-strong); }\n\n:focus-visible {\n  outline: 2px solid var(--signal-amber);\n  outline-offset: 2px;\n  border-radius: 4px;\n}\n\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb {\n  background: var(--scroll-thumb);\n  border-radius: 8px;\n  border: 3px solid var(--paper);\n}\n::-webkit-scrollbar-thumb:hover { background: #d2ccc0; }\n\n/* Legacy decorative hooks — intentionally inert in this system */\n.hazard-strip { display: none; }\n.riveted::before, .riveted::after { content: none; }\n\n/* ---- App shell ---- */\n.app-shell {\n  display: grid;\n  grid-template-columns: 236px 1fr;\n  min-height: 100vh;\n}\n\n.sidebar {\n  background: var(--sidebar-bg);\n  border-right: 1px solid var(--sidebar-line);\n  display: flex;\n  flex-direction: column;\n  position: sticky;\n  top: 0;\n  height: 100vh;\n}\n\n.sidebar__brand {\n  padding: 18px 16px 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n}\n\n.sidebar__brand .plate {\n  font-size: 15.5px;\n  font-weight: 600;\n  letter-spacing: -0.012em;\n  color: var(--text-strong);\n  line-height: 1.25;\n}\n\n.sidebar__brand .plate span { color: var(--signal-amber); }\n\n.sidebar__brand .sub {\n  font-size: 12.5px;\n  color: var(--text-muted);\n  letter-spacing: 0;\n  text-transform: none;\n}\n\n.sidebar__nav {\n  flex: 1;\n  padding: 4px 10px;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n}\n\n.nav-item {\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 8px 10px;\n  border-radius: var(--radius-sm);\n  color: var(--text-secondary);\n  font-size: 14.5px;\n  transition: background var(--t), color var(--t);\n}\n\n.nav-item:hover { background: var(--nav-hover); color: var(--text-strong); }\n\n.nav-item.active {\n  background: var(--surface);\n  color: var(--text-strong);\n  font-weight: 600;\n  box-shadow: var(--shadow-panel);\n}\n\n.nav-item .dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  background: currentColor;\n  opacity: 0.45;\n  flex-shrink: 0;\n}\n.nav-item.active .dot { background: var(--signal-amber); opacity: 1; }\n\n.sidebar__foot {\n  padding: 12px 16px 16px;\n  border-top: 1px solid var(--sidebar-line);\n  font-size: 12.5px;\n  color: var(--text-muted);\n  letter-spacing: 0;\n  display: flex;\n  align-items: center;\n  gap: 7px;\n}\n\n.sidebar__foot .lamp {\n  display: inline-block;\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: var(--signal-green);\n  flex-shrink: 0;\n}\n\n/* ---- Main column ---- */\n.main { min-width: 0; display: flex; flex-direction: column; }\n\n.topbar {\n  height: 62px;\n  border-bottom: 1px solid var(--line-soft);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0 26px;\n  background: var(--paper);\n  position: sticky;\n  top: 0;\n  z-index: 20;\n}\n\n.topbar__title h1 { font-size: 21px; }\n.topbar__title .crumb {\n  font-size: 13px;\n  color: var(--text-muted);\n  letter-spacing: 0;\n  text-transform: none;\n  margin-top: 1px;\n}\n\n.topbar__right { display: flex; align-items: center; gap: 12px; }\n\n.search-box {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  background: var(--surface);\n  border: var(--border-hairline);\n  border-radius: var(--radius-sm);\n  padding: 7px 11px;\n  min-width: 290px;\n  transition: border-color var(--t);\n}\n.search-box:focus-within { border-color: var(--signal-amber-dim); }\n.search-box input {\n  background: transparent;\n  border: none;\n  outline: none;\n  color: var(--text);\n  font-family: inherit;\n  font-size: 14.5px;\n  width: 100%;\n}\n.search-box input::placeholder { color: var(--text-muted); }\n.search-box .kbd {\n  font-size: 12px;\n  color: var(--text-muted);\n  font-variant-numeric: tabular-nums;\n  border: none;\n  padding: 0;\n}\n\n.avatar {\n  width: 32px; height: 32px;\n  border-radius: 50%;\n  background: var(--accent-tint);\n  border: 1px solid var(--avatar-line);\n  display: flex; align-items: center; justify-content: center;\n  font-size: 12.5px;\n  font-weight: 600;\n  color: var(--accent-hover);\n}\n\n.content { padding: 24px 26px 44px; flex: 1; }\n\n/* ---- Panels / cards ---- */\n.panel {\n  background: var(--surface);\n  border: var(--border-hairline);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-panel);\n  position: relative;\n}\n\n.panel__head {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 14px 18px;\n  border-bottom: 1px solid var(--line-soft);\n}\n\n.panel__head h3 { font-size: 15px; letter-spacing: -0.01em; }\n.panel__head .count { color: var(--text-muted); font-size: 12.5px; }\n\n.panel__body { padding: 16px 18px 18px; }\n\n/* ---- Buttons ---- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 8px 13px;\n  border-radius: var(--radius-sm);\n  border: 1px solid var(--steel-600);\n  background: var(--surface);\n  color: var(--text-secondary);\n  font-size: 14px;\n  letter-spacing: 0;\n  text-transform: none;\n  transition: background var(--t), border-color var(--t), color var(--t);\n}\n.btn:hover { background: var(--steel-850); color: var(--text-strong); }\n.btn:active { background: var(--steel-800); }\n\n.btn-signal {\n  background: var(--signal-amber);\n  border-color: var(--signal-amber);\n  color: #fff;\n  font-weight: 600;\n}\n.btn-signal:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }\n\n.btn-outline { background: var(--surface); }\n\n.btn-danger {\n  border-color: var(--signal-red-dim);\n  color: var(--signal-red);\n  background: var(--surface);\n}\n.btn-danger:hover { background: var(--signal-red-dim); color: var(--signal-red); }\n\n.btn-sm { padding: 6px 11px; font-size: 13px; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n\n/* ---- Tags / badges — soft pills, muted tints ---- */\n.tag {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  padding: 3px 9px;\n  font-size: 12px;\n  letter-spacing: 0;\n  text-transform: none;\n  border-radius: 20px;\n  border: 1px solid transparent;\n  font-family: inherit;\n  font-weight: 600;\n  white-space: nowrap;\n}\n.tag::before {\n  content: '';\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  background: currentColor;\n  flex-shrink: 0;\n}\n\n.tag-followup      { color: var(--signal-blue);   background: #eff3f8; border-color: #e0e7f0; }\n.tag-longfollowup  { color: var(--signal-violet); background: #f3effa; border-color: #e6def2; }\n.tag-cna1          { color: var(--text-muted);    background: var(--steel-850); border-color: var(--steel-700); }\n.tag-cna2          { color: var(--accent-hover);  background: var(--signal-amber-glow); border-color: #f0e3d3; }\n.tag-cna3          { color: var(--signal-red);    background: #fbf0ef; border-color: #f2dedb; }\n.tag-transferred   { color: var(--signal-violet); background: #f3effa; border-color: #e6def2; }\n.tag-highvalue     { color: var(--accent-hover);  background: var(--accent-tint); border-color: #e9dbcb; }\n.tag-sitevisit     { color: var(--signal-green);  background: #eef4f0; border-color: #ddeae1; }\n.tag-won           { color: var(--signal-green);  background: #eef4f0; border-color: #ddeae1; }\n.tag-lost          { color: var(--text-muted);    background: var(--steel-850); border-color: var(--steel-700); text-decoration: none; }\n\n/* ---- Notice banner (was: SLA hazard banner) ---- */\n.sla-banner {\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 11px 14px;\n  background: var(--signal-amber-glow);\n  border: 1px solid #f0e3d3;\n  border-radius: var(--radius-md);\n  font-size: 14px;\n  color: var(--accent-hover);\n  margin-bottom: 20px;\n}\n.sla-banner strong { font-weight: 600; }\n.sla-banner.critical {\n  background: #fbf0ef;\n  border-color: #f2dedb;\n  color: var(--signal-red);\n}\n.sla-banner .pulse {\n  width: 7px; height: 7px;\n  border-radius: 50%;\n  background: currentColor;\n  flex-shrink: 0;\n  opacity: 0.9;\n}\n\n/* ---- Lead card ---- */\n.lead-card {\n  border: var(--border-hairline);\n  background: var(--surface);\n  border-radius: var(--radius-lg);\n  padding: 16px 17px;\n  margin-bottom: 12px;\n  box-shadow: var(--shadow-panel);\n  transition: border-color var(--t), box-shadow var(--t);\n}\n.lead-card:hover { border-color: var(--steel-600); box-shadow: var(--shadow-raised); }\n.lead-card.high-value { border-left: 2px solid var(--signal-amber-dim); }\n\n.lead-card__top {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-start;\n  gap: 12px;\n  margin-bottom: 2px;\n}\n.lead-card__name {\n  font-size: 16.5px;\n  font-weight: 600;\n  color: var(--text-strong);\n  letter-spacing: -0.012em;\n  line-height: 1.3;\n}\n.lead-card__meta {\n  font-size: 13px;\n  color: var(--text-muted);\n  margin-top: 2px;\n  font-variant-numeric: tabular-nums;\n}\n.lead-card__tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 11px 0 0; }\n.lead-card__actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }\n\n/* ---- Table ---- */\ntable.data-table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.data-table th {\n  text-align: left;\n  padding: 10px 18px;\n  color: var(--text-muted);\n  font-size: 12px;\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  border-bottom: 1px solid var(--line-soft);\n  font-weight: 600;\n}\n.data-table td {\n  padding: 12px 18px;\n  border-bottom: 1px solid var(--row-line);\n  color: var(--text-secondary);\n}\n.data-table tbody tr { transition: background var(--t); }\n.data-table tbody tr:hover { background: var(--hover-soft); }\n.data-table tbody tr:last-child td { border-bottom: none; }\n\n/* ---- Pipeline stage rail ---- */\n.stage-rail {\n  display: grid;\n  grid-auto-flow: column;\n  gap: 12px;\n  overflow-x: auto;\n  padding-bottom: 6px;\n}\n.stage-col {\n  min-width: 248px;\n  background: var(--steel-850);\n  border: 1px solid var(--sidebar-line);\n  border-radius: var(--radius-lg);\n}\n.stage-col__head {\n  padding: 12px 14px 10px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 8px;\n}\n.stage-col__head h4 { font-size: 14px; letter-spacing: -0.005em; color: var(--text-secondary); }\n.stage-col__count {\n  font-size: 12px;\n  color: var(--text-muted);\n  background: var(--surface);\n  border: 1px solid var(--line-soft);\n  padding: 1px 8px;\n  border-radius: 20px;\n  font-variant-numeric: tabular-nums;\n}\n.stage-col__body { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }\n\n/* ---- Deal card (BD) ---- */\n.deal-card {\n  background: var(--surface);\n  border: var(--border-hairline);\n  border-radius: var(--radius-md);\n  padding: 12px 13px;\n  box-shadow: var(--shadow-panel);\n  transition: border-color var(--t), box-shadow var(--t);\n}\n.deal-card__client { font-size: 14.5px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }\n.deal-card__amount { font-size: 14px; color: var(--accent-hover); margin-top: 3px; font-variant-numeric: tabular-nums; }\n.deal-card__meta { font-size: 12.5px; color: var(--text-muted); margin-top: 7px; line-height: 1.45; }\n\n/* ---- Stat tiles ---- */\n.stat-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));\n  gap: 12px;\n}\n.stat-tile {\n  background: var(--surface);\n  border: var(--border-hairline);\n  border-radius: var(--radius-lg);\n  padding: 16px 18px 15px;\n  box-shadow: var(--shadow-panel);\n}\n.stat-tile__label {\n  font-size: 13px;\n  letter-spacing: 0;\n  text-transform: none;\n  color: var(--text-muted);\n}\n.stat-tile__value {\n  font-size: 31.5px;\n  font-weight: 600;\n  letter-spacing: -0.022em;\n  color: var(--text-strong);\n  margin-top: 6px;\n  line-height: 1.1;\n  font-variant-numeric: tabular-nums;\n}\n.stat-tile__delta { font-size: 12.5px; margin-top: 7px; color: var(--text-muted); }\n.stat-tile__delta.up { color: var(--signal-green); }\n.stat-tile__delta.down { color: var(--signal-green); }\n\n/* ---- Modal ---- */\n.modal-overlay {\n  position: fixed; inset: 0;\n  background: var(--scrim);\n  display: none;\n  align-items: center;\n  justify-content: center;\n  z-index: 100;\n  padding: 24px;\n}\n.modal-overlay.open { display: flex; }\n.modal {\n  width: 470px;\n  max-width: 100%;\n  max-height: 86vh;\n  overflow-y: auto;\n  background: var(--surface);\n  border: var(--border-hairline);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-modal);\n}\n.modal__head {\n  padding: 16px 20px;\n  bord uted); margin-left: auto }\n  .notebadge {\n    display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px; padding: 0 4px; margin-left: 5px;\n    border-radius: 999px; background: var(--accent-tint); color: var(--accent-hover); font-size: 10.5px; font-weight: 700;\n  }\n\n  /* ---- payments ---- */\n  .mile { display: flex; flex-direction: column; gap: 1px }\n  .mrow {\n    display: grid; grid-template-columns: 16px 124px 1fr auto 96px; align-items: center; gap: 11px;\n    padding: 8px 0; border-bottom: 1px solid var(--row-line); font-size: 12.5px;\n  }\n  .mrow:last-child { border-bottom: none }\n  .mrow .dotm { width: 9px; height: 9px; border-radius: 999px; background: var(--steel-700); margin-left: 3px }\n  .mrow.got .dotm { background: var(--signal-green) }\n  .mrow.late .dotm { background: var(--signal-red) }\n  .mrow .k { color: var(--text-strong); font-weight: 600 }\n  .mrow .m { color: var(--text-muted); font-size: 11.5px }\n  .mrow .amt { font-variant-numeric: tabular-nums; color: var(--text-strong); text-align: right; white-space: nowrap }\n  .payopen { background: var(--steel-850) }\n  .payopen > td { padding: 0 !important }\n  .paybody { padding: 4px 16px 10px }\n  .agebar { display: grid; grid-template-columns: 88px 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; color: var(--text-secondary); padding: 3px 0 }\n  .agebar .tr { height: 7px; background: var(--steel-850); border-radius: 999px; overflow: hidden }\n  .agebar .tr i { display: block; height: 100% }\n  .agebar .n { font-variant-numeric: tabular-nums; color: var(--text-muted); white-space: nowrap }\n\n  /* ---- closed / lost timeline ---- */\n  .tl { position: relative; padding-left: 20px; margin-top: 4px }\n  .tl::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line-soft) }\n  .tl-m { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); padding: on');\n    out.push({ name: p, role: 'CRE', touched: leads.length, handed: handed.length, won: won.length, lost: lost.length,\n      rate: pct(handed.length, leads.length), val: won.reduce((s, r) => s + r.value, 0),\n      topLoss: topReason(lost), rateLabel: 'qualified' });\n  });\n  BDES.forEach(p => {\n    const deals = base.filter(r => r.bde === p);\n    const won = deals.filter(r => r.bdStage === 'won');\n    const lost = deals.filter(r => r.lostBy === 'bd');\n    out.push({ name: p, role: 'BDE', touched: deals.length, handed: deals.length, won: won.length, lost: lost.length,\n      rate: pct(won.length, won.length + lost.length), val: won.reduce((s, r) => s + r.value, 0),\n      topLoss: topReason(lost), rateLabel: 'win rate' });\n  });\n  return out;\n}\n\nfunction srcDonut(base) {\n  const data = SOURCES.map(s => ({ s, n: ROWS.filter(r => r.source === s).length })).filter(d => d.n).sort((a, b) => b.n - a.n);\n  const total = data.reduce((s, d) => s + d.n, 0);\n  const C = 2 * Math.PI * 52;\n  let off = 0;\n  const arcs = data.map(d => {\n    const len = d.n / total * C;\n    const a = `<circle cx=\"70\" cy=\"70\" r=\"52\" fill=\"none\" stroke=\"${SRC_COLOR[d.s]}\" stroke-width=\"${dashSrc === d.s ? 22 : 17}\"\n      stroke-dasharray=\"${len - 1.5} ${C - len + 1.5}\" stroke-dashoffset=\"${-off}\"\n      opacity=\"${dashSrc === 'all' || dashSrc === d.s ? 1 : .28}\" onclick=\"setSrc('${d.s}')\"><title>${esc(d.s)} · ${d.n} leads<\u002Ftitle><\u002Fcircle>`;\n    off += len;\n    return a;\n  }).join('');\n  const shown = dashSrc === 'all' ? total : (data.find(d => d.s === dashSrc)?.n || 0);\n  return `<div class=\"don-wrap\">\n    <div class=\"don\">\n      <svg viewBox=\"0 0 140 140\" width=\"148\" height=\"148\"><circle cx=\"70\" cy=\"70\" r=\"52\" fill=\"none\" stroke=\"var(--steel-850)\" stroke-width=\"17\"><\u002Fcircle>${arcs}<\u002Fsvg>\n      <div class=\"mid\"><div class=\"v\">${shown}<\u002Fdiv><div class=\"l\">${dashSrc === 'all' ? 'all leads' : esc(dashSrc)}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"lg\">\n      ${data.map(d => `<button class=\"${dashSrc === d.s ? 'on' : ''}\" onclick=\"setSrc('${d.s}')\">\n        <span class=\"sw\" style=\"background:${SRC_COLOR[d.s]}\"><\u002Fspan><span>${esc(d.s)}<\u002Fspan>\n        <span class=\"c\">${d.n}<\u002Fspan><span class=\"p\">${pct(d.n, total)}%<\u002Fspan><\u002Fbutton>`).join('')}\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction funnelPanel(base) {\n  const quoted = base.filter(r => r.desk === 'bd' && r.value);\n  const steps = [\n    { n: 'Leads in', c: base.length, d: 'every enquiry that reached the CRE desk' },\n    { n: 'Claimed by a CRE', c: base.filter(r => r.creStage !== 'pool').length, d: 'picked out of the shared pool' },\n    { n: 'Qualified to BD', c: base.filter(r => r.creStage === 'qualified').length, d: 'accepted onto the BD desk' },\n    { n: 'Quotation sent', c: quoted.length, d: 'priced and shared' },\n    { n: 'Negotiation or better', c: base.filter(r => ['negotiation', 'awaiting', 'won'].includes(r.bdStage)).length, d: 'terms under discussion' },\n    { n: 'Won', c: base.filter(r => r.bdStage === 'won').length, d: 'advance received', cls: 'win' },\n  ];\n  const top = steps[0].c || 1;\n  return `<div class=\"panel\">\n    <div class=\"panel__head\"><h3>Deal funnel<\u002Fh3><span class=\"count\">${pct(steps[5].c, top)}% of leads convert<\u002Fspan><\u002Fdiv>\n    <div class=\"panel__body\">\n      <div class=\"fun\">\n        ${steps.map((s, i) => {\n          const drop = i ? steps[i - 1].c - s.c : 0;\n          return `<div class=\"fu ${s.cls || ''}\">\n            <div class=\"fill\" style=\"width:${Math.max(pct(s.c, top), 4)}%\"><\u002Fdiv>\n            <div><div class=\"nm\">${s.n}<\u002Fdiv><div class=\"df\">${s.d}<\u002Fdiv><\u002Fdiv>\n            <div class=\"rt\"><div class=\"n\">${s.c}<\u002Fdiv><div class=\"d\">${i ? '−' + drop + ' · ' + (100 - pct(s.c, steps[i - 1].c)) + '% drop' : pct(s.c, top) + '%'}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>`;\n        }).join('')}\n        <div class=\"fu loss\">\n          <div class=\"fill\" style=\"width:${pct(base.filter(r => r.lostBy).length, top)}%\"><\u002Fdiv>\n          <div><div class=\"nm\">Lost<\u002Fdiv><div class=\"df\">${base.filter(r => r.lostBy === 'cre').length} on the CRE desk · ${base.filter(r => r.lostBy === 'bd').length} after hand-off<\u002Fdiv><\u002Fdiv>\n          <div class=\"rt\"><div class=\"n\">${base.filter(r => r.lostBy).length}<\u002Fdiv><div class=\"d\">${pct(base.filter(r => r.lostBy).length, top)}% of leads<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction cashPanel(base) {\n  const series = [\n    { k: 'Pipeline created', c: 'var(--signal-blue)', v: MONTHS.map(m => base.filter(r => monthOf(r.created) === m).reduce((s, r) => s + dealVal(r), 0)) },\n    { k: 'Won', c: 'var(--signal-green)', v: MONTHS.map(m => base.filter(r => r.bdStage === 'won' && monthOf(r.closedAt) === m).reduce((s, r) => s + r.value, 0)) },\n    { k: 'Collected', c: 'var(--signal-amber)', v: MONTHS.map(m => base.filter(r => r.bdStage === 'won' && monthOf(r.closedAt) === m).reduce((s, r) => s + (r.paid || 0), 0)) },\n  ];\n  const max = Math.max(1, ...series.flatMap(s => s.v));\n  const W = 480, H = 150, L = 46, B = 24, T = 8;\n  const x = i => L + i * ((W - L - 8) / (MONTHS.length - 1));\n  const y = v => T + (1 - v / max) * (H - T - B);\n  const won = base.filter(r => r.bdStage === 'won');\n  const contract = won.reduce((s, r) => s + r.value, 0), collected = won.reduce((s, r) => s + (r.paid || 0), 0);\n  return `<div class=\"panel\">\n    <div class=\"panel__head\"><h3>Cash flow<\u002Fh3><span class=\"count\">${money(collected)} in · ${money(contract - collected)} outstanding<\u002Fspan><\u002Fdiv>\n    <div class=\"panel__body\">\n      <svg class=\"lchart\" viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"none\">\n        ${[0, .5, 1].map(f => `<line x1=\"${L}\" x2=\"${W - 8}\" y1=\"${y(max * f)}\" y2=\"${y(max * f)}\" stroke=\"var(--row-line)\"><\u002Fline>\n          <text x=\"${L - 7}\" y=\"${y(max * f) + 3}\" text-anchor=\"end\" font-size=\"9\" fill=\"var(--text-muted)\">₹${Math.round(max * f / 100000)}L<\u002Ftext>`).join('')}\n        ${MONTHS.map((m, i) => `<text x=\"${x(i)}\" y=\"${H - 7}\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--text-muted)\">${m} 26<\u002Ftext>`).join('')}\n        ${series.map(s => `<polyline fill=\"none\" stroke=\"${s.c}\" stroke-width=\"2\" stroke-linejoin=\"round\" points=\"${s.v.map((v, i) => x(i) + ',' + y(v)).join(' ')}\"><\u002Fpolyline>\n          ${s.v.map((v, i) => `<circle cx=\"${x(i)}\" cy=\"${y(v)}\" r=\"3\" fill=\"var(--paper)\" stroke=\"${s.c}\" stroke-width=\"2\"><title>${s.k} · ${MONTHS[i]} · ${money(v)}<\u002Ftitle><\u002Fcircle>`).join('')}`).join('')}\n      <\u002Fsvg>\n      <div class=\"ck\">${series.map(s => `<span><i style=\"background:${s.c}\"><\u002Fi>${s.k}<\u002Fspan>`).join('')}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction lostPanel(base) {\n  const reasons = CRE_LOST.concat(BD_LOST).map(rn => ({\n    rn, cre: base.filter(r => r.lostBy === 'cre' && r.lostReason === rn).length,\n    bd: base.filter(r => r.lostBy === 'bd' && r.lostReason === rn).length,\n  })).map(d => Object.assign(d, { t: d.cre + d.bd })).filter(d => d.t).sort((a, b) => b.t - a.t);\n  const max = Math.max(1, ...reasons.map(d => d.t));\n  return `<div class=\"panel\">\n    <div class=\"panel__head\"><h3>Why we lose<\u002Fh3><span class=\"count\">top: ${esc(reasons[0]?.rn || '—')}<\u002Fspan><\u002Fdiv>\n    <div class=\"panel__body\">\n      ${reasons.map(d => `<div class=\"dbar\">\n        <span>${esc(d.rn)}<\u002Fspan>\n        <div class=\"stack\" style=\"width:${Math.max(pct(d.t, max), 6)}%\">\n          <i style=\"flex:${d.cre};background:var(--signal-red)\" title=\"CRE lost\"><\u002Fi>\n          <i style=\"flex:${d.bd};background:var(--signal-amber)\" title=\"BD lost\"><\u002Fi>\n        <\u002Fdiv>\n        <span class=\"num\">${d.t}<\u002Fspan>\n      <\u002Fdiv>`).join('') || '<div class=\"empty\">No losses in this slice.<\u002Fdiv>'}\n      <div class=\"ck\"><span><i style=\"background:var(--signal-red);height:8px;width:8px;border-radius:2px\"><\u002Fi>Lost by the CRE<\u002Fspan><span><i style=\"background:var(--signal-amber);height:8px;width:8px;border-radius:2px\"><\u002Fi>Lost by the BDE<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction empPanel(base) {\n  let rows = empStats(base);\n  if (dashRole !== 'all') rows = rows.filter(r => r.role === dashRole);\n  const key = dashSort;\n  rows.sort((a, b) => key === 'name' ? a.name.localeCompare(b.name) * -dashDir : (a[key] - b[key]) * dashDir);\n  const maxVal = Math.max(1, ...rows.map(r => r.val));\n  const th = (k, l, r) => `<th class=\"s ${dashSort === k ? 'act' : ''} ${r ? 'r' : ''}\" onclick=\"sortDash('${k}')\">${l}<span class=\"ar\">${dashSort === k ? (dashDir === -1 ? '▼' : '▲') : '◆'}<\u002Fspan><\u002Fth>`;\n  return `<div class=\"panel\">\n    <div class=\"panel__head\"><h3>Employee by employee<\u002Fh3>\n      <div class=\"chips\">\n        <button class=\"chip ${dashRole === 'all' ? 'on' : ''}\" onclick=\"dashRole='all';render()\">Everyone<\u002Fbutton>\n        <button class=\"chip ${dashRole === 'CRE' ? 'on' : ''}\" onclick=\"dashRole='CRE';render()\">CRE<\u002Fbutton>\n        <button class=\"chip ${dashRole === 'BDE' ? 'on' : ''}\" onclick=\"dashRole='BDE';render()\">BDE<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel__body\" style=\"padding:0;overflow-x:auto\">\n      <table class=\"t\">\n        <thead><tr>${th('name', 'Person')}<th>Role<\u002Fth>${th('touched', 'Handled', 1)}${th('handed', 'Handed on', 1)}${th('won', 'Won', 1)}${th('lost', 'Lost', 1)}${th('rate', 'Rate', 1)}${th('val', 'Value won', 1)}<th>Top loss reason<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>${rows.map(r => `<tr onclick=\"drillPerson('${r.name.replace(/'/g, \"\\\\'\")}','${r.role}')\" style=\"cursor:pointer\">\n          <td>${avHtml(r.name)}<\u002Ftd>\n          <td><span class=\"pill ${r.role === 'CRE' ? 'blue' : 'amber'}\"><i><\u002Fi>${r.role}<\u002Fspan><\u002Ftd>\n          <td class=\"r\">${r.touched}<\u002Ftd>\n          <td class=\"r\">${r.handed}<\u002Ftd>\n          <td class=\"r\" style=\"color:var(--signal-green)\">${r.won}<\u002Ftd>\n          <td class=\"r\" style=\"color:var(--signal-red)\">${r.lost}<\u002Ftd>\n          <td class=\"r\"><div style=\"display:flex;align-items:center;gap:7px;justify-content:flex-end\"><span>${r.rate}%<\u002Fspan><div class=\"mini\"><i style=\"width:${r.rate}%\"><\u002Fi><\u002Fdiv><\u002Fdiv><div class=\"sub\" style=\"text-align:right\">${r.rateLabel}<\u002Fdiv><\u002Ftd>\n          <td class=\"r\">${money(r.val)}<div class=\"mini\" style=\"margin-top:4px\"><i style=\"width:${pct(r.val, maxVal)}%;background:var(--signal-green)\"><\u002Fi><\u002Fdiv><\u002Ftd>\n          <td>${r.topLoss === '—' ? '<span class=\"muted\">—<\u002Fspan>' : `<span class=\"pill red\"><i><\u002Fi>${esc(r.topLoss)}<\u002Fspan>`}<\u002Ftd>\n        <\u002Ftr>`).join('')}<\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction renderDash() {\n  const base = dashBase();\n  const won = base.filter(r => r.bdStage === 'won');\n  const lost = base.filter(r => r.lostBy);\n  const live = base.filter(isLive);\n  const contract = won.reduce((s, r) => s + r.value, 0);\n  const collected = won.reduce((s, r) => s + (r.paid || 0), 0);\n  document.getElementById('v-dash').innerHTML = `\n    ${dashSrc !== 'all' ? `<div class=\"pipe-hint\"><span>◆<\u002Fspan>Everything below is filtered to <b>&nbsp;${esc(dashSrc)}&nbsp;<\u002Fb> leads. <a onclick=\"setSrc('${dashSrc}')\" style=\"cursor:pointer;color:var(--accent-hover);margin-left:6px\">Clear<\u002Fa><\u002Fdiv>` : ''}\n    <div class=\"stat-strip\">\n      <div class=\"st\"><div class=\"l\">Leads<\u002Fdiv><div class=\"v\">${base.length}<\u002Fdiv><div class=\"d\">${dashSrc === 'all' ? 'all sources' : esc(dashSrc)}<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Live now<\u002Fdiv><div class=\"v\">${live.length}<\u002Fdiv><div class=\"d\">${live.filter(r => r.desk === 'cre').length} CRE · ${live.filter(r => r.desk === 'bd').length} BD<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Won<\u002Fdiv><div class=\"v\">${won.length}<\u002Fdiv><div class=\"d\">${pct(won.length, base.length)}% of leads<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Lost<\u002Fdiv><div class=\"v\">${lost.length}<\u002Fdiv><div class=\"d\">${lost.filter(r => r.lostBy === 'cre').length} CRE · ${lost.filter(r => r.lostBy === 'bd').length} BD<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Won value<\u002Fdiv><div class=\"v\">${money(contract)}<\u002Fdiv><div class=\"d\">${money(collected)} collected<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Open pipeline<\u002Fdiv><div class=\"v\">${money(live.reduce((s, r) => s + dealVal(r), 0))}<\u002Fdiv><div class=\"d\">quoted or estimated<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dash-grid g-32\">\n      <div class=\"panel\">\n        <div class=\"panel__head\"><h3>Where leads come from<\u002Fh3><span class=\"count\">click a slice to filter<\u002Fspan><\u002Fdiv>\n        <div class=\"panel__body\">${srcDonut(base)}<\u002Fdiv>\n      <\u002Fdiv>\n      ${funnelPanel(base)}\n    <\u002Fdiv>\n    <div class=\"dash-grid mt-12\">${empPanel(base)}<\u002Fdiv>\n    <div class=\"dash-grid g-2 mt-12\">${cashPanel(base)}${lostPanel(base)}<\u002Fdiv>`;\n}\n\n/* ============================ CRE desk ============================ */\nconst creLive = () => ROWS.filter(r => r.creStage !== 'lost');\nfunction renderCre() {\n  let rows = creLive();\n  if (crePerson !== 'all') rows = rows.filter(r => r.cre === crePerson);\n  const scoped = rows;\n  if (creStage !== 'all') rows = rows.filter(r => r.creStage === creStage);\n\n  const n = k => scoped.filter(r => r.creStage === k).length;\n  document.getElementById('v-cre').innerHTML = `\n    <div class=\"stat-strip\">\n      <div class=\"st\"><div class=\"l\">Leads on the desk<\u002Fdiv><div class=\"v\">${scoped.length}<\u002Fdiv><div class=\"d\">${crePerson === 'all' ? CRES.length + ' executives' : esc(crePerson)}<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Unclaimed<\u002Fdiv><div class=\"v\">${n('pool')}<\u002Fdiv><div class=\"d\">nobody owns these yet<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">In follop<\u002Fdiv><div class=\"v\">${n('follop')}<\u002Fdiv><div class=\"d\">call cycle running<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Waiting for photos<\u002Fdiv><div class=\"v\">${n('photos')}<\u002Fdiv><div class=\"d\">blocked on the customer<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Qualified to BD<\u002Fdiv><div class=\"v\">${n('qualified')}<\u002Fdiv><div class=\"d\">handed over<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"toolbar\">\n      <span class=\"lbl\">Executive<\u002Fspan>\n      <select class=\"sel\" onchange=\"crePerson=this.value;render()\">\n        <option value=\"all\"${crePerson === 'all' ? ' selected' : ''}>All CREs<\u002Foption>\n        ${CRES.map(c => `<option${crePerson === c ? ' selected' : ''}>${esc(c)}<\u002Foption>`).join('')}\n      <\u002Fselect>\n      <div class=\"tb-sep\"><\u002Fdiv>\n      <div class=\"chips\">\n        <button class=\"chip ${creStage === 'all' ? 'on' : ''}\" onclick=\"creStage='all';render()\">All<span class=\"n\">${scoped.length}<\u002Fspan><\u002Fbutton>\n        ${Object.entries(CRE_STAGES).map(([k, v]) => `<button class=\"chip ${creStage === k ? 'on' : ''}\" onclick=\"creStage='${k}';render()\">${esc(v)}<span class=\"n\">${n(k)}<\u002Fspan><\u002Fbutton>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tbl-wrap\">\n      <table class=\"t\">\n        <thead><tr><th>Customer<\u002Fth><th>CRE<\u002Fth><th>Stage<\u002Fth><th>Tag<\u002Fth><th>Source<\u002Fth><th>Created<\u002Fth><th class=\"r\">Estimate<\u002Fth><th>On BD side<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>${rows.map(r => `\n          <tr onclick=\"openRecord(${r.id})\" style=\"cursor:pointer\">\n            <td><div class=\"cust\">${esc(r.customer)}<\u002Fdiv><div class=\"sub\">${esc(r.phone)} · ${esc(r.place)}<\u002Fdiv><\u002Ftd>\n            <td>${r.creStage === 'pool' ? '<span class=\"muted\">unclaimed<\u002Fspan>' : avHtml(r.cre)}<\u002Ftd>\n            <td><span class=\"pill ${r.creStage === 'qualified' ? 'green' : r.creStage === 'photos' ? 'amber' : ''}\"><i><\u002Fi>${esc(CRE_STAGES[r.creStage])}<\u002Fspan><\u002Ftd>\n            <td>${r.creTag ? `<span class=\"pill\">${esc(r.creTag)}<\u002Fspan>` : '<span class=\"muted\">—<\u002Fspan>'}<\u002Ftd>\n            <td>${esc(r.source)}<\u002Ftd>\n            <td class=\"r\">${esc(r.created)}<\u002Ftd>\n            <td class=\"r\">${r.est ? money(r.est) : '—'}<\u002Ftd>\n            <td>${r.bde ? `<span class=\"pill blue\"><i><\u002Fi>${esc(BD_STAGES[r.bdStage] || 'Lost')}<\u002Fspan><div class=\"sub\">${esc(r.bde)}<\u002Fdiv>` : '<span class=\"muted\">—<\u002Fspan>'}<\u002Ftd>\n          <\u002Ftr>`).join('') || `<tr><td colspan=\"8\" class=\"empty\">No leads in this slice.<\u002Ftd><\u002Ftr>`}\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>`;\n}\n\n/* ============================ BD desk ============================ */\nconst bdLive = () => ROWS.filter(r => r.desk === 'bd' && r.bdStage !== 'lost');\nfunction renderBde() {\n  let rows = bdLive();\n  if (bdePerson !== 'all') rows = rows.filter(r => r.bde === bdePerson);\n  const scoped = rows;\n  if (bdStage !== 'all') rows = rows.filter(r => r.bdStage === bdStage);\n\n  const n = k => scoped.filter(r => r.bdStage === k).length;\n  const openVal = scoped.filter(r => r.bdStage !== 'won').reduce((s, r) => s + r.value, 0);\n  document.getElementById('v-bde').innerHTML = `\n    <div class=\"stat-strip\">\n      <div class=\"st\"><div class=\"l\">Deals owned<\u002Fdiv><div class=\"v\">${scoped.length}<\u002Fdiv><div class=\"d\">${bdePerson === 'all' ? BDES.length + ' engineers' : esc(bdePerson)}<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Open value<\u002Fdiv><div class=\"v\">${money(openVal)}<\u002Fdiv><div class=\"d\">quoted and beyond<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">In negotiation<\u002Fdiv><div class=\"v\">${n('negotiation')}<\u002Fdiv><div class=\"d\">price under pressure<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Awaiting advance<\u002Fdiv><div class=\"v\">${n('awaiting')}<\u002Fdiv><div class=\"d\">agreed, unpaid<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Won<\u002Fdiv><div class=\"v\">${n('won')}<\u002Fdiv><div class=\"d\">this list<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"toolbar\">\n      <span class=\"lbl\">Engineer<\u002Fspan>\n      <select class=\"sel\" onchange=\"bdePerson=this.value;render()\">\n        <option value=\"all\"${bdePerson === 'all' ? ' selected' : ''}>All BDEs<\u002Foption>\n        ${BDES.map(c => `<option${bdePerson === c ? ' selected' : ''}>${esc(c)}<\u002Foption>`).join('')}\n      <\u002Fselect>\n      <div class=\"tb-sep\"><\u002Fdiv>\n      <div class=\"chips\">\n        <button class=\"chip ${bdStage === 'all' ? 'on' : ''}\" onclick=\"bdStage='all';render()\">All<span class=\"n\">${scoped.length}<\u002Fspan><\u002Fbutton>\n        ${Object.entries(BD_STAGES).map(([k, v]) => `<button class=\"chip ${bdStage === k ? 'on' : ''}\" onclick=\"bdStage='${k}';render()\">${esc(v)}<span class=\"n\">${n(k)}<\u002Fspan><\u002Fbutton>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tbl-wrap\">\n      <table class=\"t\">\n        <thead><tr><th>Customer<\u002Fth><th>BDE<\u002Fth><th>Stage<\u002Fth><th>Handed over by<\u002Fth><th>Source<\u002Fth><th class=\"r\">Order value<\u002Fth><th>Admin tags<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>${rows.map(r => `\n          <tr onclick=\"openRecord(${r.id})\" style=\"cursor:pointer\">\n            <td><div class=\"cust\">${esc(r.customer)}<\u002Fdiv><div class=\"sub\">${esc(r.phone)} · ${esc(r.place)}<\u002Fdiv><\u002Ftd>\n            <td>${avHtml(r.bde)}<\u002Ftd>\n            <td><span class=\"pill ${r.bdStage === 'won' ? 'green' : r.bdStage === 'negotiation' ? 'amber' : ''}\"><i><\u002Fi>${esc(BD_STAGES[r.bdStage])}<\u002Fspan><\u002Ftd>\n            <td>${avHtml(r.cre)}<\u002Ftd>\n            <td>${esc(r.source)}<\u002Ftd>\n            <td class=\"r\">${r.value ? money(r.value) : '<span class=\"muted\">not quoted<\u002Fspan>'}<\u002Ftd>\n            <td>${r.adminTags.length ? r.adminTags.map(t => `<span class=\"pill adm ${ADMIN_TONE[t]}\"><i><\u002Fi>${esc(t)}<\u002Fspan>`).join(' ') : '<span class=\"muted\">—<\u002Fspan>'}<\u002Ftd>\n          <\u002Ftr>`).join('') || `<tr><td colspan=\"7\" class=\"empty\">No deals in this slice.<\u002Ftd><\u002Ftr>`}\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>`;\n}\n\n/* ============================ sales pipeline ============================ */\nfunction pipeRows() {\n  let rows = ROWS.filter(isLive);\n  if (pipeDesk !== 'all') rows = rows.filter(r => r.desk === pipeDesk);\n  if (pipeBde !== 'all') rows = rows.filter(r => owner(r) === pipeBde);\n  if (pipeTag !== 'all') rows = rows.filter(r => r.adminTags.includes(pipeTag));\n  if (pipeSort === 'manual') rows.sort((a, b) => RANK.indexOf(a.id) - RANK.indexOf(b.id));\n  if (pipeSort === 'bde') rows.sort((a, b) => String(owner(a)).localeCompare(String(owner(b))) || dealVal(b) - dealVal(a));\n  if (pipeSort === 'value') rows.sort((a, b) => dealVal(a) - dealVal(b));\n  if (pipeSort === 'source') rows.sort((a, b) => a.source.localeCompare(b.source) || a.customer.localeCompare(b.customer));\n  if (pipeSort === 'tags') rows.sort((a, b) => (ADMIN_TAGS.indexOf(a.adminTags[0]) + 1 || 99) - (ADMIN_TAGS.indexOf(b.adminTags[0]) + 1 || 99));\n  return rows;\n}\nfunction renderPipe() {\n  const rows = pipeRows();\n  const drag = pipeSort === 'manual';\n  const total = rows.reduce((s, r) => s + dealVal(r), 0);\n  const nCre = ROWS.filter(r => r.desk === 'cre' && isLive(r)).length;\n  const nBd = ROWS.filter(r => r.desk === 'bd' && isLive(r)).length;\n  document.getElementById('v-pipe').innerHTML = `\n    <div class=\"stat-strip\">\n      <div class=\"st\"><div class=\"l\">Live records<\u002Fdiv><div class=\"v\">${rows.length}<\u002Fdiv><div class=\"d\">ranked by you<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">On the CRE side<\u002Fdiv><div class=\"v\">${nCre}<\u002Fdiv><div class=\"d\">not yet handed over<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">On the BD side<\u002Fdiv><div class=\"v\">${nBd}<\u002Fdiv><div class=\"d\">quoting and closing<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Pipeline value<\u002Fdiv><div class=\"v\">${money(total)}<\u002Fdiv><div class=\"d\">quoted or estimated<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Watching<\u002Fdiv><div class=\"v\">${ROWS.filter(r => r.watch).length}<\u002Fdiv><div class=\"d\">notify me is on<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"toolbar\">\n      <div class=\"chips\">\n        <button class=\"chip ${pipeDesk === 'all' ? 'on' : ''}\" onclick=\"pipeDesk='all';pipeBde='all';render()\">Both desks<span class=\"n\">${nCre + nBd}<\u002Fspan><\u002Fbutton>\n        <button class=\"chip ${pipeDesk === 'cre' ? 'on' : ''}\" onclick=\"pipeDesk='cre';pipeBde='all';render()\">CRE side<span class=\"n\">${nCre}<\u002Fspan><\u002Fbutton>\n        <button class=\"chip ${pipeDesk === 'bd' ? 'on' : ''}\" onclick=\"pipeDesk='bd';pipeBde='all';render()\">BD side<span class=\"n\">${nBd}<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"tb-sep\"><\u002Fdiv>\n      <span class=\"lbl\">Sort by<\u002Fspan>\n      <select class=\"sel\" onchange=\"pipeSort=this.value;render()\">\n        <option value=\"manual\"${pipeSort === 'manual' ? ' selected' : ''}>My order — drag to rank<\u002Foption>\n        <option value=\"bde\"${pipeSort === 'bde' ? ' selected' : ''}>Owner<\u002Foption>\n        <option value=\"value\"${pipeSort === 'value' ? ' selected' : ''}>Value — lowest first<\u002Foption>\n        <option value=\"source\"${pipeSort === 'source' ? ' selected' : ''}>Lead source<\u002Foption>\n        <option value=\"tags\"${pipeSort === 'tags' ? ' selected' : ''}>Tags<\u002Foption>\n      <\u002Fselect>\n      <div class=\"tb-sep\"><\u002Fdiv>\n      <span class=\"lbl\">Owner<\u002Fspan>\n      <select class=\"sel\" onchange=\"pipeBde=this.value;render()\">\n        <option value=\"all\"${pipeBde === 'all' ? ' selected' : ''}>Everyone<\u002Foption>\n        ${(pipeDesk === 'bd' ? BDES : pipeDesk === 'cre' ? CRES : CRES.concat(BDES)).map(b => `<option${pipeBde === b ? ' selected' : ''}>${esc(b)}<\u002Foption>`).join('')}\n      <\u002Fselect>\n      <div class=\"tb-sep\"><\u002Fdiv>\n      <div class=\"chips\">\n        <button class=\"chip ${pipeTag === 'all' ? 'on' : ''}\" onclick=\"pipeTag='all';render()\">All tags<\u002Fbutton>\n        ${ADMIN_TAGS.map(t => `<button class=\"chip ${pipeTag === t ? 'on' : ''}\" onclick=\"pipeTag='${t}';render()\">${esc(t)}<span class=\"n\">${ROWS.filter(r => r.adminTags.includes(t)).length}<\u002Fspan><\u002Fbutton>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pipe-hint\"><span>◆<\u002Fspan>${drag\n      ? 'Drag a card by its handle to move it up or down. This ranking is yours alone.'\n      : 'Sorted by ' + (pipeSort === 'value' ? 'value' : pipeSort === 'bde' ? 'owner' : pipeSort === 'source' ? 'lead source' : 'tags') + ' — switch back to <b>My order<\u002Fb> to drag.'}\n      Both desks sit in one list — CRE leads still being worked and BD deals being closed. Tags, notes and “notify me” are Admin-only.<\u002Fdiv>\n    <div class=\"plist\" id=\"plist\">\n      ${rows.map((r, i) => `\n        <div class=\"pcard ${drag ? '' : 'nodrag'} ${r.watch ? 'watch' : ''}\" data-id=\"${r.id}\" ${drag ? 'draggable=\"true\"' : ''}>\n          <div class=\"grip\"><span class=\"rk\">${i + 1}<\u002Fspan><span class=\"dots\">⠿<\u002Fspan><\u002Fdiv>\n          <div>\n            <div class=\"pc-top\">\n              <span class=\"c\" onclick=\"openRecord(${r.id})\" style=\"cursor:pointer\">${esc(r.customer)}<\u002Fspan>\n              <span class=\"pill ${r.desk === 'bd' ? 'blue' : ''}\"><i><\u002Fi>${r.desk === 'bd' ? 'BD' : 'CRE'}<\u002Fspan>\n              <span class=\"pill\"><i><\u002Fi>${esc(stageLabel(r))}<\u002Fspan>\n              ${r.creStage === 'pool' ? '<span class=\"pill amber\"><i><\u002Fi>unclaimed<\u002Fspan>' : avHtml(owner(r))}\n            <\u002Fdiv>\n            <div class=\"pc-meta\">${esc(r.place)} · ${esc(r.source)} · ${r.desk === 'bd' ? 'handed over by ' + esc(r.cre) : 'on the CRE desk'} · ${esc(r.created)}<\u002Fdiv>\n            <div class=\"pc-tags\">\n              ${r.adminTags.map(t => `<span class=\"pill adm ${ADMIN_TONE[t]}\" onclick=\"dropTag(${r.id},'${t}')\" style=\"cursor:pointer\" title=\"Remove\"><i><\u002Fi>${esc(t)} ✕<\u002Fspan>`).join('')}\n              ${r.adminTags.length ? '' : '<span class=\"muted\" style=\"font-size:12px\">No admin tag<\u002Fspan>'}\n            <\u002Fdiv>\n            <div class=\"tagpick\">${ADMIN_TAGS.filter(t => !r.adminTags.includes(t)).map(t => `<button onclick=\"addTag(${r.id},'${t}')\">+ ${esc(t)}<\u002Fbutton>`).join('')}<\u002Fdiv>\n            ${notesBlock(r)}\n          <\u002Fdiv>\n          <div class=\"pc-right\">\n            <div class=\"pc-val\">${dealVal(r) ? money(dealVal(r)) : '—'}<div style=\"font-size:10.5px;font-weight:400;color:var(--text-muted);text-align:right;letter-spacing:.04em;text-transform:uppercase\">${r.desk === 'bd' && r.value ? 'quoted' : 'estimate'}<\u002Fdiv><\u002Fdiv>\n            <button class=\"watchbtn ${r.watch ? 'on' : ''}\" onclick=\"toggleWatch(${r.id})\">${r.watch ? '● Notifying me' : 'Notify me'}<\u002Fbutton>\n            <div class=\"pc-acts\">\n              <button class=\"btn btn-outline btn-sm\" onclick=\"toggleNotes(${r.id})\">${openNotes.has(r.id) ? 'Hide notes' : 'Notes'}${noteCount(r) ? `<span class=\"notebadge\">${noteCount(r)}<\u002Fspan>` : ''}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>`).join('') || '<div class=\"tbl-wrap\"><div class=\"empty\">Nothing in this slice.<\u002Fdiv><\u002Fdiv>'}\n    <\u002Fdiv>`;\n  if (drag) wireDrag();\n}\n\nlet dragId = null;\nfunction wireDrag() {\n  document.querySelectorAll('#plist .pcard').forEach(card => {\n    card.addEventListener('dragstart', e => { dragId = +card.dataset.id; card.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; });\n    card.addEventListener('dragend', () => { card.classList.remove('drag'); document.querySelectorAll('.pcard').forEach(c => c.classList.remove('over')); });\n    card.addEventListener('dragover', e => { e.preventDefault(); if (+card.dataset.id !== dragId) card.classList.add('over'); });\n    card.addEventListener('dragleave', () => card.classList.remove('over'));\n    card.addEventListener('drop', e => {\n      e.preventDefault();\n      const target = +card.dataset.id;\n      if (!dragId || dragId === target) return;\n      RANK = RANK.filter(x => x !== dragId);\n      RANK.splice(RANK.indexOf(target), 0, dragId);\n      const moved = ROWS.find(r => r.id === dragId);\n      dragId = null;\n      render();\n      showToast(moved.customer + ' moved to #' + (RANK.indexOf(moved.id) + 1));\n    });\n  });\n}\nfunction addTag(id, t) { const r = ROWS.find(x => x.id === id); r.adminTags.push(t); render(); }\nfunction dropTag(id, t) { const r = ROWS.find(x => x.id === id); r.adminTags = r.adminTags.filter(x => x !== t); render(); }\nfunction toggleWatch(id) {\n  const r = ROWS.find(x => x.id === id); r.watch = !r.watch; render();\n  showToast(r.watch ? 'Notifying you on every move on ' + r.customer : 'Stopped notifications for ' + r.customer);\n}\n/* ---- sticky notes: they live inside the record's own card, never in a floating window ---- */\nconst NOTE_PAPER = ['#f6e7a8', '#e8dff7', '#d9ecd6', '#f7ddd0', '#dde8f4'];\nconst nStamp = () => new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });\nconst openNotes = new Set();\n\nfunction migrateNotes() {\n  ROWS.forEach(r => {\n    if (!r.notes) r.notes = [];\n    if (r.note && !r.notes.length) r.notes.push({ text: r.note, color: NOTE_PAPER[0], at: (r.created || '').split(',')[0] || nStamp(), pinned: true });\n  });\n}\nfunction syncNote(r) {\n  const p = r.notes.find(n => n.pinned) || r.notes[0];\n  r.note = p ? p.text : '';\n}\nfunction noteCount(r) { return (r.notes || []).filter(n => n.text.trim()).length; }\nfunction repaint() { render(); if (openId) fillSheet(openId); }\n\nfunction stickyHtml(r, n, j) {\n  return `<div class=\"sticky ${n.pinned ? 'pinned' : ''}\" style=\"background:${n.color}\">\n    <textarea placeholder=\"Type the note…\" oninput=\"noteEdit(${r.id},${j},this.value)\">${esc(n.text)}<\u002Ftextarea>\n    <div class=\"sticky__foot\">\n      <span>${esc(n.at)}<\u002Fspan>\n      <span class=\"ac\" onclick=\"notePin(${r.id},${j})\">${n.pinned ? 'Unpin' : 'Pin'}<\u002Fspan>\n      <span class=\"ac\" onclick=\"noteDel(${r.id},${j})\">Delete<\u002Fspan>\n      <span class=\"sw\">${NOTE_PAPER.map(c => `<i class=\"${c === n.color ? 'on' : ''}\" style=\"background:${c}\" onclick=\"noteColor(${r.id},${j},'${c}')\"><\u002Fi>`).join('')}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n/* collapsed: the pinned note as a card strip. open: the editable sticky board, inline. */\nfunction notesBlock(r) {\n  const n = noteCount(r);\n  if (!openNotes.has(r.id)) {\n    return r.notes.filter(x => x.text.trim()).map(x =>\n      `<div class=\"pc-note\" style=\"border-left:3px solid ${x.color};cursor:pointer\" onclick=\"toggleNotes(${r.id})\"><b>${x.pinned ? 'Pinned note' : 'Admin note'} · ${esc(x.at)}<\u002Fb>${esc(x.text)}<\u002Fdiv>`).join('');\n  }\n  return `<div class=\"nbox\">\n    <div class=\"nbox__head\"><span>Sticky notes · admin only<\u002Fspan><span class=\"cl\" onclick=\"toggleNotes(${r.id})\">Close ✕<\u002Fspan><\u002Fdiv>\n    <div class=\"nstack\">${r.notes.map((x, j) => stickyHtml(r, x, j)).join('')}<\u002Fdiv>\n    <div class=\"nbox__foot\">\n      <button class=\"btn btn-outline btn-sm\" onclick=\"noteAdd(${r.id})\">+ New note<\u002Fbutton>\n      <span class=\"hint\">${n} note${n === 1 ? '' : 's'} · saves as you type<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction toggleNotes(id) {\n  const r = ROWS.find(x => x.id === id); if (!r) return;\n  if (openNotes.has(id)) {\n    openNotes.delete(id);\n    r.notes = r.notes.filter(n => n.text.trim()); syncNote(r);\n  } else {\n    openNotes.add(id);\n    if (!r.notes.length) r.notes.push({ text: '', color: NOTE_PAPER[0], at: nStamp(), pinned: false });\n  }\n  repaint();\n  if (openNotes.has(id)) document.querySelector('.nbox textarea')?.focus();\n}\nconst openNote = toggleNotes;\nfunction noteEdit(id, j, v) {\n  const r = ROWS.find(x => x.id === id); if (!r) return;\n  r.notes[j].text = v; r.notes[j].at = nStamp(); syncNote(r);\n}\nfunction noteAdd(id) {\n  const r = ROWS.find(x => x.id === id); if (!r) return;\n  r.notes.unshift({ text: '', color: NOTE_PAPER[r.notes.length % NOTE_PAPER.length], at: nStamp(), pinned: false });\n  repaint();\n  document.querySelector('.nbox textarea')?.focus();\n}\nfunction noteDel(id, j) {\n  const r = ROWS.find(x => x.id === id); if (!r) return;\n  r.notes.splice(j, 1); syncNote(r);\n  if (!r.notes.length) openNotes.delete(id);\n  repaint();\n}\nfunction notePin(id, j) {\n  const r = ROWS.find(x => x.id === id); if (!r) return;\n  const was = r.notes[j].pinned;\n  r.notes.forEach(n => n.pinned = false);\n  r.notes[j].pinned = !was; syncNote(r);\n  repaint();\n}\nfunction noteColor(id, j, c) {\n  const r = ROWS.find(x => x.id === id); if (!r) return;\n  r.notes[j].color = c; repaint();\n}\n\n/* ---- a dated timeline of closings, filterable by month range ---- */\nconst M_ORDER = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst dayOf = s => parseInt(String(s), 10) || 0;\nconst mIdx = s => M_ORDER.indexOf(monthOf(s));\nconst whenOf = (r, kind) => kind === 'won' ? r.closedAt : r.lostAt;\nlet tlFrom = { won: 0, lost: 0 }, tlTo = { won: 11, lost: 11 }, tlDir = { won: -1, lost: -1 };\n\nfunction tlSet(kind, which, v) {\n  const n = Number(v);\n  if (which === 'from') { tlFrom[kind] = n; if (tlTo[kind] < n) tlTo[kind] = n; }\n  else { tlTo[kind] = n; if (tlFrom[kind] > n) tlFrom[kind] = n; }\n  render();\n}\nfunction tlFlip(kind) { tlDir[kind] *= -1; render(); }\n\nfunction timelinePanel(rows, kind) {\n  const all = rows.map(r => ({ r, when: whenOf(r, kind), i: mIdx(whenOf(r, kind)) })).filter(x => x.i >= 0);\n  const lo = tlFrom[kind], hi = tlTo[kind], dir = tlDir[kind];\n  const items = all.filter(x => x.i >= lo && x.i <= hi)\n    .sort((x, y) => ((y.i - x.i) || (dayOf(y.when) - dayOf(x.when))) * (dir === -1 ? 1 : -1));\n  const val = items.reduce((s, x) => s + (x.r.value || x.r.est), 0);\n  const opts = (sel, which) => M_ORDER.map((m, i) => `<option value=\"${i}\"${i === sel ? ' selected' : ''}>${m} 2026<\u002Foption>`).join('');\n\n  let last = '', html = '';\n  items.forEach(({ r, when }) => {\n    const m = monthOf(when);\n    if (m !== last) { last = m; html += `<div class=\"tl-m\">${m} 2026<\u002Fdiv>`; }\n    const who = kind === 'won' ? r.bde : (r.lostBy === 'bd' ? r.bde : r.cre);\n    html += `<div class=\"tl-i ${kind === 'won' ? '' : 'l'}\" onclick=\"openRecord(${r.id})\">\n      <div><div class=\"c\">${esc(r.customer)}<\u002Fdiv>\n        <div class=\"s\">${esc(who)} · ${kind === 'won' ? 'advance received' : esc(r.lostReason)} · ${esc(r.source)}<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"v\">${money(r.value || r.est)}<\u002Fdiv><div class=\"d\">${esc(when)}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`;\n  });\n\n  return `<div class=\"panel mt-12\">\n    <div class=\"panel__head\"><h3>Timeline<\u002Fh3><span class=\"count\">${items.length} ${kind === 'won' ? 'won' : 'lost'} · ${money(val)}<\u002Fspan><\u002Fdiv>\n    <div class=\"panel__body\">\n      <div class=\"toolbar\" style=\"margin-bottom:11px\">\n        <span class=\"lbl\">From<\u002Fspan>\n        <select class=\"sel\" onchange=\"tlSet('${kind}','from',this.value)\">${opts(lo)}<\u002Fselect>\n        <span class=\"lbl\">to<\u002Fspan>\n        <select class=\"sel\" onchange=\"tlSet('${kind}','to',this.value)\">${opts(hi)}<\u002Fselect>\n        <div class=\"tb-sep\"><\u002Fdiv>\n        <button class=\"chip on\" onclick=\"tlFlip('${kind}')\">${dir === -1 ? 'Newest first' : 'Oldest first'} ⇅<\u002Fbutton>\n        ${lo > 0 || hi < 11 ? `<button class=\"chip\" onclick=\"tlFrom['${kind}']=0;tlTo['${kind}']=11;render()\">Full year<\u002Fbutton>` : ''}\n      <\u002Fdiv>\n      <div class=\"tl\">${html || '<div class=\"empty\">Nothing closed in that range.<\u002Fdiv>'}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n/* ============================ deal closed (won) ============================ */\nfunction renderClosed() {\n  const rows = ROWS.filter(r => r.bdStage === 'won');\n  const total = rows.reduce((s, r) => s + r.value, 0);\n  const collected = rows.reduce((s, r) => s + (r.paid || 0), 0);\n  document.getElementById('v-closed').innerHTML = `\n    <div class=\"stat-strip\">\n      <div class=\"st\"><div class=\"l\">Deals won<\u002Fdiv><div class=\"v\">${rows.length}<\u002Fdiv><div class=\"d\">this quarter<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Contract value<\u002Fdiv><div class=\"v\">${money(total)}<\u002Fdiv><div class=\"d\">signed<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Collected<\u002Fdiv><div class=\"v\">${money(collected)}<\u002Fdiv><div class=\"d\">advance + installments<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Outstanding<\u002Fdiv><div class=\"v\">${money(total - collected)}<\u002Fdiv><div class=\"d\">still to come in<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tbl-wrap\">\n      <table class=\"t\">\n        <thead><tr><th>Customer<\u002Fth><th>BDE<\u002Fth><th>CRE<\u002Fth><th>Source<\u002Fth><th>Closed on<\u002Fth><th class=\"r\">Contract<\u002Fth><th class=\"r\">Collected<\u002Fth><th>Payment<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>${rows.map(r => {\n          const bal = r.value - (r.paid || 0);\n          return `<tr onclick=\"openRecord(${r.id})\" style=\"cursor:pointer\">\n            <td><div class=\"cust\">${esc(r.customer)}<\u002Fdiv><div class=\"sub\">${esc(r.place)}<\u002Fdiv><\u002Ftd>\n            <td>${avHtml(r.bde)}<\u002Ftd>\n            <td>${avHtml(r.cre)}<\u002Ftd>\n            <td>${esc(r.source)}<\u002Ftd>\n            <td class=\"r\">${esc(r.closedAt)}<\u002Ftd>\n            <td class=\"r\">${money(r.value)}<\u002Ftd>\n            <td class=\"r\">${money(r.paid || 0)}<\u002Ftd>\n            <td>${bal ? `<span class=\"pill amber\"><i><\u002Fi>${money(bal)} due<\u002Fspan>` : '<span class=\"pill green\"><i><\u002Fi>fully paid<\u002Fspan>'}<\u002Ftd>\n          <\u002Ftr>`; }).join('')}\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    ${timelinePanel(rows, 'won')}`;\n}\n\n/* ============================ payments on won deals ============================ */\n/* Receipts as entered on the BD desk; Admin reads them and the balance. */\nconst RECEIPTS = {\n  'Sunrise Supermart':      [['Advance', 150000, '12 Aug 2026', 'RTGS'], ['Part payment', 150000, '19 Aug 2026', 'NEFT']],\n  'Bharat Hardware Depot':  [['Advance', 60000, '25 Jul 2026', 'UPI'], ['Part payment', 60000, '08 Aug 2026', 'NEFT'], ['Balance', 52000, '20 Aug 2026', 'Cheque']],\n  'Coimbatore Steel Mart':  [['Advance', 250000, '28 Jul 2026', 'RTGS'], ['Part payment', 150000, '16 Aug 2026', 'RTGS']],\n};\nfunction buildReceipts() {\n  ROWS.filter(r => r.bdStage === 'won').forEach(r => {\n    if (r.rcpt) return;\n    r.rcpt = (RECEIPTS[r.customer] || []).map(([kind, amt, on, mode]) => ({ kind, amt, on, mode }));\n    if (!r.rcpt.length && r.paid) r.rcpt = [{ kind: 'Advance', amt: r.paid, on: r.closedAt, mode: 'NEFT' }];\n    r.paid = r.rcpt.reduce((t, x) => t + x.amt, 0);\n  });\n}\nconst payGot = r => (r.rcpt || []).reduce((t, x) => t + x.amt, 0);\nconst payDue = r => r.value - payGot(r);\nconst lastOn = r => (r.rcpt || []).length ? r.rcpt[r.rcpt.length - 1].on : '—';\nfunction payRows() {\n  let rows = ROWS.filter(r => r.bdStage === 'won');\n  if (payFilter === 'open') rows = rows.filter(r => payDue(r) > 0);\n  if (payFilter === 'clear') rows = rows.filter(r => payDue(r) <= 0);\n  return rows.sort((x, y) => payDue(y) - payDue(x));\n}\nfunction togglePay(id) { payOpen = payOpen === id ? null : id; renderPay(); }\n\nfunction renderPay() {\n  buildReceipts();\n  const all = ROWS.filter(r => r.bdStage === 'won');\n  const rows = payRows();\n  const contract = all.reduce((s, r) => s + r.value, 0);\n  const got = all.reduce((s, r) => s + payGot(r), 0);\n  const chip = (k, l, n) => `<button class=\"chip ${payFilter === k ? 'on' : ''}\" onclick=\"payFilter='${k}';renderPay()\">${l}<span class=\"n\">${n}<\u002Fspan><\u002Fbutton>`;\n\n  document.getElementById('v-pay').innerHTML = `\n    <div class=\"stat-strip\">\n      <div class=\"st\"><div class=\"l\">Contracted<\u002Fdiv><div class=\"v\">${money(contract)}<\u002Fdiv><div class=\"d\">${all.length} won deals<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Received<\u002Fdiv><div class=\"v\">${money(got)}<\u002Fdiv><div class=\"d\">${pct(got, contract)}% of contract<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Balance left<\u002Fdiv><div class=\"v\">${money(contract - got)}<\u002Fdiv><div class=\"d\">across ${all.filter(r => payDue(r) > 0).length} deals<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Fully paid<\u002Fdiv><div class=\"v\">${all.filter(r => payDue(r) <= 0).length}<\u002Fdiv><div class=\"d\">nothing left to collect<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"toolbar\">\n      ${chip('all', 'All', all.length)}\n      ${chip('open', 'Balance due', all.filter(r => payDue(r) > 0).length)}\n      ${chip('clear', 'Fully paid', all.filter(r => payDue(r) <= 0).length)}\n      <span class=\"lbl\" style=\"margin-left:auto\">Read-only<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"tbl-wrap\">\n      <table class=\"t\">\n        <thead><tr><th>Customer<\u002Fth><th>BDE<\u002Fth><th>Closed on<\u002Fth><th class=\"r\">Contract<\u002Fth><th class=\"r\">Received<\u002Fth><th class=\"r\">Balance<\u002Fth><th>Last payment<\u002Fth><th>Status<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>${rows.map(r => {\n          const g = payGot(r), d = payDue(r), open = payOpen === r.id, n = (r.rcpt || []).length;\n          return `<tr onclick=\"togglePay(${r.id})\" style=\"cursor:pointer\">\n            <td><div class=\"cust\">${esc(r.customer)}<\u002Fdiv><div class=\"sub\">${esc(r.place)}<\u002Fdiv><\u002Ftd>\n            <td>${avHtml(r.bde)}<\u002Ftd>\n            <td>${esc(r.closedAt)}<\u002Ftd>\n            <td class=\"r\">${money(r.value)}<\u002Ftd>\n            <td class=\"r\">${money(g)}<div class=\"sub\">${n} receipt${n === 1 ? '' : 's'}<\u002Fdiv><\u002Ftd>\n            <td class=\"r\">${d > 0 ? money(d) : '—'}<\u002Ftd>\n            <td>${esc(lastOn(r))}<\u002Ftd>\n            <td>${d <= 0 ? '<span class=\"pill green\"><i><\u002Fi>fully paid<\u002Fspan>' : `<span class=\"pill amber\"><i><\u002Fi>${pct(g, r.value)}% in<\u002Fspan>`}<\u002Ftd>\n          <\u002Ftr>\n          ${open ? `<tr class=\"payopen\"><td colspan=\"8\"><div class=\"paybody\">\n            <div class=\"mile\">${(r.rcpt || []).map(p => `<div class=\"mrow got\">\n              <span class=\"dotm\"><\u002Fspan>\n              <span class=\"k\">${esc(p.kind)}<\u002Fspan>\n              <span class=\"m\">${esc(p.on)} · ${esc(p.mode)}<\u002Fspan>\n              <span class=\"amt\">${money(p.amt)}<\u002Fspan>\n              <span><span class=\"pill green\"><i><\u002Fi>received<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>`).join('') || '<div class=\"empty\">No receipts recorded.<\u002Fdiv>'}\n              ${payDue(r) > 0 ? `<div class=\"mrow\">\n                <span class=\"dotm\"><\u002Fspan><span class=\"k\">Balance<\u002Fspan>\n                <span class=\"m\"><\u002Fspan>\n                <span class=\"amt\">${money(payDue(r))}<\u002Fspan><span><\u002Fspan>\n              <\u002Fdiv>` : ''}\n            <\u002Fdiv>\n          <\u002Fdiv><\u002Ftd><\u002Ftr>` : ''}`;\n        }).join('') || '<tr><td colspan=\"8\"><div class=\"empty\">Nothing in this slice.<\u002Fdiv><\u002Ftd><\u002Ftr>'}\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>`;\n}\n\n/* ============================ lost ============================ */\nfunction renderLost() {\n  const cre = ROWS.filter(r => r.lostBy === 'cre');\n  const bd = ROWS.filter(r => r.lostBy === 'bd');\n  const rows = lostSide === 'cre' ? cre : bd;\n  const reasons = lostSide === 'cre' ? CRE_LOST : BD_LOST;\n  const tone = ['var(--signal-red)', 'var(--signal-amber)', 'var(--signal-blue)', 'var(--signal-violet)', 'var(--steel-600)', 'var(--steel-600)'];\n  const lostVal = rows.reduce((s, r) => s + (r.value || r.est), 0);\n\n  document.getElementById('v-lost').innerHTML = `\n    <div class=\"toolbar\">\n      <div class=\"chips\">\n        <button class=\"chip ${lostSide === 'cre' ? 'on' : ''}\" onclick=\"lostSide='cre';render()\">Lost on the CRE desk<span class=\"n\">${cre.length}<\u002Fspan><\u002Fbutton>\n        <button class=\"chip ${lostSide === 'bd' ? 'on' : ''}\" onclick=\"lostSide='bd';render()\">Lost on the BD desk<span class=\"n\">
