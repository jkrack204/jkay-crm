${bd.length}<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat-strip\">\n      <div class=\"st\"><div class=\"l\">Lost records<\u002Fdiv><div class=\"v\">${rows.length}<\u002Fdiv><div class=\"d\">${lostSide === 'cre' ? 'never reached BD' : 'lost after hand-off'}<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Value walked away<\u002Fdiv><div class=\"v\">${money(lostVal)}<\u002Fdiv><div class=\"d\">${lostSide === 'cre' ? 'at CRE estimate' : 'at quoted value'}<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Top reason<\u002Fdiv><div class=\"v\" style=\"font-size:15.5px;line-height:1.4\">${esc(topReason(rows))}<\u002Fdiv><div class=\"d\">most frequent<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"col-2\">\n      <div class=\"panel\" style=\"overflow:hidden;min-width:0\">\n        <div class=\"panel__head\"><h3>${lostSide === 'cre' ? 'CRE lost' : 'BD lost'}<\u002Fh3><span class=\"count\">${rows.length} records<\u002Fspan><\u002Fdiv>\n        <div class=\"panel__body\" style=\"padding:0;overflow-x:auto\">\n          <table class=\"t\">\n            <thead><tr><th>Customer<\u002Fth><th>${lostSide === 'cre' ? 'CRE' : 'BDE'}<\u002Fth><th>Reason<\u002Fth><th>Lost on<\u002Fth><th class=\"r\">Value<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>${rows.map(r => `\n              <tr onclick=\"openRecord(${r.id})\" style=\"cursor:pointer\">\n                <td><div class=\"cust\">${esc(r.customer)}<\u002Fdiv><div class=\"sub\">${esc(r.place)} · ${esc(r.source)}<\u002Fdiv><\u002Ftd>\n                <td>${avHtml(lostSide === 'cre' ? r.cre : r.bde)}${lostSide === 'bd' ? `<div class=\"sub\">via ${esc(r.cre)}<\u002Fdiv>` : ''}<\u002Ftd>\n                <td><span class=\"pill red\"><i><\u002Fi>${esc(r.lostReason)}<\u002Fspan>${r.note ? `<div class=\"sub\">${esc(r.note)}<\u002Fdiv>` : ''}<\u002Ftd>\n                <td class=\"r\">${esc(r.lostAt)}<\u002Ftd>\n                <td class=\"r\">${money(r.value || r.est)}<\u002Ftd>\n              <\u002Ftr>`).join('')}\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flex-col gap-12\">\n        <div class=\"panel\">\n          <div class=\"panel__head\"><h3>Reason breakdown<\u002Fh3><span class=\"count\">${lostSide === 'cre' ? 'CRE reasons' : 'BD reasons'}<\u002Fspan><\u002Fdiv>\n          <div class=\"panel__body\">\n            ${reasons.map((rn, i) => {\n              const c = rows.filter(r => r.lostReason === rn).length;\n              const pct = rows.length ? Math.round(c / rows.length * 100) : 0;\n              return `<div class=\"bar\"><span>${esc(rn)}<\u002Fspan><div class=\"tr\"><div class=\"fi\" style=\"width:${pct}%;background:${tone[i % tone.length]}\"><\u002Fdiv><\u002Fdiv><span class=\"pc\">${pct}%<\u002Fspan><\u002Fdiv>`;\n            }).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"panel\">\n          <div class=\"panel__head\"><h3>By ${lostSide === 'cre' ? 'executive' : 'engineer'}<\u002Fh3><\u002Fdiv>\n          <div class=\"panel__body\">\n            ${(lostSide === 'cre' ? CRES : BDES).map(p => {\n              const c = rows.filter(r => (lostSide === 'cre' ? r.cre : r.bde) === p).length;\n              const pct = rows.length ? Math.round(c / rows.length * 100) : 0;\n              return `<div class=\"bar\" style=\"grid-template-columns:120px 1fr 40px\"><span>${esc(p)}<\u002Fspan><div class=\"tr\"><div class=\"fi\" style=\"width:${pct}%;background:var(--signal-amber)\"><\u002Fdiv><\u002Fdiv><span class=\"pc\">${c}<\u002Fspan><\u002Fdiv>`;\n            }).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"panel\">\n          <div class=\"panel__head\"><h3>By source<\u002Fh3><\u002Fdiv>\n          <div class=\"panel__body\">\n            ${SOURCES.map(s => {\n              const c = rows.filter(r => r.source === s).length;\n              if (!c) return '';\n              const pct = rows.length ? Math.round(c / rows.length * 100) : 0;\n              return `<div class=\"bar\" style=\"grid-template-columns:120px 1fr 40px\"><span>${esc(s)}<\u002Fspan><div class=\"tr\"><div class=\"fi\" style=\"width:${pct}%;background:var(--steel-600)\"><\u002Fdiv><\u002Fdiv><span class=\"pc\">${c}<\u002Fspan><\u002Fdiv>`;\n            }).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    ${timelinePanel(rows, 'lost')}`;\n}\nfunction topReason(rows) {\n  const c = {};\n  rows.forEach(r => c[r.lostReason] = (c[r.lostReason] || 0) + 1);\n  return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';\n}\n\n/* ============================ search ============================ */\nfunction runSearch() {\n  const q = document.getElementById('q').value.toLowerCase().trim();\n  const panel = document.getElementById('srch');\n  if (!q) { panel.style.display = 'none'; return; }\n  const hits = ROWS.filter(r => [r.customer, r.phone, r.place, r.source, r.cre, r.bde].join(' ').toLowerCase().includes(q));\n  panel.style.display = 'block';\n  document.getElementById('srch-n').textContent = hits.length + (hits.length === 1 ? ' match' : ' matches');\n  document.getElementById('srch-out').innerHTML = hits.slice(0, 12).map(r => `\n    <div class=\"sr\">\n      <div><span class=\"lbl2\">${esc(r.customer)}<\u002Fspan><div class=\"k\">${esc(r.phone)} · ${esc(r.place)} · ${esc(r.source)}<\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:right\">\n        <div class=\"k\">${r.lostBy ? 'Lost · ' + esc(r.lostReason) : r.bdStage ? esc(BD_STAGES[r.bdStage] || '') + ' · ' + esc(r.bde) : esc(CRE_STAGES[r.creStage] || '') + ' · ' + esc(r.cre)}<\u002Fdiv>\n        <div class=\"k\">${r.value || r.est ? money(r.value || r.est) : ''}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('') || '<div class=\"empty\">No matches<\u002Fdiv>';\n}\n\n/* ============================ record sheet ============================ */\nfunction openRecord(id) {\n  openId = id; fillSheet(id);\n  document.getElementById('sheet').classList.add('on');\n  document.getElementById('scrim').classList.add('on');\n}\nfunction closeSheet() {\n  openId = null;\n  document.getElementById('sheet').classList.remove('on');\n  document.getElementById('scrim').classList.remove('on');\n}\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });\n\nfunction smapRows(deskKey, curKey, lostReason) {\n  const flow = STAGE_DEFS[deskKey];\n  const labels = deskKey === 'cre' ? CRE_STAGES : BD_STAGES;\n  const idx = flow.findIndex(s => s.k === curKey);\n  let html = flow.map((s, i) => {\n    let cls;\n    if (lostReason) cls = 'soon';\n    else if (i < idx || (i === idx && s.k === 'won')) cls = 'done';\n    else if (i === idx) cls = 'now';\n    else cls = 'soon';\n    return `<div class=\"sm-row ${cls}\">\n      <div class=\"sm-dot\">${cls === 'done' ? '\\u2713' : i + 1}<\u002Fdiv>\n      <div><div class=\"sm-lab\">${esc(labels[s.k])}${cls === 'now' ? '<span class=\"sm-badge\">current<\u002Fspan>' : ''}<\u002Fdiv><div class=\"sm-def\">${esc(s.def)}<\u002Fdiv><\u002Fdiv>\n      <div class=\"sm-at\">${cls === 'done' ? 'done' : cls === 'now' ? 'here' : ''}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n  if (lostReason) html += `<div class=\"sm-row lost\">\n      <div class=\"sm-dot\">\\u2715<\u002Fdiv>\n      <div><div class=\"sm-lab\">Lost<span class=\"sm-badge\" style=\"color:var(--signal-red);background:color-mix(in srgb,var(--signal-red) 14%,transparent);border-color:var(--signal-red-dim)\">closed<\u002Fspan><\u002Fdiv><div class=\"sm-def\">${esc(lostReason)}<\u002Fdiv><\u002Fdiv>\n      <div class=\"sm-at\"><\u002Fdiv>\n    <\u002Fdiv>`;\n  return html;\n}\n\nfunction fillSheet(id) {\n  const r = ROWS.find(x => x.id === id); if (!r) return;\n  const bd = r.desk === 'bd';\n  const showMoney = bd && !!r.value;\n  const val = showMoney ? r.value : r.est;\n  const lostReason = r.lostBy ? r.lostReason : '';\n  document.getElementById('sheet').innerHTML = `\n    <div class=\"sheet__scroll\">\n      <div class=\"sheet__band\">\n        <div class=\"sheet-x\" onclick=\"closeSheet()\">\\u2715<\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px\">\n          <div>\n            <h2>${esc(r.customer)}<\u002Fh2>\n            <div class=\"w\">${esc(r.phone)} · ${esc(r.place)}<\u002Fdiv>\n            <div class=\"row\">\n              <span class=\"pill ${bd ? 'blue' : ''}\"><i><\u002Fi>${bd ? 'BD desk' : 'CRE desk'}<\u002Fspan>\n              <span class=\"pill\"><i><\u002Fi>${esc(r.source)}<\u002Fspan>\n              ${r.watch ? '<span class=\"pill amber\"><i><\u002Fi>Watching<\u002Fspan>' : ''}\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:right;font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text-strong);white-space:nowrap\">${val ? money(val) : '—'}<div style=\"font-size:11px;font-weight:400;color:var(--text-muted)\">${showMoney ? 'order value' : 'CRE estimate'}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sheet__body\" style=\"padding:0\">\n        <div class=\"sec\">\n          <div class=\"sec__h\"><h4>Ownership<\u002Fh4><\u002Fdiv>\n          <dl class=\"kv\">\n            <div><dt>CRE<\u002Fdt><dd>${esc(r.cre)}<\u002Fdd><\u002Fdiv>\n            <div><dt>BDE<\u002Fdt><dd>${r.bde ? esc(r.bde) : '—'}<\u002Fdd><\u002Fdiv>\n            <div><dt>Source<\u002Fdt><dd>${esc(r.source)}<\u002Fdd><\u002Fdiv>\n            <div><dt>Created<\u002Fdt><dd>${esc(r.created)}<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n        <div class=\"sec\">\n          <div class=\"sec__h\"><h4>Stage map<\u002Fh4><span class=\"aux\">where this ${bd ? 'deal' : 'lead'} sits<\u002Fspan><\u002Fdiv>\n          <div class=\"desk-hdr\">CRE desk<\u002Fdiv>\n          <div class=\"smap\">${smapRows('cre', r.creStage, r.lostBy === 'cre' ? lostReason : '')}<\u002Fdiv>\n          ${bd ? `<div class=\"desk-hdr\" style=\"margin-top:15px\">BD desk<\u002Fdiv><div class=\"smap\">${smapRows('bd', r.bdStage, r.lostBy === 'bd' ? lostReason : '')}<\u002Fdiv>` : ''}\n        <\u002Fdiv>\n        ${bd && !r.lostBy ? `<div class=\"sec\">\n          <div class=\"sec__h\"><h4>Admin — private<\u002Fh4><span class=\"aux\">not shown to the BDE<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px\">${r.adminTags.length ? r.adminTags.map(t => `<span class=\"pill adm ${ADMIN_TONE[t]}\"><i><\u002Fi>${esc(t)}<\u002Fspan>`).join('') : '<span class=\"muted\">No admin tag<\u002Fspan>'}<\u002Fdiv>\n          ${noteCount(r) || openNotes.has(r.id) ? notesBlock(r) : '<div class=\"muted\" style=\"font-size:12.5px\">No admin note yet.<\u002Fdiv>'}\n          <div style=\"display:flex;gap:6px;margin-top:11px\"><button class=\"btn btn-outline btn-sm\" onclick=\"toggleNotes(${r.id})\">${openNotes.has(r.id) ? 'Hide notes' : noteCount(r) ? 'Edit notes' : 'Add a sticky note'}<\u002Fbutton><button class=\"btn btn-outline btn-sm\" onclick=\"toggleWatch(${r.id})\">${r.watch ? 'Stop notifying' : 'Notify me'}<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>` : ''}\n        ${r.lostBy ? `<div class=\"sec\">\n          <div class=\"sec__h\"><h4>Lost<\u002Fh4><\u002Fdiv>\n          <dl class=\"kv\"><div><dt>Reason<\u002Fdt><dd><span class=\"pill red\"><i><\u002Fi>${esc(r.lostReason)}<\u002Fspan><\u002Fdd><\u002Fdiv><div><dt>Lost on<\u002Fdt><dd>${esc(r.lostAt)}<\u002Fdd><\u002Fdiv><div><dt>Desk<\u002Fdt><dd>${r.lostBy === 'cre' ? 'CRE desk' : 'BD desk'}<\u002Fdd><\u002Fdiv><\u002Fdl>\n        <\u002Fdiv>` : ''}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n/* ============================ settings ============================ */\nfunction renderSettings() {\n  const rail = [['int', 'Integrations'], ['emp', 'Employees'], ['tag', 'Tags'], ['stg', 'Stage definitions']];\n  const body = setTab === 'int' ? intBody() : setTab === 'emp' ? empBody() : setTab === 'tag' ? tagBody() : stgBody();\n  document.getElementById('v-settings').innerHTML = `\n    <div class=\"set-grid\">\n      <div class=\"set-rail\">\n        <div class=\"set-rail__g\">Settings<\u002Fdiv>\n        ${rail.map(([k, l]) => `<a class=\"${setTab === k ? 'on' : ''}\" onclick=\"setSetTab('${k}')\">${l}<\u002Fa>`).join('')}\n      <\u002Fdiv>\n      <div>${body}<\u002Fdiv>\n    <\u002Fdiv>`;\n}\nfunction setSetTab(t) { setTab = t; editingStage = null; renderSettings(); }\n\nfunction intBody() {\n  return `\n    <div class=\"stat-strip\" style=\"margin-bottom:14px\">\n      <div class=\"st\"><div class=\"l\">Connected<\u002Fdiv><div class=\"v\">${INTEGRATIONS.filter(i => i.live && i.key).length}<\u002Fdiv><div class=\"d\">pulling leads now<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Enabled<\u002Fdiv><div class=\"v\">${INTEGRATIONS.filter(i => i.live).length}<\u002Fdiv><div class=\"d\">of ${INTEGRATIONS.length} platforms<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Needs a key<\u002Fdiv><div class=\"v\">${INTEGRATIONS.filter(i => i.live && !i.key).length}<\u002Fdiv><div class=\"d\">enabled, not connected<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px\">${INTEGRATIONS.map(intCard).join('')}<\u002Fdiv>`;\n}\nfunction intCard(it) {\n  const [bg, fg] = INT_TONE[it.tone];\n  return `<div class=\"int ${it.live && it.key ? 'live' : ''}\">\n    <div class=\"int__top\">\n      <div class=\"int__mark\" style=\"background:${bg};color:${fg}\">${esc(it.mark)}<\u002Fdiv>\n      <div style=\"flex:1;min-width:0\"><div class=\"int__n\">${esc(it.name)}<\u002Fdiv><div class=\"int__d\">${esc(it.desc)}<\u002Fdiv><\u002Fdiv>\n      <div class=\"toggle ${it.live ? 'on' : ''}\" onclick=\"toggleInt('${it.k}')\"><\u002Fdiv>\n    <\u002Fdiv>\n    ${it.live ? `\n      <div class=\"keyrow\">\n        <input id=\"key-${it.k}\" type=\"text\" placeholder=\"Paste your ${esc(it.name)} API key\" value=\"${esc(it.key)}\">\n        <button class=\"btn btn-signal btn-sm\" onclick=\"saveKey('${it.k}')\">${it.key ? 'Update' : 'Connect'}<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"int__meta\">${it.key ? `<span style=\"color:var(--signal-green)\">\\u25cf Connected${it.at ? ' · ' + esc(it.at) : ''}<\u002Fspan><span>Syncs every 15 min<\u002Fspan>` : `<span style=\"color:var(--accent-hover)\">Enabled — waiting for API key<\u002Fspan>`}<\u002Fdiv>`\n    : `<div class=\"int__meta\"><span>Disabled — no leads pulled from ${esc(it.name)}<\u002Fspan><\u002Fdiv>`}\n  <\u002Fdiv>`;\n}\nfunction toggleInt(k) { const it = INTEGRATIONS.find(i => i.k === k); it.live = !it.live; renderSettings(); showToast(it.name + (it.live ? ' enabled' : ' disabled')); }\nfunction saveKey(k) {\n  const it = INTEGRATIONS.find(i => i.k === k);\n  const v = document.getElementById('key-' + k).value.trim();\n  if (!v) return showToast('Paste the API key first');\n  it.key = v; it.at = todayStr(); renderSettings(); showToast(it.name + ' connected');\n}\n\nfunction empBody() {\n  return `\n    <div class=\"toolbar\" style=\"margin-bottom:12px\">\n      <span class=\"lbl\">${EMPLOYEES.length} people · ${EMPLOYEES.filter(e => e.role === 'CRE').length} CRE · ${EMPLOYEES.filter(e => e.role === 'BDE').length} BDE<\u002Fspan>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <button class=\"btn btn-signal btn-sm\" onclick=\"openModal('m-emp')\">+ Add employee<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"tbl-wrap\"><table class=\"t\">\n      <thead><tr><th>Name<\u002Fth><th>Role<\u002Fth><th>Territory<\u002Fth><th>Phone<\u002Fth><th>Login email<\u002Fth><th>Status<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>${EMPLOYEES.map(e => `<tr>\n        <td>${avHtml(e.name)}<\u002Ftd>\n        <td><span class=\"pill ${e.role === 'CRE' ? 'blue' : e.role === 'BDE' ? 'amber' : e.role === 'Admin' ? 'violet' : ''}\"><i><\u002Fi>${esc(e.role)}<\u002Fspan><\u002Ftd>\n        <td>${esc(e.terr)}<\u002Ftd><td>${esc(e.phone)}<\u002Ftd><td>${esc(e.email)}<\u002Ftd>\n        <td>${e.active ? '<span class=\"pill green\"><i><\u002Fi>Active<\u002Fspan>' : '<span class=\"pill\"><i><\u002Fi>Disabled<\u002Fspan>'}<\u002Ftd>\n      <\u002Ftr>`).join('')}<\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>`;\n}\nfunction addEmp() {\n  const name = document.getElementById('e-name').value.trim();\n  if (!name) return showToast('Enter a name');\n  const role = document.getElementById('e-role').value;\n  EMPLOYEES.push({\n    name, role,\n    phone: document.getElementById('e-phone').value.trim() || '—',\n    terr: document.getElementById('e-terr').value.trim() || '—',\n    email: document.getElementById('e-mail').value.trim() || '—',\n    active: true,\n  });\n  if (role === 'CRE' && !CRES.includes(name)) CRES.push(name);\n  if (role === 'BDE' && !BDES.includes(name)) BDES.push(name);\n  ['e-name', 'e-phone', 'e-terr', 'e-mail'].forEach(id => document.getElementById(id).value = '');\n  closeModal('m-emp'); renderSettings(); showToast(name + ' added as ' + role);\n}\n\n/* ============================ add a lead by hand ============================ */\nlet leadRt = 'pool', leadTags = [];\nconst PRESET = { cust: 'Anjali Supermart', phone: '+91 98450 33127', place: 'Hosur, TN', src: 'Walk-in', est: '260000',\n  note: 'Owner walked into the Coimbatore showroom \\u2014 wants a quote inside the week.' };\n\nfunction openLead() {\n  document.getElementById('l-src').innerHTML = SOURCES.map(s => `<option>${esc(s)}<\u002Foption>`).join('');\n  leadRt = 'pool'; leadTags = [];\n  leadPreset('pre');\n  openModal('m-lead');\n}\nfunction leadPreset(m) {\n  const v = m === 'pre' ? PRESET : { cust: '', phone: '', place: '', src: SOURCES[0], est: '', note: '' };\n  document.getElementById('l-cust').value = v.cust;\n  document.getElementById('l-phone').value = v.phone;\n  document.getElementById('l-place').value = v.place;\n  document.getElementById('l-src').value = v.src;\n  document.getElementById('l-est').value = v.est;\n  document.getElementById('l-note').value = v.note;\n  document.getElementById('lm-pre').classList.toggle('on', m === 'pre');\n  document.getElementById('lm-blank').classList.toggle('on', m !== 'pre');\n  leadRoute(m === 'pre' ? 'cre' : 'pool');\n}\nfunction leadRoute(r) {\n  leadRt = r;\n  document.querySelectorAll('#l-route .chip').forEach(b => b.classList.toggle('on', b.dataset.r === r));\n  const who = document.getElementById('l-who'), stage = document.getElementById('l-stage');\n  const assign = document.getElementById('l-assign');\n  assign.style.display = r === 'pool' ? 'none' : 'grid';\n  if (r !== 'pool') {\n    const people = r === 'cre' ? CRES : BDES;\n    document.getElementById('l-who-l').textContent = r === 'cre' ? 'CRE who owns it' : 'BDE who closes it';\n    who.innerHTML = people.map(p => `<option>${esc(p)}<\u002Foption>`).join('');\n    const st = r === 'cre'\n      ? ['new', 'follop', 'photos'].map(k => [k, CRE_STAGES[k]])\n      : Object.entries(BD_STAGES).filter(([k]) => k !== 'won');\n    stage.innerHTML = st.map(([k, l]) => `<option value=\"${k}\">${esc(l)}<\u002Foption>`).join('');\n  }\n  document.getElementById('l-hint').textContent = r === 'pool'\n    ? 'It lands in the shared pool \\u2014 the first CRE to claim it owns it. Nobody is notified by name.'\n    : r === 'cre'\n      ? 'It appears on that CRE\\u2019s desk as a claimed lead \\u2014 they see it immediately, and the hand-off to BD still runs the normal way.'\n      : 'Skips the CRE desk. Recorded as qualified by you, so the funnel counts it as an admin hand-off, not a CRE one.';\n  leadTagPick();\n}\nfunction leadTagPick() {\n  document.getElementById('l-tags').innerHTML = ADMIN_TAGS.map(t =>\n    `<button class=\"${leadTags.includes(t) ? 'on' : ''}\" style=\"${leadTags.includes(t) ? 'background:var(--accent-tint);color:var(--accent-hover);border-color:var(--signal-amber-dim)' : ''}\" onclick=\"leadTagTog('${t}')\">${leadTags.includes(t) ? '\\u2713 ' : '+ '}${esc(t)}<\u002Fbutton>`).join('');\n}\nfunction leadTagTog(t) {\n  leadTags = leadTags.includes(t) ? leadTags.filter(x => x !== t) : leadTags.concat(t);\n  leadTagPick();\n}\nfunction addLead() {\n  const cust = document.getElementById('l-cust').value.trim();\n  if (!cust) return showToast('Give the lead a customer name');\n  const est = Number(String(document.getElementById('l-est').value).replace(/[^\\d]/g, '')) || 0;\n  const who = leadRt === 'pool' ? CRES[0] : document.getElementById('l-who').value;\n  const stage = leadRt === 'pool' ? 'pool' : document.getElementById('l-stage').value;\n  const r = L({\n    customer: cust,\n    phone: document.getElementById('l-phone').value.trim() || '\\u2014',\n    place: document.getElementById('l-place').value.trim() || '\\u2014',\n    source: document.getElementById('l-src').value,\n    created: todayStr() + ', ' + new Date().toTimeString().slice(0, 5),\n    desk: leadRt === 'bd' ? 'bd' : 'cre',\n    cre: leadRt === 'bd' ? 'Added by Admin' : who,\n    bde: leadRt === 'bd' ? who : null,\n    creStage: leadRt === 'bd' ? 'qualified' : stage,\n    bdStage: leadRt === 'bd' ? stage : null,\n    est, adminTags: leadTags.slice(),\n  });\n  const ln = document.getElementById('l-note').value.trim();\n  if (ln) { r.notes = [{ text: ln, color: NOTE_PAPER[0], at: nStamp(), pinned: true }]; r.note = ln; }\n  ROWS.push(r);\n  RANK.push(r.id);\n  NOTIFS.unshift({ id: Date.now(), t: 'lead', day: 'Today', when: new Date().toTimeString().slice(0, 5), unread: true, lead: cust,\n    tx: `<b>${esc(cust)}<\u002Fb> added by hand`, mt: leadRt === 'pool' ? r.source + ' \\u00b7 sitting in the unclaimed pool' : r.source + ' \\u00b7 assigned to ' + who });\n  closeModal('m-lead');\n  syncTags(); renderNotifs(); render();\n  showToast(cust + (leadRt === 'pool' ? ' added to the unclaimed pool' : ' assigned to ' + who));\n  openRecord(r.id);\n}\n\nfunction tagUse(k, name) {\n  if (k === 'cre') return ROWS.filter(r => r.creTag === name).length;\n  if (k === 'admin') return ROWS.filter(r => r.adminTags.includes(name)).length;\n  if (k === 'creLost') return ROWS.filter(r => r.lostBy === 'cre' && r.lostReason === name).length;\n  if (k === 'bdLost') return ROWS.filter(r => r.lostBy === 'bd' && r.lostReason === name).length;\n  return 0;\n}\nfunction toneSwatch(t) {\n  const m = { neutral: ['var(--steel-850)', 'var(--steel-700)'], green: ['color-mix(in srgb,var(--signal-green) 40%,transparent)', 'var(--signal-green)'],\n    amber: ['var(--accent-tint)', 'var(--signal-amber)'], red: ['color-mix(in srgb,var(--signal-red) 35%,transparent)', 'var(--signal-red)'],\n    blue: ['color-mix(in srgb,var(--signal-blue) 35%,transparent)', 'var(--signal-blue)'], violet: ['color-mix(in srgb,var(--signal-violet) 35%,transparent)', 'var(--signal-violet)'] };\n  return m[t] || m.neutral;\n}\nfunction tagBody() {\n  const total = TAG_GROUPS.reduce((s, g) => s + TAGS[g.k].length, 0);\n  return `\n    <div class=\"pipe-hint\"><span>◆<\u002Fspan>Every tag a CRE or a BDE can put on a lead or a deal is created here. Nobody else can invent one — the desks only pick from these lists.<\u002Fdiv>\n    <div class=\"stat-strip\" style=\"margin-bottom:14px\">\n      <div class=\"st\"><div class=\"l\">Tags defined<\u002Fdiv><div class=\"v\">${total}<\u002Fdiv><div class=\"d\">across ${TAG_GROUPS.length} lists<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Desk tags<\u002Fdiv><div class=\"v\">${TAGS.cre.length + TAGS.bd.length}<\u002Fdiv><div class=\"d\">CRE and BD can apply<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Lost reasons<\u002Fdiv><div class=\"v\">${TAGS.creLost.length + TAGS.bdLost.length}<\u002Fdiv><div class=\"d\">forced choice on close<\u002Fdiv><\u002Fdiv>\n      <div class=\"st\"><div class=\"l\">Admin-only<\u002Fdiv><div class=\"v\">${TAGS.admin.length}<\u002Fdiv><div class=\"d\">private to you<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    ${TAG_GROUPS.map(g => `<div class=\"panel\" style=\"margin-bottom:13px\">\n      <div class=\"panel__head\"><h3>${g.title}<\u002Fh3><span class=\"count\">${TAGS[g.k].length} tags · ${esc(g.who)}<\u002Fspan><\u002Fdiv>\n      <div class=\"panel__body\">\n        <div class=\"set-row__t\" style=\"margin-bottom:6px\"><div class=\"d\" style=\"font-size:12px;color:var(--text-muted);line-height:1.5\">${g.desc}<\u002Fdiv><\u002Fdiv>\n        ${TAGS[g.k].map((t, i) => {\n          const use = tagUse(g.k, t.n);\n          return `<div class=\"tg-row\">\n            <span class=\"pill ${t.tone === 'neutral' ? '' : t.tone} ${g.k === 'admin' ? 'adm' : ''}\"><i><\u002Fi>${esc(t.n)}<\u002Fspan>\n            <span class=\"used\">${use ? use + ' in use' : 'unused'}<\u002Fspan>\n            <div class=\"tones\">${TONES.map(tn => { const [bg, bd] = toneSwatch(tn);\n              return `<button class=\"${t.tone === tn ? 'on' : ''}\" style=\"background:${bg};border-color:${bd}\" title=\"${tn}\" onclick=\"tagTone('${g.k}',${i},'${tn}')\"><\u002Fbutton>`; }).join('')}<\u002Fdiv>\n            <button class=\"tg-del\" title=\"${use ? 'In use — removing keeps existing records' : 'Delete tag'}\" onclick=\"tagDel('${g.k}',${i})\">✕<\u002Fbutton>\n          <\u002Fdiv>`;\n        }).join('')}\n        <div class=\"newrow\">\n          <input class=\"n\" id=\"tg-new-${g.k}\" placeholder=\"New tag name\" onkeydown=\"if(event.key==='Enter')tagAdd('${g.k}')\">\n          <select class=\"sel\" id=\"tg-tone-${g.k}\">${TONES.map(tn => `<option value=\"${tn}\">${tn}<\u002Foption>`).join('')}<\u002Fselect>\n          <button class=\"btn btn-signal btn-sm\" onclick=\"tagAdd('${g.k}')\">Add tag<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('')}`;\n}\nfunction tagAdd(k) {\n  const el = document.getElementById('tg-new-' + k);\n  const n = el.value.trim();\n  if (!n) return showToast('Type a tag name first');\n  if (TAGS[k].some(t => t.n.toLowerCase() === n.toLowerCase())) return showToast('That tag already exists');\n  TAGS[k].push({ n, tone: document.getElementById('tg-tone-' + k).value });\n  syncTags(); renderSettings(); showToast('“' + n + '” added — the desks can use it now');\n}\nfunction tagTone(k, i, tone) { TAGS[k][i].tone = tone; syncTags(); renderSettings(); }\nfunction tagDel(k, i) {\n  const t = TAGS[k][i];\n  TAGS[k].splice(i, 1);\n  syncTags();\n  if (pipeTag === t.n) pipeTag = 'all';\n  renderSettings(); showToast('“' + t.n + '” removed from the list');\n}\n\nfunction stgBody() {\n  return `\n    <div class=\"pipe-hint\"><span>\\u25c6<\u002Fspan>These are the stages every desk works to. Renaming a stage or its definition updates it for all CREs and BDEs.<\u002Fdiv>\n    ${stgPanel('cre', 'CRE desk — lead stages', CRE_STAGES)}\n    ${stgPanel('bd', 'BD desk — deal stages', BD_STAGES)}`;\n}\nfunction stgPanel(desk, title, labels) {\n  return `<div class=\"panel\" style=\"margin-bottom:13px\">\n    <div class=\"panel__head\"><h3>${title}<\u002Fh3><span class=\"count\">${STAGE_DEFS[desk].length} stages<\u002Fspan><\u002Fdiv>\n    <div class=\"panel__body\">\n      ${STAGE_DEFS[desk].map((s, i) => {\n        if (editingStage === desk + ':' + s.k) return `<div class=\"sd-row\"><div class=\"num\">${i + 1}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <input class=\"set-ctl\" id=\"sd-nm\" value=\"${esc(labels[s.k])}\" style=\"width:100%\">\n            <textarea class=\"set-ctl\" id=\"sd-df\" rows=\"2\" style=\"width:100%;resize:vertical\">${esc(s.def)}<\u002Ftextarea>\n          <\u002Fdiv>\n          <div class=\"ac\"><button class=\"btn btn-signal btn-sm\" onclick=\"saveStage('${desk}','${s.k}')\">Save<\u002Fbutton><button class=\"btn btn-outline btn-sm\" onclick=\"editingStage=null;renderSettings()\">Cancel<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>`;\n        return `<div class=\"sd-row\"><div class=\"num\">${i + 1}<\u002Fdiv>\n          <div><div class=\"nm\">${esc(labels[s.k])}<\u002Fdiv><div class=\"df\">${esc(s.def)}<\u002Fdiv><\u002Fdiv>\n          <div class=\"ac\"><button class=\"btn btn-outline btn-sm\" onclick=\"editStage('${desk}','${s.k}')\">Edit<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>`;\n      }).join('')}\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction editStage(desk, k) { editingStage = desk + ':' + k; renderSettings(); }\nfunction saveStage(desk, k) {\n  const labels = desk === 'cre' ? CRE_STAGES : BD_STAGES;\n  const nm = document.getElementById('sd-nm').value.trim();\n  const df = document.getElementById('sd-df').value.trim();\n  if (nm) labels[k] = nm;\n  const s = STAGE_DEFS[desk].find(x => x.k === k); if (df) s.def = df;\n  editingStage = null; renderSettings(); showToast('Stage updated');\n}\n\n/* ============================ notifications ============================ */\nlet notifOpen = false, notifTab = 'all';\nconst N_TONE = {\n  won:   ['color-mix(in srgb,var(--signal-green) 16%,transparent)', 'var(--signal-green)'],\n  lost:  ['color-mix(in srgb,var(--signal-red) 16%,transparent)', 'var(--signal-red)'],\n  move:  ['color-mix(in srgb,var(--signal-blue) 16%,transparent)', 'var(--signal-blue)'],\n  lead:  ['var(--accent-tint)', 'var(--accent-hover)'],\n  idle:  ['color-mix(in srgb,var(--signal-violet) 16%,transparent)', 'var(--signal-violet)'],\n  sys:   ['var(--steel-850)', 'var(--text-muted)'],\n};\nconst leadId = name => (ROWS.find(r => r.customer === name) || {}).id || null;\nconst NOTIFS = [\n  { id: 1, t: 'move', day: 'Today', when: '10:42', unread: true, watch: true, lead: 'Matheswaran',\n    tx: '<b>Matheswaran<\u002Fb> moved to Negotiation', mt: 'Syed Ahmed · ₹5,00,000 · you are watching this deal' },\n  { id: 2, t: 'lead', day: 'Today', when: '10:40', unread: true, lead: 'Sri Balaji Mart',\n    tx: '3 new leads landed — latest <b>Sri Balaji Mart<\u002Fb>', mt: 'IndiaMART · assigned to Priya R.' },\n  { id: 3, t: 'idle', day: 'Today', when: '09:15', unread: true, lead: 'City Mart Chain',\n    tx: '<b>City Mart Chain<\u002Fb> has had no contact for 6 days', mt: 'Fatima Q. · Call Not Attend - 2' },\n  { id: 4, t: 'move', day: 'Today', when: '09:02', unread: true, watch: true, lead: 'Om Sai Warehousing',\n    tx: '<b>Om Sai Warehousing<\u002Fb> layout shared with the customer', mt: 'Sana Kapoor · ₹6,10,000 · you are watching this deal' },\n  { id: 5, t: 'lead', day: 'Today', when: '08:30', unread: false, lead: 'Rakesh Traders',\n    tx: '<b>Rakesh Traders<\u002Fb> is still unclaimed after 24 hours', mt: 'Justdial · nobody has picked it up' },\n  { id: 6, t: 'won', day: 'Yesterday', when: '17:20', unread: false, lead: 'Sunrise Supermart',\n    tx: '<b>Sunrise Supermart<\u002Fb> won — advance received', mt: 'Sana Kapoor · ₹4,80,000 · ₹1,80,000 still due' },\n  { id: 7, t: 'lost', day: 'Yesterday', when: '15:05', unread: false, lead: 'Deccan Cold Storage',\n    tx: '<b>Deccan Cold Storage<\u002Fb> lost on price', mt: 'Syed Ahmed · ₹7,20,000 walked away' },\n  { id: 8, t: 'move', day: 'Yesterday', when: '11:48', unread: false, watch: true, lead: 'Krishna Superstore',\n    tx: '<b>Krishna Superstore<\u002Fb> is awaiting the advance', mt: 'Rohan Desai · terms agreed 3 days ago' },\n  { id: 9, t: 'sys', day: 'Yesterday', when: '09:00', unread: false, view: 'settings',\n    tx: 'Google Ads is enabled but has no API key', mt: 'no leads are being pulled — open Integrations' },\n  { id: 10, t: 'lost', day: 'Earlier', when: '21 Aug', unread: false, lead: 'Meenakshi Stores',\n    tx: '<b>Meenakshi Stores<\u002Fb> marked lost by Priya R.', mt: \"Don't pick the call · CRE desk\" },\n];\nconst nIcon = { won: '✓', lost: '✕', move: '→', lead: '+', idle: '!', sys: '◈' };\nconst unreadN = () => NOTIFS.filter(n => n.unread).length;\n\nfunction notifRows() {\n  if (notifTab === 'unread') return NOTIFS.filter(n => n.unread);\n  if (notifTab === 'watch') return NOTIFS.filter(n => n.watch);\n  return NOTIFS;\n}\nfunction renderNotifs() {\n  const u = unreadN();\n  const bdg = document.getElementById('n-bdg');\n  bdg.textContent = u; bdg.style.display = u ? 'block' : 'none';\n  document.getElementById('bell').classList.toggle('on', notifOpen);\n  const p = document.getElementById('npanel');\n  p.classList.toggle('on', notifOpen);\n  if (!notifOpen) return;\n  const rows = notifRows();\n  const days = [...new Set(rows.map(n => n.day))];\n  const tab = (k, l, c) => `<button class=\"chip ${notifTab === k ? 'on' : ''}\" onclick=\"notifTab='${k}';renderNotifs()\">${l}<span class=\"n\">${c}<\u002Fspan><\u002Fbutton>`;\n  p.innerHTML = `\n    <div class=\"np-head\">\n      <h4>Notifications<\u002Fh4>\n      ${u ? `<span class=\"lnk\" onclick=\"markAllRead()\">Mark all read<\u002Fspan>` : '<span class=\"lnk\" style=\"color:var(--text-muted);cursor:default\">All read<\u002Fspan>'}\n    <\u002Fdiv>\n    <div class=\"np-tabs\">${tab('all', 'All', NOTIFS.length)}${tab('unread', 'Unread', u)}${tab('watch', 'Watching', NOTIFS.filter(n => n.watch).length)}<\u002Fdiv>\n    <div class=\"np-list\">\n      ${days.map(d => `<div class=\"np-day\">${d}<\u002Fdiv>${rows.filter(n => n.day === d).map(n => {\n        const [bg, fg] = N_TONE[n.t];\n        return `<div class=\"nrow ${n.unread ? 'unread' : ''}\" onclick=\"openNotif(${n.id})\">\n          <div class=\"ic\" style=\"background:${bg};color:${fg}\">${nIcon[n.t]}<\u002Fdiv>\n          <div><div class=\"tx\">${n.tx}<\u002Fdiv><div class=\"mt\"><span>${esc(n.mt)}<\u002Fspan><span>· ${esc(n.when)}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>`;\n      }).join('')}`).join('') || '<div class=\"empty\">Nothing here.<\u002Fdiv>'}\n    <\u002Fdiv>\n    <div class=\"np-foot\">You are notified on every move on the ${ROWS.filter(r => r.watch).length} deals you watch.<\u002Fdiv>`;\n}\nfunction toggleNotifs(e) {\n  if (e) e.stopPropagation();\n  notifOpen = !notifOpen; renderNotifs();\n}\nfunction markAllRead() { NOTIFS.forEach(n => n.unread = false); renderNotifs(); showToast('All notifications marked read'); }\nfunction openNotif(id) {\n  const n = NOTIFS.find(x => x.id === id); if (!n) return;\n  n.unread = false;\n  notifOpen = false; renderNotifs();\n  if (n.view) { go(n.view); return; }\n  const lid = leadId(n.lead);\n  if (lid) openRecord(lid); else render();\n}\ndocument.addEventListener('click', () => { if (notifOpen) { notifOpen = false; renderNotifs(); } });\n\n/* ============================ boot ============================ */\nfunction render() {\n  if (view === 'dash') renderDash();\n  if (view === 'cre') renderCre();\n  if (view === 'bde') renderBde();\n  if (view === 'pipe') renderPipe();\n  if (view === 'closed') renderClosed();\n  if (view === 'pay') renderPay();\n  if (view === 'lost') renderLost();\n  if (view === 'settings') renderSettings();\n  if (openId != null && document.getElementById('sheet').classList.contains('on')) fillSheet(openId);\n}\nbuildNav();\nsyncTags();\nmigrateNotes();\nbuildReceipts();\ngo('dash');\nrenderNotifs();\nwindow.onThemeChange = () => render();\nif (window.paintThemeSwitch) paintThemeSwitch();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
