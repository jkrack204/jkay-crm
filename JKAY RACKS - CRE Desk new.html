d('notif-list').innerHTML = NOTIFS.length ? NOTIFS.map(n => {\n    const k = N_KIND[n.kind] || N_KIND.pool;\n    return `<div class=\"nitem ${n.read ? '' : 'unread'}\" onclick=\"openNotif(${n.id})\">\n      <span class=\"ico\" style=\"background:${k.bg};color:${k.fg}\">${k.ico}<\u002Fspan>\n      <div>\n        <div class=\"t\">${n.t}<\u002Fdiv>\n        <div class=\"m\">${n.lead ? '<b style=\"color:var(--text-secondary);font-weight:600\">' + n.lead + '<\u002Fb> · ' : ''}${n.m}<\u002Fdiv>\n        <div class=\"at\">${n.at}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('') : '<div style=\"padding:20px 14px;font-size:13px;color:var(--text-muted)\">Nothing to catch up on.<\u002Fdiv>';\n}\nfunction toggleNotif(e) {\n  e?.stopPropagation();\n  const on = document.getElementById('notif').classList.toggle('on');\n  document.getElementById('bell').classList.toggle('on', on);\n}\nfunction closeNotif() {\n  document.getElementById('notif').classList.remove('on');\n  document.getElementById('bell').classList.remove('on');\n}\nfunction markAllRead(e) {\n  e?.stopPropagation();\n  NOTIFS.forEach(n => n.read = true);\n  renderNotifs();\n  showToast('All notifications marked read');\n}\nfunction openNotif(id) {\n  const n = NOTIFS.find(x => x.id === id); if (!n) return;\n  n.read = true;\n  renderNotifs(); closeNotif();\n  if (!n.lead) { go('pool'); return; }\n  const lead = LEADS.find(l => l.name === n.lead);\n  if (!lead) { showToast('That lead is no longer in your lists'); return; }\n  go(lead.stage === 'unassigned' ? 'pool' : lead.stage);\n  pickById(lead.id);\n}\ndocument.addEventListener('click', (e) => {\n  if (!e.target.closest('.notif-wrap')) closeNotif();\n});\n\n/* ============================ dashboard ============================ */\nconst WEEK = { claimed: [2, 3, 1, 4, 2, 3, 4], calls: [6, 9, 7, 11, 8, 12, 11], handed: [0, 1, 0, 1, 1, 0, 2], lost: [1, 0, 1, 0, 2, 1, 1] };\n\nfunction spark(points, color) {\n  const w = 62, hh = 20, max = Math.max(...points), min = Math.min(...points), span = max - min || 1;\n  const pts = points.map((p, i) => `${(i / (points.length - 1) * w).toFixed(1)},${(hh - ((p - min) / span) * (hh - 4) - 2).toFixed(1)}`).join(' ');\n  return `<svg width=\"${w}\" height=\"${hh}\" viewBox=\"0 0 ${w} ${hh}\" aria-hidden=\"true\"><polyline points=\"${pts}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"1.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><\u002Fsvg>`;\n}\nfunction bars(points, color) {\n  const w = 62, hh = 20, n = points.length, bw = (w - (n - 1) * 2) / n, max = Math.max(...points) || 1;\n  return `<svg width=\"${w}\" height=\"${hh}\" viewBox=\"0 0 ${w} ${hh}\" aria-hidden=\"true\">${points.map((p, i) => {\n    const bh = Math.max(1.5, (p / max) * (hh - 2));\n    return `<rect x=\"${(i * (bw + 2)).toFixed(1)}\" y=\"${(hh - bh).toFixed(1)}\" width=\"${bw.toFixed(1)}\" height=\"${bh.toFixed(1)}\" rx=\"1\" fill=\"${color}\" opacity=\"${i === n - 1 ? 1 : .4}\"/>`;\n  }).join('')}<\u002Fsvg>`;\n}\nfunction breakdown(pairs, color) {\n  const total = pairs.reduce((a, [, n]) => a + n, 0) || 1;\n  if (!pairs.some(([, n]) => n)) return '<div class=\"dash-empty\">Nothing recorded yet.<\u002Fdiv>';\n  return '<div class=\"brk\">' + pairs.filter(([, n]) => n).sort((a, b) => b[1] - a[1]).map(([k, n]) =>\n    `<div class=\"brk-row\"><span>${k}<\u002Fspan><span class=\"n\">${n}<\u002Fspan>\n      <span class=\"bar\"><div style=\"width:${(n / total * 100).toFixed(1)}%;background:${color}\"><\u002Fdiv><\u002Fspan><\u002Fdiv>`).join('') + '<\u002Fdiv>';\n}\n\nconst dashInk = () => {\n  const dark = document.documentElement.getAttribute('data-theme') === 'dark';\n  return dark\n    ? { grey: '#8b857c', clay: '#c4855a', clayLt: '#d9a577', gold: '#d7b45f', green: '#74b189', blue: '#86a5d2', red: '#d9827a' }\n    : { grey: '#8d887f', clay: '#9c6644', clayLt: '#c08a5a', gold: '#c9a227', green: '#3f7d52', blue: '#40628f', red: '#b0453c' };\n};\n\nfunction renderDash() {\n  const ink = dashInk();\n  const mineAll = LEADS.filter(l => inScope(l, 'mine'));\n  const bd = LEADS.filter(l => l.stage === 'bd');\n  const lost = LEADS.filter(l => l.stage === 'lost');\n  const pool = LEADS.filter(l => l.stage === 'unassigned');\n  const worked = mineAll.length + bd.length + lost.length;\n  const convRate = worked ? Math.round(bd.length / worked * 100) : 0;\n\n  const kpis = [\n    { lab: 'Unclaimed pool', val: pool.length, delta: 'first come, first served', g: bars([8, 7, 9, 6, 7, 5, pool.length], ink.grey) },\n    { lab: 'My leads', val: mineAll.length, delta: countSub('new') + ' not yet worked', g: bars(WEEK.claimed, ink.clay) },\n    { lab: 'Follops due today', val: dueToday(), delta: dueToday() ? 'act before end of day' : 'nothing pressing', cls: dueToday() ? 'warn' : '', g: spark(WEEK.calls, ink.blue) },\n    { lab: 'Handed to BD', val: bd.length, delta: 'read-only after hand-off', cls: 'up', g: bars(WEEK.handed, ink.green) },\n    { lab: 'Lost', val: lost.length, delta: 'reason on every record', g: spark(WEEK.lost, ink.red) },\n    { lab: 'Hand-off rate', val: convRate + '%', delta: bd.length + ' of ' + worked + ' worked', cls: 'up', g: spark([12, 14, 13, 17, 16, 19, convRate], ink.green) },\n  ];\n\n  const steps = [\n    ['Unclaimed pool', pool.length, ink.grey],\n    ['Claimed by me', worked, ink.clay],\n    ['In follop', mineAll.filter(l => l.sub === 'follop').length, ink.clayLt],\n    ['Waiting for photos', mineAll.filter(l => l.sub === 'photos').length, ink.gold],\n    ['Handed to BD', bd.length, ink.green],\n  ];\n  const fmax = Math.max(...steps.map(s => s[1]), 1);\n\n  const due = mineAll.filter(l => l.followAt).sort((a, b) => (a.followAt > b.followAt ? 1 : -1));\n\n  document.getElementById('dash').innerHTML = `\n    <section>\n      <h2>This week<\u002Fh2>\n      <div class=\"kpis\">${kpis.map(k => `\n        <div class=\"kpi\">\n          <div class=\"lab\">${k.lab}<\u002Fdiv>\n          <div class=\"row\"><span class=\"val\">${k.val}<\u002Fspan>${k.g}<\u002Fdiv>\n          <div class=\"delta ${k.cls || ''}\">${k.delta}<\u002Fdiv>\n        <\u002Fdiv>`).join('')}<\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"dgrid\">\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Where my leads sit<\u002Fh3><span class=\"aux\">${worked} claimed in total<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">\n          <div class=\"funnel\">${steps.map(([t, n, c]) => `\n            <div class=\"fstep\">\n              <span class=\"t\">${t}<\u002Fspan>\n              <span class=\"track\"><span class=\"fill\" style=\"width:${(n / fmax * 100).toFixed(1)}%;background:${c}\"><\u002Fspan><\u002Fspan>\n              <span class=\"n\">${n}<\u002Fspan>\n            <\u002Fdiv>`).join('')}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Follops coming up<\u002Fh3><span class=\"aux\">${due.length} scheduled<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">\n          ${due.length ? `<div class=\"duelist\">${due.slice(0, 6).map(l => `\n            <div class=\"due-item\" onclick=\"go('mine');pickById(${l.id})\">\n              <div><div class=\"dn\">${l.name}<\u002Fdiv><div class=\"dm\">${l.tag || SUBS[l.sub || 'new'].label} · ${l.place}<\u002Fdiv><\u002Fdiv>\n              <div class=\"dt ${isHot(l) ? 'hot' : ''}\">${l.followAt.replace(' 2026', '')}<\u002Fdiv>\n            <\u002Fdiv>`).join('')}<\u002Fdiv>` : '<div class=\"dash-empty\">No follops scheduled — add one from a lead.<\u002Fdiv>'}\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"dgrid\">\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Where my leads came from<\u002Fh3><span class=\"aux\">by platform<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">${breakdown(PLATFORMS.map(p => [p, LEADS.filter(l => l.platform === p && l.stage !== 'unassigned').length]), ink.clay)}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Why leads were lost<\u002Fh3><span class=\"aux\">${lost.length} closed<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">${breakdown(LOST_REASONS.map(r => [r, lost.filter(l => l.lostReason === r).length]), ink.red)}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"dgrid\">\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>Follop categories<\u002Fh3><span class=\"aux\">my open follops<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">${breakdown(FOLLOP_TAGS.map(t => [t, mineAll.filter(l => l.tag === t).length]), ink.clayLt)}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>My tags<\u002Fh3><span class=\"aux\">across my leads<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">${breakdown(MY_TAGS.map(t => [t, mineAll.filter(l => (l.tags || []).includes(t)).length]), ink.clay)}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"card__head\"><h3>With BD<\u002Fh3><span class=\"aux\">read-only<\u002Fspan><\u002Fdiv>\n        <div class=\"card__body\">${breakdown(BD_STAGES.map(s => [s, bd.filter(l => l.bdStage === s).length]), ink.green)}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>`;\n}\n\n/* ============================ stage chrome ============================ */\nfunction renderStagebar() {\n  const s = STAGES[scope];\n  const extra = scope === 'mine' && sub !== 'all' ? ' · ' + SUBS[sub].note : '';\n  document.getElementById('stagebar').innerHTML =\n    `<span class=\"sn\">${scope === 'mine' && sub !== 'all' ? SUBS[sub].label : s.label}<\u002Fspan>\n     <span class=\"sd\">${s.crumb}${extra}<\u002Fspan>\n     <span class=\"rule\"><span class=\"lk\"><\u002Fspan>${STAGE_RULE[scope]}<\u002Fspan>`;\n}\n\nfunction filterListFor(s) {\n  if (s === 'mine') {\n    if (sub === 'follop') return FOLLOP_TAGS;\n    if (sub === 'photos') return PHOTO_TAGS;\n    const used = MY_TAGS.filter(t => LEADS.some(l => inScope(l, 'mine') && (l.tags || []).includes(t)));\n    return used.length ? used : null;\n  }\n  if (s === 'bd') return BD_STAGES;\n  if (s === 'lost') return LOST_REASONS;\n  return null;\n}\nfunction setSub(k) {\n  sub = k; tagFilter = null; sel = null; cursor = 0; closeLead();\n  document.querySelectorAll('#seg-sub button').forEach(b => b.classList.toggle('on', b.dataset.sub === k));\n  document.querySelectorAll('#g-mine .nav-pop__item').forEach(a =>\n    a.classList.toggle('on', a.dataset.key === (k === 'all' ? 'mine' : k)));\n  renderStagebar(); renderTagFilter(); renderRows();\n}\nfunction openDue() { setSub('all'); showToast(dueToday() + ' follop' + (dueToday() === 1 ? '' : 's') + ' due today'); }\nfunction renderTagFilter() {\n  const list = filterListFor(scope);\n  const el = document.getElementById('tagfilter');\n  document.getElementById('seg-sub').style.display = scope === 'mine' ? '' : 'none';\n  if (!list) { el.innerHTML = `<span style=\"font-size:12.5px;color:var(--text-muted)\">${scope === 'pool' ? 'Unclaimed · first come, first served' : scope === 'mine' ? SUBS[sub].note : ''}<\u002Fspan>`; return; }\n  el.innerHTML = `<button class=\"${!tagFilter ? 'on' : ''}\" onclick=\"setTag(null)\">All<\u002Fbutton>` +\n    list.map(t => `<button class=\"${tagFilter === t ? 'on' : ''}\" onclick=\"setTag('${t.replace(/'/g, \"\\\\'\")}')\">${t}<\u002Fbutton>`).join('');\n}\nfunction setTag(t) { tagFilter = t; sel = null; cursor = 0; closeLead(); renderTagFilter(); renderRows(); }\nconst filteredCount = () => LEADS.filter(l => inScope(l, scope) && (scope !== 'mine' || sub === 'all' || l.sub === sub)).length;\n\n/* ============================ list ============================ */\nfunction renderRows() {\n  const rows = filtered();\n  document.getElementById('row-count').textContent = rows.length + (rows.length === 1 ? ' lead' : ' leads');\n  Object.keys(STAGES).forEach(s => {\n    const el = document.getElementById('np-' + s);\n    if (el) el.textContent = countFor(s);\n  });\n  ['new', 'follop', 'photos'].forEach(k => {\n    const el = document.getElementById('np-sub-' + k);\n    if (el) el.textContent = countSub(k);\n  });\n  const due = document.getElementById('np-due');\n  if (due) due.textContent = dueToday();\n\n  document.getElementById('rows').innerHTML = rows.length ? rows.map((l, i) => `\n    <div class=\"row ${sel === i ? 'sel' : ''} ${cursor === i ? 'cursor' : ''} ${checks.has(l.id) ? 'checked' : ''}\" onclick=\"pick(${i})\">\n      <div class=\"cb\" onclick=\"event.stopPropagation();toggleCheck(${l.id})\">✓<\u002Fdiv>\n      <div class=\"row__main\">\n        <div class=\"row__l1\">\n          <span class=\"row__name\">${l.name}<\u002Fspan>\n          ${l.stage === 'mine' && l.tag ? tagHtml(l.tag) : ''}\n          ${(l.tags || []).slice(0, 2).map(t => `<span class=\"tag tag-highvalue\">${esc(t)}<\u002Fspan>`).join('')}\n          ${l.stage === 'mine' && l.sub === 'photos' ? '<span class=\"stage-chip\" data-s=\"photos\">Waiting for photos<\u002Fspan>' : ''}\n          ${l.stage === 'lost' && l.lostReason ? `<span class=\"tag tag-cna3\">${l.lostReason}<\u002Fspan>` : ''}\n          ${l.stage === 'bd' ? `<span class=\"stage-chip\" data-s=\"qualified\">${l.bdStage}<\u002Fspan><span class=\"tag tag-followup\">${l.qualifiedTo}<\u002Fspan>` : ''}\n          ${photoCount(l) ? `<span class=\"thumbs\">${(l.images || []).slice(0, 3).map(im => `<span class=\"thumb\" style=\"background-image:url(${im.url});background-size:cover\"><\u002Fspan>`).join('')}${Array.from({ length: Math.max(0, Math.min(photoCount(l), 3) - (l.images || []).length) }, () => '<span class=\"thumb\"><\u002Fspan>').join('')}<\u002Fspan>` : ''}\n        <\u002Fdiv>\n        <div class=\"row__l2\">\n          <span class=\"plat\" data-p=\"${l.platform}\"><i><\u002Fi>${l.platform}<\u002Fspan>\n          <span>${l.phone}<\u002Fspan><span class=\"dot\"><\u002Fspan>\n          <span>${l.place}<\u002Fspan>\n          ${l.source !== l.platform ? `<span class=\"dot\"><\u002Fspan><span>${l.source}<\u002Fspan>` : ''}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row__right\">\n        <span class=\"row__val\">${l.category}<\u002Fspan>\n        <span class=\"row__due ${isHot(l) ? 'hot' : ''}\">${dueLabel(l)}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('')\n    : '<div style=\"padding:28px 16px;font-size:14px;color:var(--text-muted)\">No leads in this stage match that filter.<\u002Fdiv>';\n\n  [['bd', BD_STAGES, 'bdStage'], ['lost', LOST_REASONS, 'lostReason']].forEach(([s, list, key]) => {\n    const box = document.getElementById(s + '-tags');\n    if (!box) return;\n    box.innerHTML = list.map(t => {\n      const n = LEADS.filter(l => inScope(l, s) && l[key] === t).length;\n      return `<div class=\"nav-pop__item\" onclick=\"go('${s}');setTag('${t.replace(/'/g, \"\\\\'\")}')\"><span class=\"lab\">${t}<\u002Fspan><span class=\"meta\">${n}<\u002Fspan><\u002Fdiv>`;\n    }).join('');\n  });\n\n  renderBulk();\n  const d2 = document.getElementById('np-due2');\n  if (d2) d2.textContent = dueToday();\n  if (document.getElementById('view-dash').classList.contains('active')) renderDash();\n}\nfunction dueLabel(l) {\n  if (l.stage === 'lost') return 'Lost ' + l.wonLostDate;\n  if (l.stage === 'bd') return 'With BD since ' + (l.qualifiedDate.split(',')[0] || '');\n  if (l.stage === 'unassigned') return 'Waiting to be claimed';\n  if (l.followAt) return 'Follop ' + l.followAt.replace(' 2026', '');\n  return 'No follop set';\n}\nconst isHot = l => !!l.followAt && l.followAt.startsWith('23 Aug');\n\nfunction renderBulk() {\n  const bar = document.getElementById('bulkbar');\n  bar.classList.toggle('on', checks.size > 0);\n  const tp = document.getElementById('bulk-tags');\n  if (tp) {\n    if (!checks.size) tp.classList.remove('on');\n    tp.innerHTML = MY_TAGS.map(t => `<button onclick=\"bulkTag('${t.replace(/'/g, \"\\\\'\")}')\">${esc(t)}<\u002Fbutton>`).join('');\n  }\n  document.getElementById('bulk-n').textContent = checks.size + ' selected';\n  const btn = document.getElementById('bulk-assign');\n  if (btn) btn.style.display = scope === 'pool' ? '' : 'none';\n}\nfunction toggleCheck(id) { checks.has(id) ? checks.delete(id) : checks.add(id); renderRows(); }\nfunction clearChecks() { checks.clear(); renderRows(); }\n\nfunction pick(i) {\n  sel = i; cursor = i;\n  renderRows(); renderDetail();\n  document.getElementById('pane-detail').classList.add('on');\n  document.getElementById('sheet-scrim').classList.add('on');\n}\nfunction closeLead() {\n  editing = null;\n  document.getElementById('pane-detail').classList.remove('on');\n  document.getElementById('sheet-scrim').classList.remove('on');\n  sel = null;\n  renderRows();\n}\nconst sheetOpen = () => document.getElementById('pane-detail').classList.contains('on');\nfunction pickById(id) { const i = filtered().findIndex(l => l.id === id); if (i >= 0) pick(i); }\nconst current = () => (sel !== null ? filtered()[sel] : null);\n\n/* ============================ detail ============================ */\nfunction renderDetail() {\n  const pane = document.getElementById('pane-detail');\n  const l = current();\n  if (!l) { pane.innerHTML = ''; return; }\n\n  const mine = l.stage === 'mine' && l.owner === ME;\n  const transferred = !!l.transferredBy;\n  const assignedLabel = transferred ? 'Lead transferred by' : 'Lead assigned by';\n  const assignedWho = transferred ? (l.transferredBy || '—') : l.assignedBy;\n  const toLabel = transferred ? 'Lead transferred to' : 'Lead assigned date';\n  const toWho = transferred ? (l.transferredTo || '—') : l.assignedDate;\n\n  const kb = k => `<span class=\"kbd-hint\" style=\"border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#cfc4b3\">${k}<\u002Fspan>`;\n  const actions = l.stage === 'unassigned'\n    ? `<button class=\"btn btn-signal\" onclick=\"openAssign(${l.id})\">Claim lead <span class=\"kbd-hint\" style=\"border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:#fff\">a<\u002Fspan><\u002Fbutton>`\n    : mine ? `\n      <button class=\"btn\" onclick=\"openCall()\">Call ${kb('c')}<\u002Fbutton>\n      <button class=\"btn\" onclick=\"openModal('modal-wa')\">WhatsApp<\u002Fbutton>\n      <button class=\"btn\" onclick=\"openFollop()\">${l.followAt ? 'Change follop' : 'Add follop'} ${kb('f')}<\u002Fbutton>\n      <button class=\"btn\" onclick=\"openMove()\">Set stage ${kb('m')}<\u002Fbutton>\n      <button class=\"btn btn-signal\" onclick=\"openBd()\">Hand off to BD ${kb('b')}<\u002Fbutton>\n      <button class=\"btn\" onclick=\"openLost()\">Mark lost ${kb('l')}<\u002Fbutton>`\n    : l.stage === 'bd'\n      ? `<span class=\"readonly-badge\" style=\"color:#b3a998;border-color:rgba(255,255,255,.16)\">read-only — ${l.qualifiedTo} owns this now<\u002Fspan>`\n      : '<span class=\"readonly-badge\" style=\"color:#b3a998;border-color:rgba(255,255,255,.16)\">read-only — closed<\u002Fspan>';\n\n  const notes = l.notes || [], log = l.log || [];\n  const ed = editing === l.id;\n  const canEdit = mine;\n  const txt = (k, v) => ed ? `<input class=\"edit\" id=\"ed-${k}\" value=\"${String(v).replace(/\"/g, '&quot;')}\">` : v;\n  const opt = (k, v, list) => ed\n    ? `<select class=\"edit\" id=\"ed-${k}\">${list.map(o => `<option${o === v ? ' selected' : ''}>${o}<\u002Foption>`).join('')}<\u002Fselect>`\n    : v;\n\n  pane.innerHTML = `\n    <div class=\"sheet-close\" onclick=\"closeLead()\" title=\"Close (esc)\">✕<\u002Fdiv>\n    <div class=\"d-band\">\n      <div class=\"d-band__top\">\n        <div style=\"min-width:0\">\n          <h2>${l.name}<\u002Fh2>\n          <div class=\"who\">${l.phone} · ${l.place} · came in from ${l.platform}${l.source !== l.platform ? ' · source ' + l.source : ''}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"val\" style=\"font-size:14.5px;font-weight:600\">${l.stage === 'unassigned' ? 'Unclaimed' : l.stage === 'mine' ? SUBS[l.sub || 'new'].label : l.stage === 'bd' ? l.bdStage : 'Lost'}<small>${l.stage === 'unassigned' ? 'Pool' : STAGES[l.stage].label}<\u002Fsmall><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"d-band__foot\">\n        ${l.tag ? tagHtml(l.tag) : ''}\n        ${l.stage === 'lost' && l.lostReason ? `<span class=\"tag\">${l.lostReason}<\u002Fspan>` : ''}\n        ${l.stage === 'bd' ? `<span class=\"tag\">${l.qualifiedTo}<\u002Fspan>` : ''}\n        <span class=\"tag\">${l.category}<\u002Fspan>\n        ${actions}\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"d-scroll\">\n    <div class=\"d-body\">\n      <div class=\"d-sec\">\n        <div class=\"d-sec__head\">\n          <h4>Lead details<\u002Fh4>\n          <span class=\"aux\">${canEdit\n            ? (ed ? '<button class=\"btn btn-signal\" onclick=\"saveEdit()\">Save<\u002Fbutton> <button class=\"btn btn-outline\" onclick=\"cancelEdit()\">Discard<\u002Fbutton>'\n                  : `<button class=\"btn btn-outline\" onclick=\"startEdit(${l.id})\">Edit details<\u002Fbutton>`)\n            : 'Read-only'}<\u002Fspan>\n        <\u002Fdiv>\n        ${ed ? '<div class=\"edit-note\"><span>Dates, stage and ownership are written by the system — those stay locked. Every edit is recorded in the activity log.<\u002Fspan><\u002Fdiv>' : ''}\n        <div class=\"kv\">\n          <div><dt>1 · Customer name<\u002Fdt><dd>${txt('name', l.name)}<\u002Fdd><\u002Fdiv>\n          <div><dt>2 · Phone number<\u002Fdt><dd>${txt('phone', l.phone)}<\u002Fdd><\u002Fdiv>\n          <div><dt>3 · Place<\u002Fdt><dd>${txt('place', l.place)}<\u002Fdd><\u002Fdiv>\n          <div><dt>Came in from<\u002Fdt><dd>${ed ? opt('platform', l.platform, PLATFORMS) : `<span class=\"plat\" data-p=\"${l.platform}\"><i><\u002Fi>${l.platform}<\u002Fspan>`}<\u002Fdd><\u002Fdiv>\n          <div><dt>4 · Lead source<\u002Fdt><dd>${opt('source', l.source, [...new Set([...PLATFORMS, 'Mathis Lead', 'Dhina Lead', l.source])])}<\u002Fdd><\u002Fdiv>\n          <div><dt>5 · Lead created date<\u002Fdt><dd class=\"locked\">${l.created}<\u002Fdd><\u002Fdiv>\n          <div><dt>6 · ${toLabel}<\u002Fdt><dd class=\"locked\">${toWho}<\u002Fdd><\u002Fdiv>\n          <div><dt>7 · ${assignedLabel}<\u002Fdt><dd class=\"locked\">${assignedWho}<\u002Fdd><\u002Fdiv>\n          <div><dt>8 · Lead qualified date<\u002Fdt><dd class=\"locked\">${l.qualifiedDate}<\u002Fdd><\u002Fdiv>\n          <div><dt>9 · Lead qualified to<\u002Fdt><dd class=\"locked\">${l.qualifiedTo}<\u002Fdd><\u002Fdiv>\n          <div><dt>10 · Lead stage<\u002Fdt><dd class=\"locked\">${l.stage === 'unassigned' ? 'Unclaimed Pool'\n            : l.stage === 'mine' ? 'My Leads · ' + SUBS[l.sub || 'new'].label\n            : l.stage === 'bd' ? 'Handed to BD · ' + l.bdStage\n            : 'Lost · ' + l.lostReason}<\u002Fdd><\u002Fdiv>\n          <div><dt>11 · Lead won / lost date<\u002Fdt><dd class=\"locked\">${l.wonLostDate}${l.lostReason ? ' · ' + l.lostReason : ''}<\u002Fdd><\u002Fdiv>\n          <div><dt>Product category<\u002Fdt><dd>${opt('category', l.category, CATEGORIES)}<\u002Fdd><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"d-sec\">\n        <div class=\"d-sec__head\"><h4>Requirement<\u002Fh4><span class=\"aux\">${l.stage === 'unassigned' ? 'Claim it before scheduling anything' : l.followAt ? 'Next follop ' + l.followAt : 'No follop yet — add one'}<\u002Fspan><\u002Fdiv>\n        <div class=\"kv\">\n          <div><dt>What they asked for<\u002Fdt><dd>${ed ? `<textarea class=\"edit\" id=\"ed-req\" rows=\"2\">${esc(l.req)}<\u002Ftextarea>` : l.req}<\u002Fdd><\u002Fdiv>\n          ${l.stage === 'unassigned' ? '' : `<div><dt>Next follop date &amp; time<\u002Fdt><dd>${l.followAt || 'None yet — add one when ready'}<\u002Fdd><\u002Fdiv>`}\n        <\u002Fdiv>\n        <div class=\"photos ${mine ? 'can-drop' : ''}\" style=\"margin-top:12px\"\n             ${mine ? 'ondragover=\"photoDrag(event,true)\" ondragleave=\"photoDrag(event,false)\" ondrop=\"photoDrop(event)\"' : ''}>\n          ${(l.images || []).map((im, i) => `<div class=\"photo\" style=\"background-image:url(${im.url})\">\n            <span class=\"cap\">${esc(im.name)}<\u002Fspan>\n            ${mine ? `<span class=\"x\" onclick=\"removePhoto(${i})\" title=\"Remove\">✕<\u002Fspan>` : ''}\n          <\u002Fdiv>`).join('')}\n          ${Array.from({ length: l.photos || 0 }, (_, i) => `<div class=\"photo\">site_photo_0${i + 1}<\u002Fdiv>`).join('')}\n          ${mine ? '<div class=\"photo-add\" onclick=\"pickPhotos()\"><b>＋<\u002Fb>Upload<br>or drop<\u002Fdiv>' : ''}\n        <\u002Fdiv>\n        ${!mine && !l.photos && !(l.images || []).length ? '<div class=\"hint\" style=\"margin-top:10px\">No photos on this lead.<\u002Fdiv>' : ''}\n        ${mine && l.sub === 'photos' && !(l.images || []).length && !l.photos ? '<div class=\"hint\" style=\"margin-top:9px\">Nothing received yet — this is what the stage is waiting on.<\u002Fdiv>' : ''}\n      <\u002Fdiv>\n\n      ${l.stage === 'bd' ? `\n      <div class=\"d-sec\">\n        <div class=\"d-sec__head\"><h4>With BD<\u002Fh4><span class=\"aux\">You cannot change any of this<\u002Fspan><\u002Fdiv>\n        <div class=\"kv\">\n          <div><dt>Handed to<\u002Fdt><dd>${l.qualifiedTo}<\u002Fdd><\u002Fdiv>\n          <div><dt>Handed off on<\u002Fdt><dd>${l.qualifiedDate}<\u002Fdd><\u002Fdiv>\n          <div><dt>BD stage<\u002Fdt><dd class=\"big\">${l.bdStage}<\u002Fdd><\u002Fdiv>\n          <div><dt>Outcome<\u002Fdt><dd>${l.wonLostDate !== '—' ? l.wonLostDate : 'Still open with BD'}<\u002Fdd><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>` : ''}\n\n      ${mine ? `\n      <div class=\"d-sec\">\n        <div class=\"d-sec__head\"><h4>Tags<\u002Fh4><span class=\"aux\">${l.tag ? 'stage tag is set by the stage' : 'issued by Admin'}<\u002Fspan><\u002Fdiv>\n        <div class=\"tagbox\">\n          ${l.tag ? tagHtml(l.tag) : ''}\n          ${(l.tags || []).map((t, i) => `<span class=\"tag tag-highvalue\">${esc(t)}<span class=\"rm\" onclick=\"untag(${i})\" title=\"Remove\">✕<\u002Fspan><\u002Fspan>`).join('')}\n          ${!l.tag && !(l.tags || []).length ? '<span style=\"font-size:12.5px;color:var(--text-muted)\">No tags yet.<\u002Fspan>' : ''}\n        <\u002Fdiv>\n        <div class=\"tag-lock\">Admin decides which tags exist. Pick one below — you can’t create your own.<\u002Fdiv>\n        <div class=\"tag-pick\">${MY_TAGS.filter(t => !(l.tags || []).includes(t)).map(t =>\n          `<button onclick=\"tagLead('${t.replace(/'/g, \"\\\\'\")}')\">+ ${esc(t)}<\u002Fbutton>`).join('')}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"d-sec\">\n        <div class=\"d-sec__head\"><h4>Notes<\u002Fh4><span class=\"aux\">${notes.length} ${notes.length === 1 ? 'note' : 'notes'} · <span class=\"kbd-hint\">n<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div class=\"note-new\">\n          <textarea id=\"note-input\" placeholder=\"Customer quirks, gate codes, who to ask for…\"><\u002Ftextarea>\n          <div class=\"r\">\n            <div class=\"swatches\">${NOTE_COLORS.map(c => `<div class=\"swatch ${c === noteColor ? 'on' : ''}\" style=\"background:${c}\" onclick=\"pickColor('${c}')\"><\u002Fdiv>`).join('')}<\u002Fdiv>\n            <button class=\"btn btn-signal\" style=\"margin-left:auto\" onclick=\"addNote()\">Add note<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"notes-stack\">${notes.length ? notes.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)).map(n => {\n          const idx = notes.indexOf(n);\n          return `<div class=\"note ${n.pinned ? 'pin' : ''}\" style=\"background:${n.color}\">\n            <p>${esc(n.text)}<\u002Fp>\n            <div class=\"note__foot\"><span>${n.at}<\u002Fspan>\n              <span class=\"note__act\"><span onclick=\"togglePin(${idx})\">${n.pinned ? 'Unpin' : 'Pin'}<\u002Fspan><span onclick=\"deleteNote(${idx})\">Delete<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>`;\n        }).join('') : '<div style=\"font-size:13px;color:var(--text-muted)\">No notes yet.<\u002Fdiv>'}<\u002Fdiv>\n      <\u002Fdiv>` : ''}\n\n      <div class=\"d-sec\">\n        <div class=\"d-sec__head\"><h4>Activity<\u002Fh4><span class=\"aux\">${log.length} ${log.length === 1 ? 'entry' : 'entries'}<\u002Fspan><\u002Fdiv>\n        ${log.length ? `<div class=\"tl\">${log.map(e => {\n          const r = REPS[e.by] || REPS.System;\n          return `<div class=\"tl-item\">\n            <div class=\"tl-av\" style=\"background:${r.bg};color:${r.fg}\" title=\"${e.by}\">${r.init}<\u002Fdiv>\n            <div class=\"tl-body\"><div class=\"t\">${e.t}<\u002Fdiv><div class=\"m\">${e.m}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>`;\n        }).join('')}<\u002Fdiv>` : '<div style=\"font-size:13px;color:var(--text-muted)\">Nothing yet — activity starts when the lead is assigned.<\u002Fdiv>'}\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n/* ============================ nav ============================ */\nconst SET_TITLES = {\n  profile: 'Profile & name', photo: 'Profile picture', security: 'Password & security',\n  leadsettings: 'Lead settings', notifications: 'Notifications', templates: 'Message templates',\n};\nfunction setNav(group, subKey) {\n  document.querySelectorAll('.nav-group').forEach(g => g.classList.remove('open'));\n  document.querySelectorAll('.nav-parent').forEach(p => p.classList.remove('active'));\n  document.querySelectorAll('.nav-pop__item').forEach(a => a.classList.remove('on'));\n  const g = document.getElementById(group);\n  if (!g) return;\n  g.querySelector('.nav-parent').classList.add('active');\n  if (subKey != null) g.querySelectorAll('.nav-pop__item').forEach(a => {\n    if (a.dataset.key === String(subKey)) a.classList.add('on');\n  });\n}\nfunction navTap(groupId, where) {\n  const g = document.getElementById(groupId);\n  if (window.innerWidth <= 900 && g && !g.classList.contains('open')) {\n    document.querySelectorAll('.nav-group').forEach(x => x.classList.remove('open'));\n    g.classList.add('open');\n    return;\n  }\n  go(where);\n}\nfunction showView(id) {\n  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));\n  document.getElementById(id).classList.add('active');\n}\nfunction title(t, c) {\n  document.getElementById('page-title').textContent = t;\n  document.getElementById('page-crumb').textContent = c;\n}\nfunction showSet(pane) {\n  document.querySelectorAll('.set-pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + pane));\n  document.querySelectorAll('.set-rail a').forEach(a => a.classList.toggle('on', a.dataset.pane === pane));\n  document.querySelectorAll('#g-settings .nav-pop__item').forEach(a => a.classList.toggle('on', a.dataset.key === pane));\n  title('Settings', SET_TITLES[pane] || 'Account and workspace');\n  if (pane === 'leadsettings') fillTransferLeads();\n}\nfunction go(where, arg) {\n  if (where === 'dash') {\n    closeLead(); setNav('g-dash', 'dash'); showView('view-dash');\n    title('Dashboard', 'Your numbers this week');\n    renderDash();\n    return;\n  }\n  if (where === 'settings') {\n    const pane = arg || 'profile';\n    closeLead(); setNav('g-settings', pane); showView('view-settings'); showSet(pane);\n    return;\n  }\n  const next = STAGES[where] ? where : 'pool';\n  closeLead();\n  if (next !== scope) { sel = null; cursor = 0; checks.clear(); tagFilter = null; sub = 'all'; }\n  scope = next;\n  if (next === 'mine') sub = arg && SUBS[arg] ? arg : 'all';\n  setNav('g-' + next, next === 'mine' ? (sub === 'all' ? 'mine' : sub) : next);\n  showView('view-work');\n  const n = filteredCount();\n  title(next === 'mine' && sub !== 'all' ? SUBS[sub].label : STAGES[next].label, n + ' lead' + (n === 1 ? '' : 's'));\n  document.querySelectorAll('#seg-sub button').forEach(b => b.classList.toggle('on', b.dataset.sub === sub));\n  renderStagebar(); renderTagFilter(); renderRows(); renderDetail();\n}\n\ndocument.addEventListener('click', (e) => {\n  if (window.innerWidth <= 900) return;\n  const sb = document.querySelector('.sidebar');\n  if (!e.target.closest('.nav-group')) document.querySelectorAll('.nav-group').forEach(g => g.classList.remove('open'));\n  if (sb && e.target.closest('.nav-pop__item, .nav-parent')) {\n    document.querySelectorAll('.nav-group').forEach(g => g.classList.remove('open'));\n    sb.setAttribute('data-quiet', '');\n  }\n});\ndocument.querySelector('.sidebar')?.addEventListener('mouseleave', () =>\n  document.querySelector('.sidebar')?.removeAttribute('data-quiet'));\n\n/* ============================ notes ============================ */\nfunction pickColor(c) { noteColor = c; renderDetail(); }\nfunction addNote() {\n  const box = document.getElementById('note-input');\n  const text = (box?.value || '').trim();\n  if (!text) { showToast('Write something first'); return; }\n  const l = current(); if (!l) return;\n  l.notes.unshift({ text, color: noteColor, at: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }), pinned: false });\n  renderDetail(); renderRows();\n  showToast('Note added to this lead');\n}\nfunction togglePin(i) { const l = current(); l.notes[i].pinned = !l.notes[i].pinned; renderDetail(); }\nfunction deleteNote(i) { const l = current(); l.notes.splice(i, 1); renderDetail(); showToast('Note deleted'); }\n\n/* ============================ editing the record ============================ */\nfunction startEdit(id) { editing = id; renderDetail(); }\nfunction cancelEdit() { editing = null; renderDetail(); }\nfunction saveEdit() {\n  const l = current(); if (!l) return;\n  const get = k => document.getElementById('ed-' + k)?.value;\n  const name = (get('name') || '').trim();\n  const phone = (get('phone') || '').trim();\n  if (!name) { showToast('Customer name cannot be empty'); return; }\n  if (!phone) { showToast('Phone number cannot be empty'); return; }\n  const before = { name: l.name, phone: l.phone, place: l.place, platform: l.platform, source: l.source, category: l.category, req: l.req };\n  l.name = name; l.phone = phone;\n  l.place = (get('place') || '').trim() || '—';\n  l.platform = get('platform') || l.platform;\n  l.source = get('source') || l.source;\n  l.category = get('category') || l.category;\n  l.req = (get('req') || '').trim() || l.req;\n  const changed = Object.keys(before).filter(k => before[k] !== l[k]);\n  editing = null;\n  if (changed.length) {\n    const now = new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });\n    l.log.push({ by: ME, t: 'Lead details edited', m: now + ' · ' + changed.map(k => '<em>' + k + '<\u002Fem>').join(', ') });\n  }\n  renderRows(); renderDetail();\n  showToast(changed.length ? 'Lead details updated' : 'No changes to save');\n}\n\n/* ============================ tags ============================ */\nfunction tagLead(t) {\n  const l = current();\n  if (!l || l.stage !== 'mine') { showToast('You can only tag your own leads'); return; }\n  t = String(t).trim();\n  if (!t) return;\n  l.tags = l.tags || [];\n  if (l.tags.includes(t)) { showToast('Already tagged ' + t); return; }\n  if (!MY_TAGS.includes(t)) { showToast('“' + t + '” is not one of the tags Admin issued'); return; }\n  l.tags.push(t);\n  l.log.push({ by: ME, t: 'Tagged ' + t, m: stamp() });\n  renderDetail(); renderRows();\n  showToast(l.name + ' tagged ' + t);\n}\n\nfunction untag(i) {\n  const l = current(); if (!l || !l.tags) return;\n  const [gone] = l.tags.splice(i, 1);\n  if (gone) l.log.push({ by: ME, t: 'Tag removed · ' + gone, m: stamp() });\n  renderDetail(); renderRows();\n  showToast('Tag removed');\n}\n\n/* ============================ photos ============================ */\nfunction pickPhotos() { document.getElementById('photo-input').click(); }\nfunction photoDrag(e, on) {\n  e.preventDefault();\n  e.currentTarget.classList.toggle('drop-on', on);\n}\nfunction photoDrop(e) {\n  e.preventDefault();\n  e.currentTarget.classList.remove('drop-on');\n  takePhotos(e.dataTransfer.files);\n}\nfunction takePhotos(files) {\n  const l = current();\n  if (!l || l.stage !== 'mine') { showToast('You can only add photos to your own leads'); return; }\n  const imgs = [...(files || [])].filter(f => f.type.startsWith('image/'));\n  if (!imgs.length) { showToast('Only image files can be attached'); return; }\n  l.images = l.images || [];\n  imgs.forEach(f => l.images.push({ name: f.name, url: URL.createObjectURL(f) }));\n  l.log.push({ by: ME, t: imgs.length + ' photo' + (imgs.length > 1 ? 's' : '') + ' attached', m: stamp() + ' · ' + imgs.map(f => '<em>' + esc(f.name) + '<\u002Fem>').join(', ') });\n  renderDetail(); renderRows();\n  showToast(imgs.length + ' photo' + (imgs.length > 1 ? 's' : '') + ' attached to ' + l.name +\n    (l.sub === 'photos' ? ' — set the stage when you have everything' : ''));\n}\nfunction removePhoto(i) {\n  const l = current(); if (!l || !l.images) return;\n  const [gone] = l.images.splice(i, 1);\n  if (gone) {\n    URL.revokeObjectURL(gone.url);\n    l.log.push({ by: ME, t: 'Photo removed', m: stamp() + ' · <em>' + esc(gone.name) + '<\u002Fem>' });\n  }\n  renderDetail(); renderRows();\n  showToast('Photo removed');\n}\nconst photoCount = l => (l.photos || 0) + ((l.images || []).length);\n\n/* ============================ assign ============================ */\nlet assignId = null;\nfunction openAssign(id) {\n  const l = LEADS.find(x => x.id === id); if (!l) return;\n  assignId = id;\n  document.getElementById('assign-lead-name').innerHTML =\n    `Claim <strong style=\"color:var(--text-strong)\">${l.name}<\u002Fstrong> out of the unclaimed pool? It moves into <strong style=\"color:var(--text-strong)\">My Leads<\u002Fstrong> and is hidden from every other CRE.`;\n  openModal('modal-assign');\n}\nfunction assignOne(id) {\n  const l = LEADS.find(x => x.id === id);\n  if (!l || l.stage !== 'unassigned') return null;\n  const now = new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });\n  l.stage = 'mine'; l.sub = 'new'; l.owner = ME; l.assignedBy = 'Self-assigned'; l.assignedDate = now; l.followAt = '';\n  l.log.push({ by: ME, t: 'Claimed from the unclaimed pool', m: now + ' · hidden from other CREs' });\n  return l;\n}\nfunction confirmAssign() {\n  const l = assignOne(assignId);\n  closeModal('modal-assign');\n  if (!l) return;\n  pushNotif('pool', l.name, 'You claimed this lead', 'It is now yours and hidden from every other CRE.');\n  closeLead(); renderRows();\n  showToast(l.name + ' claimed — now in My Leads');\n}\nfunction bulkAssign() {\n  let n = 0;\n  [...checks].forEach(id => { if (assignOne(id)) n++; });\n  checks.clear(); closeLead(); renderRows();\n  showToast(n ? n + ' lead' + (n > 1 ? 's' : '') + ' claimed' : 'Nothing claimable in that selection');\n}\nfunction bulkTag(tag) {\n  if (!checks.size) return;\n  if (!tag) { document.getElementById('bulk-tags').classList.toggle('on'); return; }\n  let n = 0;\n  [...checks].forEach(id => {\n    const l = LEADS.find(x => x.id === id);\n    if (!l || l.stage !== 'mine') return;\n    l.tags = l.tags || [];\n    if (!l.tags.includes(tag)) { l.tags.push(tag); l.log.push({ by: ME, t: 'Tagged ' + tag, m: stamp() }); n++; }\n  });\n  document.getElementById('bulk-tags').classList.remove('on');\n  checks.clear(); renderRows();\n  showToast(n ? n + ' lead' + (n > 1 ? 's' : '') + ' tagged ' + tag : 'Only your own leads can be tagged');\n}\n\n/* ============================ call & whatsapp ============================ */\nfunction openCall() {\n  const l = current(); if (!l) return;\n  document.getElementById('call-to').textContent = l.phone;\n  document.getElementById('call-follop').style.display = '';\n  document.getElementById('call-nofollop').style.display = 'none';\n  openModal('modal-call');\n}\nfunction confirmCallLog() {\n  const s = document.getElementById('call-summary').value.trim();\n  if (!s) { showToast('Call summary is required before closing'); return; }\n  const l = current(); if (!l) return;\n  const d = document.getElementById('followup-date').value;\n  if (!d) { showToast('Next follop date and time are required'); return; }\n  closeModal('modal-call');\n  logEntry(ME, 'Call logged', 'Just now · <em>' + esc(s) + '<\u002Fem>');\n  l.followAt = fmtWhen(d, document.getElementById('followup-time').value || '10:00');\n  logEntry('System', 'Next follop set', l.followAt + ' · notification scheduled');\n  document.getElementById('call-summary').value = '';\n  renderRows();\n  showToast('Call saved · follop scheduled for ' + l.followAt);\n}\nfunction fmtWhen(d, t) {\n  const [hh, mm] = t.split(':').map(Number);\n  const date = new Date(d + 'T00:00');\n  const ampm = hh >= 12 ? 'PM' : 'AM';\n  const h12 = ((hh + 11) % 12) + 1;\n  return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' + h12 + ':' + String(mm).padStart(2, '0') + ' ' + ampm;\n}\nfunction pickTemplate(el) {\n  document.querySelectorAll('.wa-template').forEach(t => t.classList.remove('picked'));\n  el.classList.add('picked');\n}\nfunction sendWa() {\n  const custom = document.getElementById('wa-custom').value.trim();\n  const picked = document.querySelector('.wa-template.picked');\n  if (!custom && !picked) { showToast('Pick the default message or write one'); return; }\n  closeModal('modal-wa');\n  document.getElementById('wa-custom').value = '';\n  logEntry('System', custom ? 'WhatsApp · custom message sent' : 'WhatsApp · default message sent', 'Just now · queued for delivery');\n  const cl = current(); if (cl) pushNotif('wa', cl.name, 'WhatsApp message delivered', 'Delivery receipt written back to the activity log.');\n  showToast('WhatsApp message sent');\n}\nfunction logEntry(by, t, m) {\n  const l = current(); if (!l) return;\n  (l.log = l.log || []).push({ by, t, m });\n  renderDetail();\n}\n\n/* ============================ follop ============================ */\nfunction openFollop() {\n  const l = current(); if (!l) return;\n  document.getElementById('fu-clear').style.display = l.followAt ? '' : 'none';\n  openModal('modal-followup');\n}\nfunction saveFollop() {\n  const l = current(); if (!l) return;\n  const d = document.getElementById('fu-date').value;\n  if (!d) { showToast('Pick a date'); return; }\n  l.followAt = fmtWhen(d, document.getElementById('fu-time').value || '10:00');\n  const note = document.getElementById('fu-note').value.trim();\n  closeModal('modal-followup');\n  document.getElementById('fu-note').value = '';\n  logEntry(ME, 'Follop scheduled', l.followAt + (note ? ' · <em>' + esc(note) + '<\u002Fem>' : ''));\n  pushNotif('follop', l.name, 'Follop set for ' + l.followAt, 'You will be reminded at that time' + (note ? ' · ' + esc(note) : '') + '.');\n  renderRows();\n  showToast('Follop set for ' + l.followAt);\n}\nfunction clearFollop() {\n  const l = current(); if (!l) return;\n  l.followAt = '';\n  closeModal('modal-followup');\n  logEntry(ME, 'Follop removed', 'Just now · no follop scheduled');\n  renderRows();\n  showToast('Follop removed');\n}\n\n/* ============================ set stage (inside My Leads) ============================ */\nfunction fillSelect(id, list) {\n  const el = document.getElementById(id);\n  if (el) el.innerHTML = list.map(x => `<option>${x}<\u002Foption>`).join('');\n}\nfunction openMove() {\n  const l = current(); if (!l || l.stage !== 'mine') return;\n  fillSelect('mv-category', CATEGORIES);\n  fillSelect('mv-follop-tag', FOLLOP_TAGS);\n  fillSelect('mv-photo-tag', PHOTO_TAGS);\n  document.getElementById('mv-category').value = l.category;\n  document.getElementById('mv-stage').value = l.sub || 'new';\n  stageForm();\n  openModal('modal-stage');\n}\nfunction stageForm() {\n  const s = document.getElementById('mv-stage').value;\n  ['follop', 'photos'].forEach(k => document.getElementById('mv-' + k).style.display = s === k ? '' : 'none');\n}\nfunction confirmMove() {\n  const l = current(); if (!l) return;\n  const s = document.getElementById('mv-stage').value;\n  const now = stamp();\n  let detail = '';\n\n  if (s === 'follop') {\n    const d = document.getElementById('mv-date').value;\n    if (!d) { showToast('All Follops needs a next follop date'); return; }\n    l.tag = document.getElementById('mv-follop-tag').value;\n    l.followAt = fmtWhen(d, document.getElementById('mv-time').value || '10:00');\n    detail = l.tag + ' · next follop ' + l.followAt;\n  } else if (s === 'photos') {\n    l.tag = document.getElementById('mv-photo-tag').value;\n    detail = l.tag;\n  } else {\n    l.tag = '';\n    detail = 'not yet worked';\n  }\n\n  l.category = document.getElementById('mv-category').value;\n  l.sub = s;\n  closeModal('modal-stage');\n  l.log.push({ by: ME, t: 'Stage set to ' + SUBS[s].label, m: now + ' · ' + detail + ' · category ' + l.category });\n  closeLead(); renderRows();\n  showToast(l.name + ' → ' + SUBS[s].label + (detail ? ' · ' + detail : ''));\n}\n\n/* ============================ hand off to BD ============================ */\nfunction openBd() {\n  const l = current(); if (!l || l.stage !== 'mine') return;\n  fillSelect('bd-to', BDES);\n  document.getElementById('bd-lead-name').innerHTML =\n    `Hand <strong style=\"color:var(--text-strong)\">${l.name}<\u002Fstrong> to the BD team? It leaves My Leads for good — after this you can only watch the stage BD puts it in.`;\n  openModal('modal-bd');\n}\nfunction confirmBd() {\n  const l = current(); if (!l) return;\n  const to = document.getElementById('bd-to').value;\n  const note = document.getElementById('bd-note').value.trim();\n  if (!note) { showToast('BD needs a hand-off note'); return; }\n  const verified = document.getElementById('bd-verified').value;\n  const now = stamp();\n  l.stage = 'bd'; l.sub = null; l.owner = null; l.tag = '';\n  l.qualifiedTo = to; l.qualifiedDate = now; l.bdStage = 'Received by BD'; l.followAt = '';\n  l.log.push({ by: ME, t: 'Handed off to ' + to, m: now + ' · <em>' + esc(note) + '<\u002Fem> · ' + verified.toLowerCase() });\n  closeModal('modal-bd');\n  document.getElementById('bd-note').value = '';\n  pushNotif('bd', l.name, to + ' received the lead', 'Hand-off accepted — you now have read-only visibility.');\n  closeLead(); renderRows();\n  showToast(l.name + ' handed to ' + to + ' — now read-only for you');\n}\n\n/* ============================ mark lost ============================ */\nfunction openLost() {\n  const l = current(); if (!l || l.stage !== 'mine') return;\n  fillSelect('lost-reason', LOST_REASONS);\n  document.getElementById('lost-lead-name').innerHTML =\n    `Close <strong style=\"color:var(--text-strong)\">${l.name}<\u002Fstrong> as lost? A reason is mandatory and the lead leaves your working lists.`;\n  openModal('modal-lost');\n}\nfunction confirmLost() {\n  const l = current(); if (!l) return;\n  const reason = document.getElementById('lost-reason').value;\n  const note = document.getElementById('lost-note').value.trim();\n  const now = stamp();\n  l.stage = 'lost'; l.sub = null; l.owner = null; l.tag = ''; l.followAt = '';\n  l.lostReason = reason; l.wonLostDate = now.split(',')[0];\n  l.log.push({ by: ME, t: 'Marked Lost · ' + reason, m: now + (note ? ' · <em>' + esc(note) + '<\u002Fem>' : '') });\n  closeModal('modal-lost');\n  document.getElementById('lost-note').value = '';\n  closeLead(); renderRows();\n  showToast(l.name + ' marked lost · ' + reason);\n}\n\n/* ============================ transfer from settings ============================ */\nfunction fillTransferLeads() {\n  const s = document.getElementById('tr-lead');\n  if (!s) return;\n  const mine = LEADS.filter(l => l.stage === 'mine' && l.owner === ME);\n  s.innerHTML = mine.length\n    ? mine.map(l => `<option value=\"${l.id}\">${l.name} — ${SUBS[l.sub || 'new'].label}<\u002Foption>`).join('')\n    : '<option value=\"\">No leads to hand off<\u002Foption>';\n}\nfunction transferLead() {\n  const id = parseInt(document.getElementById('tr-lead').value, 10);\n  const lead = LEADS.find(l => l.id === id);\n  if (!lead) { showToast('No lead selected'); return; }\n  const to = document.getElementById('tr-to').value;\n  const reason = document.getElementById('tr-reason').value;\n  const note = document.getElementById('tr-note').value.trim();\n  if (!note) { showToast('A hand-over note is required by your transfer rules'); return; }\n  const now = new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });\n  if (to.startsWith('Back to')) {\n    lead.stage = 'unassigned'; lead.sub = null; lead.owner = null; lead.followAt = ''; lead.tag = '';\n    lead.assignedBy = '—'; lead.assignedDate = '—';\n    lead.log.push({ by: ME, t: 'Released to the unclaimed pool', m: now + ' · ' + reason.toLowerCase() + ' · ' + esc(note) });\n  } else if (to.startsWith('BDE')) {\n    lead.stage = 'bd'; lead.sub = null; lead.owner = null; lead.tag = ''; lead.followAt = '';\n    lead.qualifiedTo = to; lead.qualifiedDate = now; lead.bdStage = 'Received by BD';\n    lead.log.push({ by: ME, t: 'Handed off to ' + to, m: now + ' · ' + reason.toLowerCase() + ' · ' + esc(note) });\n  } else {\n    lead.owner = null; lead.transferredBy = ME; lead.transferredTo = to; lead.source = 'Mathis Lead';\n    lead.log.push({ by: ME, t: 'Transferred to ' + to, m: now + ' · ' + reason.toLowerCase() + ' · ' + esc(note) });\n  }\n  document.getElementById('tr-note').value = '';\n  closeLead(); fillTransferLeads(); renderRows();\n  showToast(to.startsWith('Back to') ? lead.name + ' released to the unclaimed pool' : lead.name + ' handed to ' + to);\n}\n\n/* ============================ settings ============================ */\nfunction saveName() {\n  const n = document.getElementById('set-name').value.trim();\n  if (!n) { showToast('Name cannot be empty'); return; }\n  document.getElementById('foot-name').textContent = n;\n  const init = n.split(/\\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();\n  ['topbar-avatar', 'avatar-lg'].forEach(id => {\n    const el = document.getElementById(id);\n    if (el && !el.style.backgroundImage) el.textContent = init;\n  });\n  showToast('Profile updated');\n}\nfunction resetName() {\n  document.getElementById('set-name').value = document.getElementById('foot-name').textContent;\n  showToast('Changes discarded');\n}\nfunction loadPic(input) {\n  const f = input.files && input.files[0];\n  if (!f) return;\n  const url = URL.createObjectURL(f);\n  ['avatar-lg', 'topbar-avatar'].forEach(id => {\n    const el = document.getElementById(id);\n    el.style.backgroundImage = 'url(' + url + ')';\n    el.textContent = '';\n  });\n  showToast('Profile picture updated');\n}\nfunction removePic() {\n  ['avatar-lg', 'topbar-avatar'].forEach(id => document.getElementById(id).style.backgroundImage = '');\n  saveName();\n  showToast('Profile picture removed');\n}\nfunction gaugePw() {\n  const v = document.getElementById('pw-new').value;\n  let score = 0;\n  if (v.length >= 10) score++;\n  if (/\\d/.test(v)) score++;\n  if (/[^A-Za-z0-9]/.test(v)) score++;\n  if (/[A-Z]/.test(v)) score++;\n  const fill = document.getElementById('pw-fill');\n  fill.style.width = [0, 30, 55, 80, 100][score] + '%';\n  fill.style.background = score <= 1 ? 'var(--signal-red)' : score === 2 ? 'var(--signal-amber)' : 'var(--signal-green)';\n  document.getElementById('pw-hint').textContent =\n    !v ? 'Use 10+ characters with a number and a symbol.'\n    : score <= 1 ? 'Too weak — add length, a number and a symbol.'\n    : score === 2 ? 'Getting there — add a symbol or capital.'\n    : 'Strong password.';\n}\nfunction resetPassword() {\n  const o = document.getElementById('pw-old').value;\n  const n = document.getElementById('pw-new').value;\n  const c = document.getElementById('pw-confirm').value;\n  if (!o) { showToast('Enter your current password'); return; }\n  if (n.length < 10) { showToast('New password must be at least 10 characters'); return; }\n  if (n !== c) { showToast('Passwords do not match'); return; }\n  ['pw-old', 'pw-new', 'pw-confirm'].forEach(id => document.getElementById(id).value = '');\n  gaugePw();\n  showToast('Password updated · other sessions signed out');\n}\n\n/* ============================ keyboard ============================ */\nfunction showKeys() { openModal('modal-keys'); }\nconst G_STAGE = { '1': 'pool', '2': 'mine', '3': 'bd', '4': 'lost' };\nlet gPending = false;\ndocument.addEventListener('keydown', (e) => {\n  const t = e.target.tagName;\n  const typing = t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT';\n\n  if (e.key === 'Escape') {\n    if (document.getElementById('notif').classList.contains('on')) { closeNotif(); return; }\n    const open = document.querySelectorAll('.modal-overlay.open');\n    if (open.length) { open.forEach(m => m.classList.remove('open')); return; }\n    if (sheetOpen()) { closeLead(); return; }\n    if (typing) e.target.blur();\n    return;\n  }\n  if (typing) return;\n  if (e.key === '/') { e.preventDefault(); document.getElementById('cre-search').focus(); return; }\n  if (e.key === '?') { showKeys(); return; }\n  if (e.key === 'i') { toggleNotif(); return; }\n\n  if (gPending) {\n    gPending = false;\n    if (e.key === 'd') return go('dash');\n    if (G_STAGE[e.key]) return go(G_STAGE[e.key]);\n    if (e.key === 's') return go('settings');\n  }\n  if (e.key === 'g') { gPending = true; setTimeout(() => gPending = false, 900); return; }\n\n  if (document.getElementById('view-settings').classList.contains('active')) return;\n  if (document.getElementById('view-dash').classList.contains('active')) return;\n  const rows = filtered();\n  if (!rows.length) return;\n\n  if (e.key === 'j') { cursor = Math.min(cursor + 1, rows.length - 1); sheetOpen() ? pick(cursor) : renderRows(); e.preventDefault(); }\n  else if (e.key === 'k') { cursor = Math.max(cursor - 1, 0); sheetOpen() ? pick(cursor) : renderRows(); e.preventDefault(); }\n  else if (e.key === 'Enter') pick(cursor);\n  else if (e.key === 'x') { toggleCheck(rows[cursor].id); e.preventDefault(); }\n  else if (e.key === 'a' && rows[cursor].stage === 'unassigned') openAssign(rows[cursor].id);\n  else if (sel !== null && (rows[sel].owner === ME || rows[sel].transferredTo === ME)) {\n    if (e.key === 'c') openCall();\n    else if (e.key === 'f') openFollop();\n    else if (e.key === 'w') openModal('modal-wa');\n    else if (e.key === 'm') openMove();\n    else if (e.key === 'n') { e.preventDefault(); document.getElementById('note-input')?.focus(); }\n  }\n});\n\n/* ============================ boot ============================ */\npaintThemeSwitch();\nrenderNotifs();\ngo('pool');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
